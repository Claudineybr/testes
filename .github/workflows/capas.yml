name: Aplicar Capas (por URL de vídeo)

on:
  schedule:
    - cron: '0,30 * * * *'
  workflow_dispatch:
    inputs:
      lote:
        description: 'URLs para visitar por run'
        default: '200'
      retry_all:
        description: 'Reprocessar tudo (limpa cache/mapa/visitados)?'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: capas-sem-capa
  cancel-in-progress: false

jobs:
  extrair:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Aplicar capas por URL de vídeo
        env:
          LOTE: ${{ inputs.lote || '200' }}
          RETRY_ALL: ${{ inputs.retry_all || 'false' }}
          PYTHONUNBUFFERED: '1'
        run: |
          cat > /tmp/capas.py << 'PYEOF'
          import re, json, requests, sys, os, time, random
          from pathlib import Path
          from bs4 import BeautifulSoup

          BASE_URL    = "https://www.vini7xgrave.site"
          HEADERS     = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"}
          PLACEHOLDER = "https://via.placeholder.com/500x750?text=Sem+Capa"
          LOTE        = int(os.environ.get("LOTE") or "200")
          RETRY_ALL   = os.environ.get("RETRY_ALL", "false").lower() == "true"

          ARQ_MAPA      = Path("capas_mapa.json")
          ARQ_STATUS    = Path("capas_status.json")
          ARQ_FEED_CT   = Path("capas_feed_cache.json")
          ARQ_VISITADOS = Path("capas_links_visitados.txt")

          CACHE_VERSION = 5

          REQ_DELAY_BASE   = 2.5
          REQ_DELAY_JITTER = 1.0
          FEED_PAGE_DELAY  = 1.5
          FEED_PAGE_JITTER = 0.5
          BACKOFF_429_BASE = 30
          ABORT_APOS_429   = 5

          _delay_atual = {"valor": REQ_DELAY_BASE}

          START_TS = time.time()
          def log(*a):
              e = int(time.time() - START_TS)
              print(f"[+{e:>4}s]", *a, flush=True); sys.stdout.flush()

          def _jitter(base, j):
              return max(0.5, base + random.uniform(-j, j))

          def _bump_delay(fator=1.5, cap=15.0):
              novo = min(_delay_atual["valor"] * fator, cap)
              if novo > _delay_atual["valor"]:
                  _delay_atual["valor"] = novo
                  log(f"    [adaptativo] delay subiu para {novo:.2f}s")

          def safe_get(url, timeout=20, retries=2):
              for attempt in range(retries + 1):
                  try:
                      r = requests.get(url, headers=HEADERS, timeout=timeout)
                      if r.status_code == 429:
                          wait = BACKOFF_429_BASE * (2 ** attempt)
                          log(f"    429 rate-limited, aguardando {wait}s (attempt {attempt+1})...")
                          _bump_delay()
                          time.sleep(wait)
                          continue
                      return r
                  except Exception as e:
                      if attempt == retries:
                          return None
                      time.sleep(3)
              return None

          def safe_get_site(url, timeout=30, max_retries=3, wait_s=30):
              for attempt in range(max_retries + 1):
                  if attempt > 0:
                      log(f"    retry {attempt}/{max_retries} em {wait_s}s...")
                      time.sleep(wait_s)
                  try:
                      r = requests.get(url, headers=HEADERS, timeout=timeout)
                      if r.status_code == 200:
                          if attempt > 0:
                              log(f"    ok apos {attempt} retry(s)")
                          return r
                      log(f"    HTTP {r.status_code}")
                      if r.status_code == 429:
                          _bump_delay(fator=2.0, cap=20.0)
                      if r.status_code not in (429, 500, 502, 503, 504):
                          return r
                  except Exception as e:
                      log(f"    erro conexao: {e}")
              log(f"    falhou apos {max_retries} retries ({max_retries * wait_s}s)")
              return None

          def is_valid_cover(url):
              if not url or not isinstance(url, str): return False
              url = url.strip()
              if len(url) < 15: return False
              if not (url.startswith('http://') or url.startswith('https://')): return False
              if 'via.placeholder.com' in url: return False
              if 'placehold.co' in url: return False
              return True

          def norm_video(url):
              if not url: return ""
              return url.strip().split('?')[0].split('#')[0].rstrip('/').lower()

          def norm_title(t):
              if not t: return ""
              t = t.lower().strip()
              t = re.sub(r'^(assistir|ver|onde assistir|onde ver)\s+', '', t)
              t = re.sub(r'\s*[-–|]\s*[\w\s]*clau[\w\s]*$', '', t, flags=re.I)
              t = re.sub(r'\s*[-–|]\s*[\w\s]*vini7xgrave[\w\s]*$', '', t, flags=re.I)
              t = re.sub(r'\s*[-–]\s*t\d+e\d+.*$', '', t, flags=re.I)
              t = re.sub(r'\(\d+\)', '', t)
              t = re.sub(r'\b(19|20)\d{2}\b', '', t)
              t = re.sub(r'\b(online|dublado|legendado|hdcam|completo|filme|serie|t\d+e\d+)\b', '', t, flags=re.I)
              t = re.sub(r'[^\w\s]', ' ', t)
              return re.sub(r'\s+', ' ', t).strip()

          def extrair_video_e_capa(html):
              video = capa = None
              for pat in [
                  r'"contentUrl"\s*:\s*"([^"]+)"',
                  r'<video[^>]+src=["\']([^"\']+)["\']',
                  r'<source[^>]+src=["\']([^"\']+\.(?:mp4|m3u8)[^"\']*)["\']',
                  r'<iframe[^>]+src=["\']([^"\']+\.(?:mp4|m3u8)[^"\']*)["\']',
              ]:
                  m = re.search(pat, html, re.I)
                  if m: video = m.group(1); break
              for pat in [
                  r'"thumbnailUrl"\s*:\s*(?:\[\s*)?"(https?://[^"]+)"',
                  r'<meta[^>]*property=["\']og:image["\'][^>]*content=["\'](https?://[^"\']+)["\']',
                  r'<video[^>]+poster=["\'](https?://[^"\']+)["\']',
              ]:
                  m = re.search(pat, html, re.I)
                  if m and is_valid_cover(m.group(1)):
                      capa = m.group(1); break
              return video, capa

          def listar_sem_capa():
              log("Listando arquivos locais SEM capa...")
              sem_capa_urls = {}
              sem_capa_titles = {}
              sem_url = []
              total = 0
              for arq in sorted(Path('.').rglob('*.html')):
                  if '.git' in arq.parts: continue
                  try: texto = arq.read_text(encoding='utf-8', errors='ignore')
                  except: continue
                  if PLACEHOLDER not in texto: continue
                  total += 1
                  m = re.search(r'"contentUrl"\s*:\s*"([^"]+)"', texto)
                  if not m:
                      m = re.search(r'<video[^>]+src=["\']([^"\']+)["\']', texto)
                  if not m:
                      sem_url.append(arq.name); continue
                  url_orig = m.group(1).strip()
                  vk = norm_video(url_orig)
                  if not vk:
                      sem_url.append(arq.name); continue
                  tm = re.search(r'"name"\s*:\s*"([^"]+)"', texto)
                  titulos = []
                  if tm: titulos.append(norm_title(tm.group(1)))
                  titulos.append(norm_title(arq.stem))
                  titulos = [t for t in titulos if t]
                  if vk not in sem_capa_urls:
                      sem_capa_urls[vk] = {'url': url_orig, 'arquivos': [], 'titulos': titulos}
                  sem_capa_urls[vk]['arquivos'].append(arq)
                  for t in titulos:
                      sem_capa_titles.setdefault(t, []).append(arq)
              log(f"  Arquivos sem capa: {total} | URLs unicas: {len(sem_capa_urls)} | sem contentUrl: {len(sem_url)}")
              return sem_capa_urls, sem_capa_titles, sem_url

          def processar_feed(sem_capa_urls, sem_capa_titles):
              log("Processando feed do Blogger...")
              feed_by_video = {}
              visit_candidates = {}
              feed_all_keys = set()

              if ARQ_FEED_CT.exists() and not RETRY_ALL:
                  try:
                      cached = json.loads(ARQ_FEED_CT.read_text(encoding='utf-8'))
                      if cached.get('version') != CACHE_VERSION:
                          log(f"  cache versao antiga, refazendo")
                      elif time.time() - cached.get('ts', 0) > 7200:
                          log(f"  cache expirado (>2h), refazendo")
                      elif not cached.get('scan_complete'):
                          log(f"  cache incompleto, refazendo")
                      else:
                          feed_by_video = {k: v for k, v in cached.get('feed_by_video', {}).items() if k in sem_capa_urls}
                          for link, hint in cached.get('visit_candidates', {}).items():
                              if hint and hint not in sem_capa_urls: continue
                              visit_candidates[link] = hint
                          feed_all_keys = set(cached.get('feed_all_keys', []))
                          log(f"  cache OK: feed_by_video={len(feed_by_video)} visit_candidates={len(visit_candidates)}")
                          return feed_by_video, visit_candidates, feed_all_keys
                  except Exception as e:
                      log(f"  erro cache: {e}")

              entries_total = entries_with_video = matched_video = 0
              page = 0
              start = 1
              while True:
                  try:
                      u = f"{BASE_URL}/feeds/posts/default?alt=json&max-results=150&start-index={start}"
                      r = safe_get_site(u) if page == 0 else safe_get(u, timeout=30)
                      if not r or r.status_code != 200: break
                      entries = r.json().get("feed", {}).get("entry", [])
                      if not entries: break
                      entries_total += len(entries)
                      for e in entries:
                          link = next((l["href"] for l in e.get("link", []) if l.get("rel") == "alternate"), None)
                          if not link: continue
                          link = link.split("?")[0]
                          title = (e.get("title") or {}).get("$t", "")
                          content = (e.get("content") or {}).get("$t", "")
                          video, capa = extrair_video_e_capa(content)
                          if video:
                              entries_with_video += 1
                              vk = norm_video(video)
                              feed_all_keys.add(vk)
                              if vk in sem_capa_urls:
                                  matched_video += 1
                                  if is_valid_cover(capa):
                                      feed_by_video[vk] = capa
                                  else:
                                      visit_candidates[link] = vk
                          elif title:
                              tnorm = norm_title(title)
                              if tnorm and tnorm in sem_capa_titles:
                                  visit_candidates[link] = None
                      page += 1
                      log(f"  page {page}: {len(entries)} entries | feed_by_video={len(feed_by_video)} visit_candidates={len(visit_candidates)}")
                      if len(entries) < 150: break
                      start += 150
                      time.sleep(_jitter(FEED_PAGE_DELAY, FEED_PAGE_JITTER))
                  except Exception as e:
                      log(f"  erro feed: {e}"); break

              log(f"  Feed: {entries_total} entries | com video: {entries_with_video} | matches: {matched_video}")
              log(f"  feed_by_video={len(feed_by_video)} | visit_candidates={len(visit_candidates)}")

              if feed_all_keys and sem_capa_urls:
                  inter = feed_all_keys & set(sem_capa_urls.keys())
                  log(f"  DIAGNOSTICO: intersecao={len(inter)} (feed={len(feed_all_keys)} x locais={len(sem_capa_urls)})")

              ARQ_FEED_CT.write_text(json.dumps({
                  'version': CACHE_VERSION,
                  'ts': time.time(),
                  'scan_complete': True,
                  'feed_by_video': feed_by_video,
                  'visit_candidates': visit_candidates,
                  'feed_all_keys': list(feed_all_keys),
              }, ensure_ascii=False), encoding='utf-8')
              return feed_by_video, visit_candidates, feed_all_keys

          def visitar_pendentes(visit_candidates, sem_capa_urls, mapa):
              links_visitados = set()
              if ARQ_VISITADOS.exists() and not RETRY_ALL:
                  try:
                      links_visitados = set(l.strip() for l in ARQ_VISITADOS.read_text(encoding='utf-8').splitlines() if l.strip())
                  except: pass

              fila = [(link, hint) for link, hint in visit_candidates.items()
                      if link not in links_visitados and (not hint or hint not in mapa)]
              fila.sort(key=lambda x: (0 if x[1] else 1, x[0]))

              if not fila:
                  log("  Nada para visitar (todos visitados ou ja resolvidos).")
                  return 0

              log(f"Visitando {min(len(fila), LOTE)} de {len(fila)} candidatos (delay={_delay_atual['valor']:.2f}s)...")
              sucesso = 0
              falhas_consecutivas = 0
              qtd_429 = 0

              for i, (link, hint) in enumerate(fila[:LOTE], 1):
                  if falhas_consecutivas >= 3:
                      log(f"  {falhas_consecutivas} falhas consecutivas - site fora. Abortando.")
                      break
                  if qtd_429 >= ABORT_APOS_429:
                      log(f"  {qtd_429} x 429 - site bloqueando. Abortando.")
                      break

                  log(f"  [{i}] {link}")
                  try:
                      r = safe_get(link, timeout=20)

                      if r is None:
                          falhas_consecutivas += 1
                          log(f"    falha rede/timeout (#{falhas_consecutivas})")
                          links_visitados.add(link)
                          continue

                      if r.status_code == 429:
                          qtd_429 += 1
                          log(f"    429 (#{qtd_429}) - pulando, delay={_delay_atual['valor']:.2f}s")
                          continue

                      if r.status_code != 200:
                          log(f"    HTTP {r.status_code}")
                          links_visitados.add(link)
                          continue

                      falhas_consecutivas = 0
                      qtd_429 = 0

                      video, capa = extrair_video_e_capa(r.text)
                      if not video:
                          log(f"    sem video URL")
                          links_visitados.add(link)
                          continue

                      vk = norm_video(video)
                      if vk not in sem_capa_urls:
                          log(f"    video nao corresponde")
                          links_visitados.add(link)
                          continue

                      if not is_valid_cover(capa):
                          soup = BeautifulSoup(r.text, 'html.parser')
                          og = soup.find('meta', property='og:image')
                          if og and is_valid_cover(og.get('content')):
                              capa = og.get('content')

                      if is_valid_cover(capa):
                          mapa[vk] = capa
                          sucesso += 1
                          log(f"    OK capa")
                      else:
                          log(f"    sem capa")
                      links_visitados.add(link)
                  except Exception as e:
                      log(f"    erro processamento: {e}")
                      links_visitados.add(link)
                  finally:
                      time.sleep(_jitter(_delay_atual["valor"], REQ_DELAY_JITTER))

              ARQ_VISITADOS.write_text("\n".join(sorted(links_visitados)), encoding='utf-8')
              log(f"  Visitados OK: {sucesso} | 429s: {qtd_429} | delay final: {_delay_atual['valor']:.2f}s")
              return sucesso

          def aplicar_mapa(sem_capa_urls, mapa):
              log(f"\nAplicando {len(mapa)} capas...")
              alterados = 0
              sem_match = 0
              for vk, info in sem_capa_urls.items():
                  if vk not in mapa or not is_valid_cover(mapa[vk]):
                      sem_match += 1
                      continue
                  capa = mapa[vk]
                  for arq in info['arquivos']:
                      try: texto = arq.read_text(encoding='utf-8', errors='ignore')
                      except: continue
                      if PLACEHOLDER not in texto: continue
                      novo = texto.replace(PLACEHOLDER, capa)
                      if novo != texto:
                          arq.write_text(novo, encoding='utf-8')
                          alterados += 1
              log(f"  Aplicados: {alterados} arquivos | Sem match: {sem_match} URLs")
              return alterados, sem_match

          def main():
              if ARQ_FEED_CT.exists() and not RETRY_ALL:
                  try:
                      cached = json.loads(ARQ_FEED_CT.read_text(encoding='utf-8'))
                      if cached.get('version') != CACHE_VERSION:
                          log(f"Cache antigo: limpando links visitados")
                          if ARQ_VISITADOS.exists():
                              ARQ_VISITADOS.unlink()
                  except: pass

              sem_capa_urls, sem_capa_titles, sem_url = listar_sem_capa()
              if not sem_capa_urls:
                  log("Nenhum arquivo com URL de video sem capa. Nada a fazer.")
                  ARQ_STATUS.write_text(json.dumps({
                      'total_sem_capa_urls': 0,
                      'sem_url_video': len(sem_url),
                      'mapa_size': 0,
                      'done': True,
                      'motivo': 'sem URLs de video sem capa'
                  }, ensure_ascii=False, indent=2), encoding='utf-8')
                  return

              mapa = {}
              if ARQ_MAPA.exists() and not RETRY_ALL:
                  try:
                      raw = json.loads(ARQ_MAPA.read_text(encoding='utf-8'))
                      mapa = {k: v for k, v in raw.items() if k in sem_capa_urls and is_valid_cover(v)}
                      log(f"Mapa existente (filtrado): {len(mapa)}")
                  except: mapa = {}
              elif RETRY_ALL:
                  log("RETRY_ALL: limpando")

              feed_by_video, visit_candidates, feed_all_keys = processar_feed(sem_capa_urls, sem_capa_titles)

              novos_feed = 0
              for k, v in feed_by_video.items():
                  if k not in mapa:
                      mapa[k] = v
                      novos_feed += 1
                      log(f"Feed adicionou {novos_feed} capas novas")

        visitados_ok = visitar_pendentes(visit_candidates, sem_capa_urls, mapa)

        ARQ_MAPA.write_text(json.dumps(mapa, ensure_ascii=False, indent=2), encoding='utf-8')

        alterados, sem_match = aplicar_mapa(sem_capa_urls, mapa)

        faltam_video = len([k for k in sem_capa_urls if k not in mapa])

        links_visitados = set()
        if ARQ_VISITADOS.exists():
            try:
                links_visitados = set(l.strip() for l in ARQ_VISITADOS.read_text(encoding='utf-8').splitlines() if l.strip())
            except: pass
        faltam_visitar = len([l for l, h in visit_candidates.items() if l not in links_visitados and (not h or h not in mapa)])

        inter = len(feed_all_keys & set(sem_capa_urls.keys()))
        if faltam_video > 0 and inter == 0 and faltam_visitar == 0:
            done = True
            motivo = "IMPOSSIVEL: videos locais nao existem no feed atual (CDN diferente)"
            log(f"\nAVISO: {motivo}")
        elif faltam_video == 0:
            done = True
            motivo = "todos resolvidos"
        else:
            done = False
            motivo = f"{faltam_video} videos sem capa, {faltam_visitar} candidatos pendentes"

        ARQ_STATUS.write_text(json.dumps({
            'total_sem_capa_urls': len(sem_capa_urls),
            'sem_url_video': len(sem_url),
            'mapa_size': len(mapa),
            'novos_feed': novos_feed,
            'novos_visitados': visitados_ok,
            'faltam_video': faltam_video,
            'faltam_visitar': faltam_visitar,
            'feed_all_keys': len(feed_all_keys),
            'intersecao': inter,
            'alterados': alterados,
            'sem_match': sem_match,
            'delay_final': round(_delay_atual["valor"], 2),
            'done': done,
            'motivo': motivo,
        }, ensure_ascii=False, indent=2), encoding='utf-8')

        log(f"\nFINAL: sem_capa={len(sem_capa_urls)} | mapa={len(mapa)} | novos_feed={novos_feed} | visitados={visitados_ok} | faltam_video={faltam_video} | faltam_visitar={faltam_visitar} | inter={inter}/{len(feed_all_keys)} | delay={_delay_atual['valor']:.2f}s | done={done}")

    if __name__ == "__main__":
        main()
    PYEOF
    python3 /tmp/capas.py

- name: Salvar progresso
  run: |
    git config user.name "github-actions[bot]"
    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
    git add -f capas_mapa.json capas_status.json capas_feed_cache.json capas_links_visitados.txt 2>/dev/null || true
    git add -f *.html 2>/dev/null || true
    if git diff --cached --quiet; then echo "Nada novo."; exit 0; fi
    git commit -m "chore: capas por URL de vídeo [skip ci]"

    for i in $(seq 1 5); do
      if git push origin HEAD:main; then break; fi
      git fetch origin main
      git reset --mixed origin/main
      git add -f capas_mapa.json capas_status.json capas_feed_cache.json capas_links_visitados.txt 2>/dev/null || true
      git add -f *.html 2>/dev/null || true
      git commit -m "chore: retry $i" || true
      sleep $((RANDOM % 10 + 5))
    done

- name: Disparar próxima run (se necessário)
  if: success()
  env:
    GH_TOKEN: ${{ secrets.PAT_CHAIN }}
    REPO: ${{ github.repository }}
  run: |
    DONE=$(python3 -c "import json; print(json.load(open('capas_status.json')).get('done', False))" 2>/dev/null || echo False)
    FALTAM=$(python3 -c "import json; print(json.load(open('capas_status.json')).get('faltam_visitar', 0))" 2>/dev/null || echo 0)
    SEM=$(python3 -c "import json; print(json.load(open('capas_status.json')).get('total_sem_capa_urls', 0))" 2>/dev/null || echo 0)
    MOTIVO=$(python3 -c "import json; print(json.load(open('capas_status.json')).get('motivo', ''))" 2>/dev/null || echo '')
    INTER=$(python3 -c "import json; print(json.load(open('capas_status.json')).get('intersecao', 0))" 2>/dev/null || echo 0)
    DELAY=$(python3 -c "import json; print(json.load(open('capas_status.json')).get('delay_final', 0))" 2>/dev/null || echo 0)

    echo "Sem capa: $SEM | Intersecao: $INTER | Faltam visitar: $FALTAM | Delay: ${DELAY}s | Done: $DONE | Motivo: $MOTIVO"

    if [ "$DONE" = "True" ]; then
      echo "Chain encerrada. Motivo: $MOTIVO"
      if [ "$INTER" = "0" ] && [ "$SEM" -gt 0 ]; then
        echo "::warning::Nenhum video local casou com o feed. Os videos do site provavelmente usam outro CDN."
      fi
      exit 0
    fi

    LIMITE_ISO=$(date -u -d '60 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
    RECENTES=$(gh run list --workflow="capas.yml" --limit 100 --json event,createdAt --jq "[.[] | select(.event == \"workflow_dispatch\") | select(.createdAt > \"$LIMITE_ISO\")] | length" --repo "$REPO" 2>/dev/null || echo 0)

    if [ "$RECENTES" -ge 30 ]; then
      echo "Limite de 30 runs/hora atingido. Aguardando cron."; exit 0
    fi

    echo "Aguardando 30s..."
    sleep 30
    gh workflow run "capas.yml" --repo "$REPO" --ref main

           
