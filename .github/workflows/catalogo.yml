name: Gerar Catalogo de Filmes e Series

# Botão "Run workflow": varre os .html, gera catalogo.json e commita só se mudou.
"on":
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalogo
  cancel-in-progress: false

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar o codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gerar catalogo.json
        run: |
          python -u - <<'PYEOF'
          import html as htmllib, json, os, re, unicodedata

          IGNORAR = {"index.html", "serie.html", "404.html"}
          RX_EP = re.compile(r"^(.+?)_(?:t(\d+)e(\d+)|(\d+)x(\d+))$", re.I)
          RX_THUMB = re.compile(r'"thumbnailUrl"\s*:\s*\[\s*["\']([^"\']+)["\']', re.I)
          RX_VIDEO = re.compile(r'"contentUrl"\s*:\s*["\']([^"\']+)["\']', re.I)
          RX_IMG = re.compile(r'<img[^>]+src=["\']([^"\']+)["\']', re.I)
          RX_DATASRC = re.compile(r'data-src=["\']([^"\']+)["\']', re.I)
          RX_TITULO = re.compile(r"<h1[^>]*>(.*?)</h1>|<title[^>]*>(.*?)</title>", re.I | re.S)
          SUFIXOS = re.compile(r"\s*[-|–—]\s*(assistir|assista|online|dublado|legendado|clau\s*flix|hd|completo)[^|]*$", re.I)


          def norm(s):
              s = unicodedata.normalize("NFD", s).encode("ascii", "ignore").decode().lower()
              return re.sub(r"[^a-z0-9]+", " ", s).strip()


          def do_arquivo(slug):
              """Título legível a partir do nome do arquivo: ano duplicado vira (ANO)."""
              slug = re.sub(r"_(\d{4})_\1$", r"_\1", slug)
              m = re.search(r"^(.*?)_(\d{4})$", slug)
              base, ano = (m.group(1), m.group(2)) if m else (slug, "")
              nome = " ".join(w.capitalize() for w in re.split(r"[_\-\s]+", base) if w)
              return f"{nome} ({ano})" if ano else nome


          def do_html(conteudo, slug_norm):
              """Título do HTML (com acentos), só se bater com o nome do arquivo; senão None."""
              m = RX_TITULO.search(conteudo)
              if not m:
                  return None
              t = htmllib.unescape(re.sub(r"<[^>]+>", "", m.group(1) or m.group(2) or "")).strip()
              t = SUFIXOS.sub("", t)
              t = re.sub(r"\s*[-|–]?\s*(T\d+E\d+|\d+x\d+)\s*$", "", t, flags=re.I).strip()
              t = re.sub(r"\s*\(?\b(\d{4})\b\)?\s+\(?\1\)?$", r" (\1)", t).strip()
              sem_ano = re.sub(r"\(\d{4}\)|\b\d{4}\b", "", t)
              if t and norm(sem_ano) and slug_norm.startswith(norm(sem_ano)):
                  return t
              return None


          def extrair(conteudo):
              m = RX_THUMB.search(conteudo) or RX_IMG.search(conteudo)
              v = RX_VIDEO.search(conteudo) or RX_DATASRC.search(conteudo)
              return (m.group(1) if m else ""), (v.group(1) if v else "")


          def listar():
              for raiz, dirs, files in os.walk("."):
                  dirs[:] = [d for d in dirs if not d.startswith(".") and d != "node_modules"]
                  for f in files:
                      if f.endswith(".html") and f not in IGNORAR:
                          yield os.path.relpath(os.path.join(raiz, f), ".").replace("\\", "/"), f


          def main():
              itens, sem_video = [], 0
              for caminho, arquivo in listar():
                  slug = arquivo[:-5]
                  try:
                      conteudo = open(caminho, encoding="utf-8", errors="ignore").read()
                  except OSError as e:
                      print(f"Erro ao ler {caminho}: {e}")
                      conteudo = ""
                  thumb, video = extrair(conteudo)
                  sem_video += not video
                  m = RX_EP.match(slug)
                  if m:
                      t = int(m.group(2) or m.group(4)); e = int(m.group(3) or m.group(5))
                      serie = do_html(conteudo, norm(m.group(1))) or do_arquivo(m.group(1))
                      titulo = f"{serie} - T{t}E{e:02d}"
                  else:
                      t = e = 1
                      serie = titulo = do_html(conteudo, norm(re.sub(r"_(\d{4})_\1$", r"_\1", slug))) or do_arquivo(slug)
                  itens.append({"titulo": titulo, "serie": serie, "temporada": t, "episodio": e,
                                "link": caminho, "thumbnailUrl": thumb, "videoUrl": video})
              itens.sort(key=lambda x: (x["serie"].lower(), x["temporada"], x["episodio"], x["link"]))
              tmp = "catalogo.json.tmp"
              with open(tmp, "w", encoding="utf-8") as f:
                  json.dump(itens, f, indent=2, ensure_ascii=False)
              os.replace(tmp, "catalogo.json")
              print(f"catalogo.json: {len(itens)} itens, {sem_video} sem vídeo")


          main()
          PYEOF

      - name: Commitar catalogo.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogo.json
          if git diff --cached --quiet; then
            echo "Sem mudanças — nada a commitar."
            exit 0
          fi
          git commit -m "chore: atualiza catalogo.json [skip ci]"
          for i in 1 2 3; do
            if git pull origin "$GITHUB_REF_NAME" -X ours --no-rebase && git push; then
              exit 0
            fi
            echo "Push falhou (tentativa $i). Tentando de novo..."
            sleep 5
          done
          exit 1
