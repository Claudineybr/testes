name: Gerar Catalogo de Filmes e Series

# Botão "Run workflow": varre os .html, gera o catálogo e commita só se mudou.
# O catálogo agora sai em PARTES pequenas (o Cloudflare Pages recusa arquivo acima de 25 MiB):
#   catalogo/indice.json     lista das partes (pequeno)
#   catalogo/parte-001.json  itens no MESMO formato do antigo catalogo.json (lista de objetos), JSON minificado
#   catalogo/parte-002.json  ...  cada parte tem no máximo ~6 MB e uma série nunca é cortada ao meio
# O antigo catalogo.json (arquivo único) é apagado do repositório.
# NOMES: arquivos cujo nome é um ID (TMDB: 10002.html, 100010s01e01.html; IMDb: tt0018773.html, tt0903747s01e01.html) recebem o nome assim:
#   1) titulos.json (correção manual)  2) nome do TMDB já guardado pelo capas.yml (capas.json + detalhes/, sem chamar a API)
#   3) título que está dentro do próprio .html  4) o número do arquivo, em último caso.
# Arquivos com nome antigo (nome_do_filme_2020.html, nome_t1e2.html) continuam como antes.
# Opcional: crie a variável PREFIXO_LINKS (Settings > Secrets and variables > Actions > Variables) se as páginas
# .html passarem a ficar em outro endereço (ex.: https://paginas.exemplo.com). Ela é colocada na frente de cada "link".
"on":
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalogo
  cancel-in-progress: false

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar o codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gerar o catalogo (em partes)
        env:
          PREFIXO_LINKS: ${{ vars.PREFIXO_LINKS || '' }}
        run: |
          python -u - <<'PYEOF'
          import html as htmllib, itertools, json, os, re, shutil, sys, unicodedata

          IGNORAR = {"index.html", "serie.html", "404.html"}
          PASTA = "catalogo"
          TAMANHO_PARTE = 6 * 1024 * 1024        # bytes por parte (o Pages aceita até 25 MiB por arquivo; 6 MB deixa folga e carrega rápido)
          PREFIXO = (os.environ.get("PREFIXO_LINKS") or "").strip().rstrip("/")
          RX_EP = re.compile(r"^(.+?)_(?:t(\d+)e(\d+)|(\d+)x(\d+))$", re.I)
          RX_ID_SERIE = re.compile(r"^((?:tt)?\d+)s(\d+)e(\d+)$", re.I)   # 100010s01e01 (ID do TMDB) ou tt0903747s01e01 (ID do IMDb)
          RX_ID_FILME = re.compile(r"^((?:tt)?\d+)$", re.I)                  # 10002 (ID do TMDB) ou tt0018773 (ID do IMDb)
          RX_THUMB = re.compile(r'"thumbnailUrl"\s*:\s*\[\s*["\']([^"\']+)["\']', re.I)
          RX_VIDEO = re.compile(r'"contentUrl"\s*:\s*["\']([^"\']+)["\']', re.I)
          RX_IMG = re.compile(r'<img[^>]+src=["\']([^"\']+)["\']', re.I)
          RX_DATASRC = re.compile(r'data-src=["\']([^"\']+)["\']', re.I)
          RX_TITULO = re.compile(r"<h1[^>]*>(.*?)</h1>|<title[^>]*>(.*?)</title>", re.I | re.S)
          SUFIXOS = re.compile(r"\s*[-|–—]\s*(assistir|assista|online|dublado|legendado|clau\s*flix|hd|completo)[^|]*$", re.I)


          def norm(s):
              s = unicodedata.normalize("NFD", s).encode("ascii", "ignore").decode().lower()
              return re.sub(r"[^a-z0-9]+", " ", s).strip()


          def do_arquivo(slug):
              """Título legível a partir do nome do arquivo: ano duplicado vira (ANO)."""
              slug = re.sub(r"_(\d{4})_\1$", r"_\1", slug)
              m = re.search(r"^(.*?)_(\d{4})$", slug)
              base, ano = (m.group(1), m.group(2)) if m else (slug, "")
              nome = " ".join(w.capitalize() for w in re.split(r"[_\-\s]+", base) if w)
              return f"{nome} ({ano})" if ano else nome


          def limpar_titulo(conteudo, forte=False):
              """Título cru da página (<h1> ou <title>) sem os sufixos ("- 🍿Clau", "Assistir", "T1E1"...). None se não houver.
              forte=True também corta tudo depois do "T1E1" (ex.: "Série - T1E1 – Nome do episódio")."""
              m = RX_TITULO.search(conteudo)
              if not m:
                  return None
              t = htmllib.unescape(re.sub(r"<[^>]+>", "", m.group(1) or m.group(2) or "")).strip()
              t = re.sub(r"\s*[-|–—]?\s*[^\w\s]*\s*clau(\s*flix)?\s*$", "", t, flags=re.I)   # "- 🍿Clau"
              t = SUFIXOS.sub("", t)
              t = re.sub(r"(\(\d{4}\))(\s*[-|–—]\s*\1)+", r"\1", t)                         # "(2010) - (2010)"
              t = re.sub(r"[\s\-|–—]+$", "", t)
              if forte:
                  t = re.sub(r"\s*[-|–—]?\s*(?:T\d+\s*E(?:P)?\d+|\d+x\d+)\b.*$", "", t, flags=re.I).strip()
              else:
                  t = re.sub(r"\s*[-|–]?\s*(T\d+E\d+|\d+x\d+)\s*$", "", t, flags=re.I).strip()
              t = re.sub(r"\s*\(?\b(\d{4})\b\)?\s+\(?\1\)?$", r" (\1)", t).strip()
              return t or None


          def do_html(conteudo, slug_norm):
              """Título do HTML (com acentos), só se bater com o nome do arquivo; senão None."""
              t = limpar_titulo(conteudo)
              if not t:
                  return None
              sem_ano = re.sub(r"\(\d{4}\)|\b\d{4}\b", "", t)
              if norm(sem_ano) and slug_norm.startswith(norm(sem_ano)):
                  return t
              return None


          def arquivo_det(chave):
              """Mesmo nome que o capas.yml usa: 'serie:19' -> detalhes/serie--19.json ; filme '10002' -> detalhes/10002.json"""
              return os.path.join("detalhes", re.sub(r"[^a-z0-9_.\-]", "_", chave.lower().replace(":", "--")) + ".json")


          def com_ano(nome, ano):
              return f"{nome} ({ano})" if ano and not re.search(r"\(\d{4}\)\s*$", nome) else nome


          def extrair(conteudo):
              m = RX_THUMB.search(conteudo) or RX_IMG.search(conteudo)
              v = RX_VIDEO.search(conteudo) or RX_DATASRC.search(conteudo)
              return (m.group(1) if m else ""), (v.group(1) if v else "")


          def listar():
              for raiz, dirs, files in os.walk("."):
                  dirs[:] = [d for d in dirs if not d.startswith(".") and d != "node_modules" and d != PASTA]
                  for f in files:
                      if f.endswith(".html") and f not in IGNORAR:
                          yield os.path.relpath(os.path.join(raiz, f), ".").replace("\\", "/"), f


          def tamanho(item):
              """Bytes que o item ocupa no JSON minificado (+1 da vírgula)."""
              return len(json.dumps(item, ensure_ascii=False, separators=(",", ":")).encode("utf-8")) + 1


          def dividir(itens):
              """Agrupa por série (uma série nunca é cortada) e fecha uma parte quando passa de TAMANHO_PARTE."""
              partes, atual, tam = [], [], 2
              for _, grupo in itertools.groupby(itens, key=lambda x: x["serie"].lower()):
                  grupo = list(grupo)
                  t = sum(tamanho(i) for i in grupo)
                  if atual and tam + t > TAMANHO_PARTE:
                      partes.append(atual)
                      atual, tam = [], 2
                  atual += grupo
                  tam += t
              if atual:
                  partes.append(atual)
              return partes


          def main():
              try:
                  tit = json.load(open("titulos.json", encoding="utf-8"))
              except (OSError, ValueError):
                  tit = {}
              corrigido = lambda k: (tit.get(k) or {}).get("titulo")
              try:
                  capas = json.load(open("capas.json", encoding="utf-8"))   # nomes do TMDB guardados pelo capas.yml
              except (OSError, ValueError):
                  capas = {}
              nomes, stats = {}, {"tmdb": 0, "html": 0, "numero": 0, "manual": 0}

              def nome_do_id(chave, num, conteudo):
                  """Nome de um título cujo arquivo se chama pelo ID do TMDB. Ordem: manual > TMDB > HTML > número."""
                  if corrigido(chave):
                      stats["manual"] += 1
                      return corrigido(chave)
                  e = capas.get(chave) or {}
                  if e.get("fonte") == "tmdb" and e.get("nome"):
                      ano = None
                      try:
                          ano = json.load(open(arquivo_det(chave), encoding="utf-8")).get("ano")
                      except (OSError, ValueError):
                          pass
                      stats["tmdb"] += 1
                      return com_ano(e["nome"], ano)
                  h = limpar_titulo(conteudo, forte=True)
                  if h and not h.isdigit():
                      stats["html"] += 1
                      return h
                  stats["numero"] += 1
                  return do_arquivo(num)

              itens, metas, sem_video = [], [], 0
              for caminho, arquivo in listar():
                  slug = arquivo[:-5]
                  try:
                      conteudo = open(caminho, encoding="utf-8", errors="ignore").read()
                  except OSError as e:
                      print(f"Erro ao ler {caminho}: {e}")
                      conteudo = ""
                  thumb, video = extrair(conteudo)
                  sem_video += not video
                  ms, mf = RX_ID_SERIE.match(slug), RX_ID_FILME.match(slug)
                  num = (ms or mf).group(1) if (ms or mf) else None
                  m = None if num else RX_EP.match(slug)
                  if num:
                      chave = f"serie:{num.lower()}" if ms else slug      # mesma chave que o capas.yml usa no capas.json
                      if chave not in nomes:                       # o mesmo nome para todos os episódios da série
                          nomes[chave] = nome_do_id(chave, num, conteudo)
                      serie = nomes[chave]
                      if ms:
                          t, e = int(ms.group(2)), int(ms.group(3))
                          titulo = f"{serie} - T{t}E{e:02d}"
                      else:
                          t = e = 1
                          titulo = serie
                  elif m:
                      t = int(m.group(2) or m.group(4)); e = int(m.group(3) or m.group(5))
                      serie = corrigido("serie:" + m.group(1).lower()) or do_html(conteudo, norm(m.group(1))) or do_arquivo(m.group(1))
                      titulo = f"{serie} - T{t}E{e:02d}"
                  else:
                      t = e = 1
                      serie = titulo = corrigido(slug) or do_html(conteudo, norm(re.sub(r"_(\d{4})_\1$", r"_\1", slug))) or do_arquivo(slug)
                  link = f"{PREFIXO}/{caminho}" if PREFIXO else caminho
                  itens.append({"titulo": titulo, "serie": serie, "temporada": t, "episodio": e,
                                "link": link, "thumbnailUrl": thumb, "videoUrl": video})
                  metas.append((chave if num else "legado", num))
              if not itens:
                  print("❌ Nenhum .html encontrado; mantendo o catálogo atual sem mexer.")
                  sys.exit(1)
              usos = {}
              for it, (ident, num) in zip(itens, metas):
                  usos.setdefault(it["serie"].lower(), set()).add(ident)
              repetidos = 0
              for it, (ident, num) in zip(itens, metas):
                  if num and len(usos[it["serie"].lower()]) > 1:     # o site agrupa pelo nome: títulos diferentes não podem se misturar
                      antigo = it["serie"]
                      it["serie"] = f"{antigo} #{num}"
                      if it["titulo"].startswith(antigo):
                          it["titulo"] = it["serie"] + it["titulo"][len(antigo):]
                      repetidos += 1
              print(f"Nomes dos arquivos com ID: {stats['tmdb']} do TMDB, {stats['html']} do HTML, {stats['manual']} manuais, "
                    f"{stats['numero']} só o número; {repetidos} itens com #ID por nome repetido")
              itens.sort(key=lambda x: (x["serie"].lower(), x["temporada"], x["episodio"], x["link"]))

              partes = dividir(itens)
              tmp = PASTA + ".tmp"
              shutil.rmtree(tmp, ignore_errors=True)
              os.makedirs(tmp)
              indice = {"versao": 1, "total": len(itens), "partes": []}
              for n, parte in enumerate(partes, 1):
                  nome = f"parte-{n:03d}.json"
                  with open(f"{tmp}/{nome}", "w", encoding="utf-8") as f:
                      json.dump(parte, f, ensure_ascii=False, separators=(",", ":"))
                  indice["partes"].append({"arquivo": f"{PASTA}/{nome}", "itens": len(parte),
                                           "bytes": os.path.getsize(f"{tmp}/{nome}"),
                                           "primeira": parte[0]["serie"], "ultima": parte[-1]["serie"]})
              with open(f"{tmp}/indice.json", "w", encoding="utf-8") as f:
                  json.dump(indice, f, ensure_ascii=False, separators=(",", ":"))
              shutil.rmtree(PASTA, ignore_errors=True)
              os.replace(tmp, PASTA)
              if os.path.exists("catalogo.json"):
                  os.remove("catalogo.json")            # o arquivo único antigo passava do limite de 25 MiB do Pages
              maior = max(p["bytes"] for p in indice["partes"])
              print(f"{PASTA}/: {len(itens)} itens em {len(partes)} partes (maior: {maior / 1048576:.1f} MiB), {sem_video} sem vídeo")
              if maior > 20 * 1048576:
                  print("⚠️  Uma série sozinha passa de 20 MiB; confira o limite de 25 MiB do Pages.")


          main()
          PYEOF

      # A home baixa só este arquivo pequeno (destaques + especial de Natal) em vez das 6 partes.
      - name: Gerar a home leve (catalogo/home.json)
        run: python3 gerar_home.py

      - name: Commitar o catalogo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A catalogo
          git rm -q --ignore-unmatch catalogo.json
          if git diff --cached --quiet; then
            echo "Sem mudanças — nada a commitar."
            exit 0
          fi
          git commit -m "chore: atualiza catalogo [skip ci]"
          for i in 1 2 3; do
            if git pull origin "$GITHUB_REF_NAME" -X ours --no-rebase && git push; then
              exit 0
            fi
            echo "Push falhou (tentativa $i). Tentando de novo..."
            sleep 5
          done
          exit 1
