name: Gerar Catalogo de Filmes e Series

"on":
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Rodar script Python e Gerar JSON
        run: |
          python << 'EOF'
          import os, re, json

          arquivos = []
          for root, dirs, files in os.walk('.'):
              if '.git' in root or '.github' in root: 
                  continue
              
              for file in files:
                  if file.endswith('.html') and file != 'index.html':
                      caminho_completo = os.path.join(root, file)
                      caminho_relativo = caminho_completo.replace('.\\', '').replace('./', '').replace('\\', '/')
                      arquivos.append((caminho_relativo, file))

          episodios = []
          padrao_nome = re.compile(r'(.+)_t(\d+)e(\d+)\.html', re.IGNORECASE)
          
          # Regex 1: Acha o JSON-LD. Pula colchetes, espaços e quebras de linha.
          padrao_img_json = re.compile(r'"thumbnailUrl"\s*:\s*\[\s*["\']([^"\']+)["\']', re.IGNORECASE)
          # Regex 2 (Fallback): Acha a primeira tag <img src="...">
          padrao_img_html = re.compile(r'<img[^>]+src=["\']([^"\']+)["\']', re.IGNORECASE)

          for caminho, arquivo in sorted(arquivos):
              img_url = ""
              try:
                  with open(caminho, 'r', encoding='utf-8', errors='ignore') as f:
                      conteudo = f.read()
                      
                      # Tenta achar no JSON-LD primeiro
                      match_img = padrao_img_json.search(conteudo)
                      
                      # Se não achar, tenta achar na tag <img>
                      if not match_img:
                          match_img = padrao_img_html.search(conteudo)

                      if match_img:
                          img_url = match_img.group(1)
              except Exception as e:
                  print(f"Erro ao ler {caminho}: {e}")

              match = padrao_nome.match(arquivo)
              if match:
                  nome_serie = match.group(1).replace('_', ' ').replace('-', ' ').title()
                  temporada = int(match.group(2))
                  episodio = int(match.group(3))
                  
                  episodios.append({
                      "titulo": f"{nome_serie} - T{temporada}E{episodio:02d}",
                      "serie": nome_serie,
                      "temporada": temporada,
                      "episodio": episodio,
                      "link": caminho,
                      "thumbnailUrl": img_url
                  })
              else:
                  nome = arquivo.replace('.html', '').replace('_', ' ').replace('-', ' ').title()
                  episodios.append({
                      "titulo": nome,
                      "serie": nome,
                      "temporada": 1,
                      "episodio": 1,
                      "link": caminho,
                      "thumbnailUrl": img_url
                  })
                  
              print(f"Arquivo: {arquivo} | Imagem: {img_url if img_url else 'NÃO ENCONTRADA'}")

          with open('catalogo.json', 'w', encoding='utf-8') as f:
              json.dump(episodios, f, indent=2, ensure_ascii=False)
          
          print(f"\nCatalogo gerado com {len(episodios)} itens!")
          EOF

      - name: Configurar Git, commitar e enviar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogo.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: Atualizando catalogo.json e capas" && git push)
