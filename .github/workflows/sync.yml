name: Sincronizar pastas do repo rede

on:
  workflow_dispatch: # Permite rodar manualmente
  schedule:
    - cron: '0 */12 * * *' # Roda a cada 12 horas (ajuste se quiser)

permissions:
  contents: write # Permissão para o bot commitar no repo testes

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório testes
        uses: actions/checkout@v4

      - name: Clonar repo rede e copiar pastas
        run: |
          # Clona o repositório rede (como é público, não precisa de token)
          git clone --depth 1 https://github.com/Claudineybr/rede.git temp_rede
          
          # Remove as pastas antigas (para não misturar arquivos velhos)
          rm -rf oneplayer series_html
          
          # Copia as pastas novas
          cp -r temp_rede/oneplayer .
          cp -r temp_rede/series_html .
          
          # Limpa a pasta temporária
          rm -rf temp_rede
          
      - name: Commitar e enviar para o repo testes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add oneplayer series_html
          
          # Se não houver mudanças, não faz o commit
          if git diff --cached --quiet; then
            echo "Sem mudanças nas pastas."
          else
            git commit -m "sync: atualizando pastas oneplayer e series_html do repo rede"
            git push
          fi
