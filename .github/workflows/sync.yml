name: Sincronizar e Limpar

on:
  schedule: 
  
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Baixar, Filtrar e Publicar
        run: |
          set -e
          T=$(mktemp -d)
         
          git clone --depth 1 https://github.com/Claudineybr/api_pobreflix_filmes.git "$T/novos"
          
          cat > "$T/filtrar.py" << 'PYEOF'
          import json
          import re
          from pathlib import Path
          import shutil

          dir_origem = Path("ORIGEM_PATH") if Path("ORIGEM_PATH").exists() else None
          dir_novos = Path("NOVOS_PATH")
          dir_saida = Path("SAIDA_PATH")
          dir_saida.mkdir(parents=True, exist_ok=True)

          links_vistos = set()
          copiados = 0
          arquivos = []

          if dir_origem: arquivos.extend(list(dir_origem.glob("*.json")))
          arquivos.extend(list(dir_novos.glob("*.json")))

          def prioridade(arq):
              is_novo = 1 if dir_novos in arq.parents else 0
              return (is_novo, len(arq.name))

          arquivos.sort(key=prioridade, reverse=True)

          for arq in arquivos:
              if any(x in arq.name for x in ['pendentes', 'fila', 'feitas', 'descartados']): continue
              try:
                  texto = arq.read_text(encoding='utf-8-sig')
                  match = re.search(r'<script type="application/ld\+json">(.*?)</script>', texto, re.S)
                  dados = json.loads(match.group(1)) if match else json.loads(texto)
                  url = dados.get("contentUrl", "").strip().lower()
                  if not url or url.endswith(".ts") or ".m3u8" in url: continue
                  if url in links_vistos: continue
                  links_vistos.add(url)
                  shutil.copy2(arq, dir_saida / arq.name)
                  copiados += 1
              except Exception: pass
          print(f"Arquivos limpos e únicos copiados: {copiados}")
          PYEOF

          sed -i "s|ORIGEM_PATH|$T/origem|g; s|NOVOS_PATH|$T/novos|g; s|SAIDA_PATH|$T/saida|g" "$T/filtrar.py"
          python3 -I "$T/filtrar.py"
          
          N_OUT=$(ls "$T"/saida/*.json | wc -l)
          if [ "$N_OUT" -eq 0 ]; then exit 1; fi
          
          sed -i 's#https://redetoons\.cards#https://redetoons.my#g' "$T"/saida/*.json
          sed -i 's#🕸️ PK#🍿Clau#g' "$T"/saida/*.json
          
          rm -f ./*.json
          cp -f "$T"/saida/*.json .
          
          git config user.name "Claudineybr"
          git config user.email "Claudineybr@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "sync: atualizacao limpa"
          git pull origin main --no-rebase -X ours --no-edit || true
          git push origin HEAD:main
