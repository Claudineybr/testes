name: Sincronizar arquivos soltos do repo rede

on:
  workflow_dispatch: # Permite rodar manualmente
  schedule:
    - cron: '0 */12 * * *' # Roda a cada 12 horas

permissions:
  contents: write # Permissão para o bot commitar no repo testes

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório testes
        uses: actions/checkout@v4

      - name: Clonar repo rede e extrair arquivos soltos
        run: |
          # Clona o repositório rede (público, sem precisar de token)
          git clone --depth 1 https://github.com/Claudineybr/rede.git temp_rede
          
          # O segredo está no /* no final. 
          # Ele pega os arquivos de DENTRO das pastas e joga direto na raiz.
          cp -r temp_rede/oneplayer/* . || true
          cp -r temp_rede/series_html/* . || true
          
          # Limpa a pasta temporária
          rm -rf temp_rede
          
      - name: Commitar e enviar para o repo testes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .
          
          # Se não houver mudanças, não faz o commit
          if git diff --cached --quiet; then
            echo "Sem mudanças nos arquivos."
          else
            git commit -m "sync: atualizando arquivos soltos do repo rede"
            git push
          fi
