name: Sincronizar arquivos soltos do repo rede

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'

permissions:
  contents: write

# Isso impede que duas execuções deste workflow rodem ao mesmo tempo
concurrency:
  group: sync-testes
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório testes
        uses: actions/checkout@v4

      - name: Clonar repo rede e extrair arquivos soltos
        run: |
          # Aumenta o buffer do git para suportar pushes grandes (5 milhões de linhas)
          git config --global http.postBuffer 524288000
          
          # Clona o repositório rede
          git clone --depth 1 https://github.com/Claudineybr/rede.git temp_rede
          
          # O comando abaixo varre TODAS as subpastas de oneplayer e series_html
          # e copia apenas os ARQUIVOS para a raiz (.)
          find temp_rede/oneplayer temp_rede/series_html -type f -exec cp {} . \;
          
          # Limpa a pasta temporária
          rm -rf temp_rede
          
      - name: Commitar e enviar para o repo testes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .
          
          if git diff --cached --quiet; then
            echo "Sem mudanças nos arquivos."
            exit 0
          fi
          
          git commit -m "sync: atualizando arquivos soltos do repo rede"
          
          # Sincroniza com o repositório remoto ANTES de enviar, resolvendo o erro de lock
          git pull origin main --no-rebase -X ours --no-edit || true
          
          # Tenta enviar com até 5 tentativas em caso de falha de rede
          for i in $(seq 1 5); do
            if git push origin main; then
              echo "[SUCESSO] Push OK"
              exit 0
            fi
            echo "[FALHA] Tentando sincronizar novamente..."
            git pull origin main --no-rebase -X ours --no-edit || true
            sleep 5
          done
