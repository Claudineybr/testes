name: Sincronizar arquivos soltos do repo rede

on:
  workflow_dispatch: # Permite rodar manualmente
  schedule:
    - cron: '0 */12 * * *' # Roda a cada 12 horas

permissions:
  contents: write

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório testes
        uses: actions/checkout@v4

      - name: Clonar repo rede e extrair arquivos soltos
        run: |
          # Clona o repositório rede
          git clone --depth 1 https://github.com/Claudineybr/rede.git temp_rede
          
          # O rsync copia TUDO de dentro da pasta para a raiz (.)
          # A barra no final (oneplayer/) é o que diz para copiar o conteúdo, e não a pasta.
          rsync -a temp_rede/oneplayer/ .
          rsync -a temp_rede/series_html/ .
          
          # Limpa a pasta temporária
          rm -rf temp_rede
          
      - name: Commitar e enviar para o repo testes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .
          
          if git diff --cached --quiet; then
            echo "Sem mudanças nos arquivos."
          else
            git commit -m "sync: atualizando arquivos soltos do repo rede"
            git push
          fi
