name: Classificar filmes e séries com NVIDIA

on:
  workflow_dispatch:
  push:
    paths:
      - '**.html'

permissions:
  contents: write

concurrency:
  group: classificar
  cancel-in-progress: false

jobs:
  classificar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Limite máximo do GitHub (6 horas)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar deps
        run: pip install beautifulsoup4 openai

      - name: Rodar classificador
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -u - <<'PYEOF'
          import json, os, re, time, threading
          from bs4 import BeautifulSoup
          from openai import OpenAI
          from concurrent.futures import ThreadPoolExecutor, as_completed

          # --- TURBO MODE: 6 MODELOS EM ROTAÇÃO ---
          MODELOS = [
              "nvidia/nemotron-3-ultra-550b-a55b",
              "openai/gpt-oss-20b",
              "meta/llama-3.2-90b-vision-instruct",
              "deepseek-ai/deepseek-v4.1-flash",
              "nvidia/nemotron-3.5-lightning-30b-a3b",
              "meta/llama-3.3-70b-instruct" 
          ]

          LOTE = 20
          MAX_WORKERS = 6 # <-- Aumentado para 6 threads paralelas

          client = OpenAI(
              api_key=os.environ["NVIDIA_API_KEY"],
              base_url="https://integrate.api.nvidia.com/v1",
          )

          GENEROS = ["Ação","Aventura","Animação","Comédia","Crime","Documentário","Drama",
                     "Família","Fantasia","História","Terror","Música","Mistério","Romance",
                     "Ficção Científica","Thriller","Guerra","Faroeste"]
          PASTA, SAIDA = ".", "classificacao.json"
          IGNORAR = {"index.html", "sobre.html", "contato.html", "404.html"}

          SCHEMA = {
              "type": "object",
              "properties": {
                  "filmes": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "id":      {"type": "string"},
                              "tipo":    {"type": "string", "enum": ["filme", "serie"]},
                              "generos": {"type": "array", "items": {"type": "string", "enum": GENEROS}}
                          },
                          "required": ["id", "tipo", "generos"],
                      },
                  }
              },
              "required": ["filmes"],
          }

          cache = json.load(open(SAIDA, encoding="utf-8")) if os.path.exists(SAIDA) else {}

          log_lock = threading.Lock()
          def log(msg):
              with log_lock:
                  print(msg, flush=True)

          def extrair_titulos():
              if not os.path.isdir(PASTA): return
              for arq in sorted(os.listdir(PASTA)):
                  if not arq.endswith(".html") or arq in IGNORAR: continue
                  soup = BeautifulSoup(open(os.path.join(PASTA, arq), encoding="utf-8"), "html.parser")
                  el = soup.select_one("h1, .titulo, title")
                  if not el: continue
                  titulo = re.sub(r"\s*[-|–].*$", "", el.get_text(strip=True)).strip()
                  yield arq, titulo

          def classificar_lote_com_fallback(pares, lote_num, total_lotes, modelo_inicial):
              entrada = [{"id": str(i), "titulo": t} for i, (_, t) in enumerate(pares)]
              
              prompt = (
                  "Classifique cada título em 1 a 3 gêneros da lista fixa e identifique se é um 'filme' ou 'serie'.\n"
                  f"Gêneros permitidos: {', '.join(GENEROS)}\n"
                  "Dicas: Se o título contiver 'T1E1', 'Temporada', 'Season', 'Episódio', 'Serie', trate como 'serie'. Caso contrário, 'filme'.\n"
                  "Regras: Use APENAS os gêneros listados acima. Ignore formatos como 'Dublado' ou 'Legendado'.\n"
                  "Se não reconhecer o título de jeito nenhum, retorne generos: [].\n"
                  "Responda APENAS o JSON.\n\n"
                  + json.dumps({"filmes": entrada}, ensure_ascii=False)
              )

              idx_inicial = MODELOS.index(modelo_inicial) if modelo_inicial in MODELOS else 0
              modelos_para_tentar = MODELOS[idx_inicial:] + MODELOS[:idx_inicial]

              for modelo in modelos_para_tentar:
                  for tentativa in range(3):
                      try:
                          resp = client.chat.completions.create(
                              model=modelo,
                              messages=[{"role": "user", "content": prompt}],
                              temperature=0,
                              max_tokens=4096,
                              response_format={"type": "json_schema", "json_schema": {"name": "F", "schema": SCHEMA}},
                          )
                          
                          content = resp.choices[0].message.content
                          if not content:
                              raise ValueError("JSON vazio (modelo pensou demais)")
                              
                          data = json.loads(content)
                          por_id = {str(x.get("id")): x for x in data.get("filmes", [])}

                          result = {}
                          for i, (arq, tit) in enumerate(pares):
                              item = por_id.get(str(i), {})
                              tipo = item.get("tipo", "filme")
                              gs = [g for g in item.get("generos", []) if g in GENEROS][:3]
                              
                              result[arq] = {
                                  "titulo": tit,
                                  "tipo": tipo,
                                  "generos": gs or ["indefinido"],
                                  "fonte": "ia" if gs else "indefinido",
                              }
                          log(f"[✓] Lote {lote_num} concluído com {modelo}")
                          return result

                      except Exception as e:
                          msg = str(e)
                          if "410" in msg or "404" in msg:
                              log(f"[!] {modelo} indisponível. Pulando...")
                              break 
                          elif "429" in msg:
                              log(f"[!] Rate limit (429) em {modelo}. Aguardando {5*(tentativa+1)}s...")
                              time.sleep(5 * (tentativa + 1))
                          elif "JSON vazio" in msg:
                              log(f"[!] {modelo} não retornou JSON válido. Pulando...")
                              break 
                          else:
                              log(f"[x] Erro no lote {lote_num} ({modelo}): {e}")
                              time.sleep(1)

              log(f"[x] Lote {lote_num} falhou em todos os modelos. Marcando {len(pares)} títulos como 'indefinido'.")
              return {arq: {"titulo": tit, "tipo": "desconhecido", "generos": ["indefinido"], "fonte": "indefinido"} for arq, tit in pares}

          pendentes = [
              (a, t) for a, t in extrair_titulos() 
              if a not in cache 
              or cache[a].get("fonte") == "indefinido" 
              or "tipo" not in cache[a]
          ]
          
          if not pendentes:
              log("[info] Nenhum filme ou série pendente. Encerrando.")
              exit(0)

          total_lotes = (len(pendentes) + LOTE - 1) // LOTE
          log(f"==================================================")
          log(f"🚀 INICIANDO TURBO: {len(pendentes)} títulos em {total_lotes} lotes.")
          log(f"⚙️  {MAX_WORKERS} threads paralelas, {len(MODELOS)} modelos em rotação.")
          log(f"==================================================")

          tarefas = []
          for i in range(0, len(pendentes), LOTE):
              bloco = pendentes[i:i + LOTE]
              lote_num = (i // LOTE) + 1
              modelo_inicial = MODELOS[(lote_num - 1) % len(MODELOS)]
              tarefas.append((bloco, lote_num, total_lotes, modelo_inicial))

          inicio_execucao = time.time()
          TEMPO_LIMITE = 330 * 60 # 5h30m

          processados = 0
          with ThreadPoolExecutor(max_workers=MAX_WORKERS) as executor:
              futures = [executor.submit(classificar_lote_com_fallback, b, n, tot, m) for b, n, tot, m in tarefas]

              for future in as_completed(futures):
                  if time.time() - inicio_execucao > TEMPO_LIMITE:
                      log("⏰ Tempo limite de segurança atingido (5h30m). Parando de processar...")
                      for f in futures:
                          f.cancel() 
                      break 

                  resultado = future.result()
                  if resultado:
                      cache.update(resultado)
                      json.dump(cache, open(SAIDA, "w", encoding="utf-8"), ensure_ascii=False, indent=2)

                  processados += 1
                  porcentagem = (processados / total_lotes) * 100
                  log(f"📊 PROGRESSO: {processados}/{total_lotes} lotes ({porcentagem:.1f}%) salvos.")

          json.dump(cache, open(SAIDA, "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          log("==================================================")
          log(f"🎉 FINALIZADO! Total de títulos no cache: {len(cache)}")
          log("💾 JSON salvo. O passo de commit fará o push.")
          log("==================================================")
          PYEOF

      - name: Commitar índice atualizado
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add classificacao.json
          if git diff --cached --quiet; then
            echo "Sem mudanças — nada a commitar."
          else
            git commit -m "chore: atualiza classificacao (Turbo 6 IAs) [skip ci]"
            git pull origin main -X ours --no-rebase
            git push
          fi
