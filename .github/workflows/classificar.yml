name: Classificar filmes

on:
  push:
    paths:
      - '**.html'
      - '.github/workflows/classificar.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'

permissions:
  contents: write

concurrency:
  group: classificar
  cancel-in-progress: false

jobs:
  classificar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar deps
        run: pip install beautifulsoup4 openai

      - name: Rodar classificador
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -u - <<'PYEOF'
          import json, os, re, time, threading
          from bs4 import BeautifulSoup
          from openai import OpenAI
          from concurrent.futures import ThreadPoolExecutor, as_completed

          MODELOS = [
              "nvidia/nemotron-3-ultra-550b-a55b",
              "deepseek-ai/deepseek-v4.1-flash",
              "nvidia/nemotron-3.5-lightning-30b-a3b",
              "openai/gpt-oss-20b",
              "nvidia/nemotron-3-super-120b-a12b",
              "meta/llama-3.2-90b-vision-instruct",
              "meta/llama-3.1-8b-instruct"
          ]

          LOTE = 20
          MAX_WORKERS = 3

          client = OpenAI(
              api_key=os.environ["NVIDIA_API_KEY"],
              base_url="https://integrate.api.nvidia.com/v1",
          )

          GENEROS = ["Ação","Aventura","Animação","Comédia","Crime","Documentário","Drama",
                     "Família","Fantasia","História","Terror","Música","Mistério","Romance",
                     "Ficção Científica","Thriller","Guerra","Faroeste"]
          PASTA, SAIDA = ".", "classificacao.json"
          IGNORAR = {"index.html", "sobre.html", "contato.html", "404.html"}

          SCHEMA = {
              "type": "object",
              "properties": {
                  "filmes": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "id":      {"type": "string"},
                              "generos": {"type": "array", "items": {"type": "string", "enum": GENEROS}},
                          },
                          "required": ["id", "generos"],
                      },
                  }
              },
              "required": ["filmes"],
          }

          cache = json.load(open(SAIDA, encoding="utf-8")) if os.path.exists(SAIDA) else {}

          log_lock = threading.Lock()
          def log(msg):
              with log_lock:
                  print(msg, flush=True)

          def extrair_titulos():
              if not os.path.isdir(PASTA): return
              for arq in sorted(os.listdir(PASTA)):
                  if not arq.endswith(".html") or arq in IGNORAR: continue
                  soup = BeautifulSoup(open(os.path.join(PASTA, arq), encoding="utf-8"), "html.parser")
                  el = soup.select_one("h1, .titulo, title")
                  if not el: continue
                  titulo = re.sub(r"\s*[-|–].*$", "", el.get_text(strip=True)).strip()
                  yield arq, titulo

          def classificar_lote_com_fallback(pares, lote_num, total_lotes, modelo_inicial):
              entrada = [{"id": str(i), "titulo": t} for i, (_, t) in enumerate(pares)]
              prompt = (
                  "Classifique cada filme em 1 a 3 gêneros da lista fixa.\n"
                  f"Gêneros permitidos: {', '.join(GENEROS)}\n"
                  "Regras: Use APENAS gêneros da lista. Se não reconhecer, retorne [].\n"
                  "Responda APENAS o JSON, sem texto antes ou depois.\n\n"
                  + json.dumps({"filmes": entrada}, ensure_ascii=False)
              )

              # Cria a lista rotacionada de modelos começando pelo 'modelo_inicial'
              try:
                  idx_inicial = MODELOS.index(modelo_inicial)
              except ValueError:
                  idx_inicial = 0
              modelos_para_tentar = MODELOS[idx_inicial:] + MODELOS[:idx_inicial]

              log(f"[▶] Lote {lote_num}/{total_lotes} | Iniciando com: {modelo_inicial}")

              for modelo in modelos_para_tentar:
                  for tentativa in range(4): # Até 4 tentativas no mesmo modelo
                      try:
                          resp = client.chat.completions.create(
                              model=modelo,
                              messages=[{"role": "user", "content": prompt}],
                              temperature=0,
                              max_tokens=4096,
                              response_format={
                                  "type": "json_schema",
                                  "json_schema": {"name": "ClassificacaoFilmes", "schema": SCHEMA},
                              },
                          )
                          content = resp.choices[0].message.content
                          if not content:
                              content = getattr(resp.choices[0].message, "reasoning_content", None)

                          data = json.loads(content)
                          por_id = {str(x.get("id")): x.get("generos", []) for x in data.get("filmes", [])}

                          result = {}
                          for i, (arq, tit) in enumerate(pares):
                              gs = [g for g in por_id.get(str(i), []) if g in GENEROS][:3]
                              result[arq] = {
                                  "titulo": tit,
                                  "generos": gs or ["indefinido"],
                                  "fonte": "ia" if gs else "indefinido",
                              }
                          log(f"[✓] Lote {lote_num} concluído com {modelo}")
                          return result
                      except Exception as e:
                          msg = str(e)
                          if "410" in msg or "404" in msg:
                              log(f"[!] Modelo {modelo} indisponível ({msg}). Pulando...")
                              break  # Vai para o próximo modelo
                          elif "429" in msg:
                              espera = 5 * (tentativa + 1) # 5s, 10s, 15s, 20s
                              log(f"[!] Rate limit (429) em {modelo}. Aguardando {espera}s...")
                              time.sleep(espera)
                              # Não quebra o loop, ele vai tentar o MESMO modelo de novo após esperar
                          else:
                              log(f"[x] Erro no lote {lote_num} ({modelo}): {e}")
                              break # Erro desconhecido, tenta próximo modelo
                          
              log(f"[x] Lote {lote_num} falhou em todos os modelos. Marcando filmes como 'indefinido'.")
              result = {}
              for arq, tit in pares:
                  result[arq] = {"titulo": tit, "generos": ["indefinido"], "fonte": "indefinido"}
              return result

          pendentes = [(a, t) for a, t in extrair_titulos()
                       if a not in cache or cache[a].get("fonte") == "indefinido"]

          if not pendentes:
              log("[info] Nenhum filme pendente. Encerrando.")
              exit(0)

          total_lotes = (len(pendentes) + LOTE - 1) // LOTE
          log(f"==================================================")
          log(f"🚀 INICIANDO: {len(pendentes)} filmes em {total_lotes} lotes.")
          log(f"⚙️  {MAX_WORKERS} threads paralelas, {len(MODELOS)} modelos em rotação.")
          log(f"==================================================")

          tarefas = []
          for i in range(0, len(pendentes), LOTE):
              bloco = pendentes[i:i + LOTE]
              lote_num = (i // LOTE) + 1
              # A ROTAÇÃO ACONTECE AQUI: cada lote começa com um modelo diferente
              modelo_inicial = MODELOS[(lote_num - 1) % len(MODELOS)]
              tarefas.append((bloco, lote_num, total_lotes, modelo_inicial))

          processados = 0
          with ThreadPoolExecutor(max_workers=MAX_WORKERS) as executor:
              futures = [executor.submit(classificar_lote_com_fallback, b, n, tot, m) for b, n, tot, m in tarefas]

              for future in as_completed(futures):
                  resultado = future.result()
                  if resultado:
                      cache.update(resultado)
                      json.dump(cache, open(SAIDA, "w", encoding="utf-8"), ensure_ascii=False, indent=2)

                  processados += 1
                  porcentagem = (processados / total_lotes) * 100
                  log(f"📊 PROGRESSO: {processados}/{total_lotes} lotes ({porcentagem:.1f}%) salvos.")
                  # A pausa global de 1.5s foi removida. A rotação resolve o problema de burst.

          log("==================================================")
          log(f"🎉 FINALIZADO! Total de filmes no cache: {len(cache)}")
          log("==================================================")
          PYEOF

      - name: Commitar índice atualizado
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add classificacao.json
          if git diff --cached --quiet; then
            echo "Sem mudanças — nada a commitar."
          else
            git commit -m "chore: atualiza classificacao.json [skip ci]"
            git push
          fi
