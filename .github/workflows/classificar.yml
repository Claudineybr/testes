name: Classificar filmes e séries com TMDB

# === SOBRE O classificacao.json ===
# O arquivo único estourou o limite de 25 MB do Cloudflare. Agora o resultado é
# dividido em "shards":
#   classificacao_1.json, classificacao_2.json, ...  -> dados (cada um < 20 MB)
#   classificacao.json                                -> manifesto
#     {"parts": ["classificacao_1.json", "classificacao_2.json", ...], "total": N}
#
# Para o site continuar funcionando, o frontend precisa carregar todos os shards:
#
#   let c = await fetch('classificacao.json').then(r => r.json());
#   if (Array.isArray(c.parts)) {
#     const p = await Promise.all(c.parts.map(x => fetch(x).then(r => r.json())));
#     c = Object.assign({}, ...p);
#   }
#   // c agora é o mapa {arquivo: {titulo, generos, ...}} de antes
#
# Os arquivos já estão renomeados com ID do TMDB e/ou IMDb (ex.: 1399.html,
# 100010s01e01.html, tt0903747s01e01.html). A identificação segue as MESMAS
# regras do "Trocar capas pelo TMDB".

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "O que classificar"
        type: choice
        default: novos
        options:
          - novos
          - indefinidos
          - tudo
      filtro:
        description: "Opcional: só arquivos cujo nome contenha este texto"
        type: string
        required: false
        default: ""
  push:
    paths:
      - '**.html'
      - '!index.html'
      - '!serie.html'

permissions:
  contents: write

concurrency:
  group: classificar
  cancel-in-progress: false

jobs:
  classificar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rodar classificador TMDB
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          MODO: ${{ inputs.modo || 'novos' }}
          FILTRO: ${{ inputs.filtro || '' }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -u - <<'PYEOF'
          import html as htmllib, json, os, re, sys, threading, time, unicodedata, glob
          import urllib.error, urllib.parse, urllib.request
          import difflib
          from concurrent.futures import ThreadPoolExecutor, as_completed

          # ========= Config =========
          MODO = (os.environ.get("MODO") or "novos").strip().lower()
          FILTRO = (os.environ.get("FILTRO") or "").strip()
          if MODO not in ("novos", "indefinidos", "tudo"):
              print(f"Modo inválido: {MODO!r}"); sys.exit(1)
          try:
              RX_FILTRO = re.compile(FILTRO, re.I) if FILTRO else None
          except re.error as e:
              print(f"FILTRO inválido ({e})."); sys.exit(1)

          CHAVE = (os.environ.get("TMDB_API_KEY") or "").strip()
          if not CHAVE:
              print("[x] Falta o secret TMDB_API_KEY."); sys.exit(1)

          TMDB_GENERO_MAP = {
              28:"Ação",12:"Aventura",16:"Animação",35:"Comédia",80:"Crime",99:"Documentário",
              18:"Drama",10751:"Família",14:"Fantasia",36:"História",27:"Terror",10402:"Música",
              9648:"Mistério",10749:"Romance",878:"Ficção Científica",53:"Thriller",10752:"Guerra",
              37:"Faroeste",10759:"Ação",10765:"Ficção Científica",10768:"Guerra",
          }
          GENEROS = ["Ação","Aventura","Animação","Comédia","Crime","Documentário","Drama",
                     "Família","Fantasia","História","Terror","Música","Mistério","Romance",
                     "Ficção Científica","Thriller","Guerra","Faroeste"]

          IGNORAR = {"index.html","sobre.html","contato.html","404.html","serie.html"}
          SAIDA = "classificacao.json"
          LIMITE_SHARD = 20 * 1024 * 1024   # 20 MB por shard (margem de 5 MB pro Cloudflare)
          MAX_TENTATIVAS = 2
          MAX_WORKERS = 8
          TEMPO_LIMITE = 330 * 60
          LIMITE_PODA = 0.20

          RX_ID_SERIE = re.compile(r"^(\d+)s(\d+)e(\d+)$", re.I)
          RX_ID_FILME = re.compile(r"^(\d+)$")
          RX_TT_SERIE = re.compile(r"^(tt\d+)s(\d+)e(\d+)$", re.I)
          RX_TT_FILME = re.compile(r"^(tt\d+)$", re.I)
          RX_EP       = re.compile(r"^(.+?)_(?:t(\d+)e(?:p)?(\d+)|(\d+)x(\d+))(?:_\d+)?$", re.I)
          RX_TITULO   = re.compile(r"<h1[^>]*>(.*?)</h1>|<title[^>]*>(.*?)</title>", re.I | re.S)
          SUFIXOS     = re.compile(r"\s*[-|–—]\s*(assistir|assista|online|dublado|legendado|clau\s*flix|hd|completo)[^|]*$", re.I)

          trava = threading.Lock()
          def log(msg):
              with trava:
                  print(msg, flush=True)

          class ChaveInvalida(Exception): pass

          def tmdb(caminho, **params):
              params.setdefault("language", "pt-BR")
              cab = {"accept": "application/json"}
              if CHAVE.startswith("eyJ"):
                  cab["Authorization"] = "Bearer " + CHAVE
              else:
                  params["api_key"] = CHAVE
              url = f"https://api.themoviedb.org/3/{caminho}?" + urllib.parse.urlencode(params)
              for tent in range(5):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url, headers=cab), timeout=20) as r:
                          return json.load(r)
                  except urllib.error.HTTPError as e:
                      if e.code in (401,403):
                          raise ChaveInvalida(f"TMDB respondeu {e.code}")
                      if e.code == 404:
                          return {}
                      if e.code == 429:
                          time.sleep(int(e.headers.get("Retry-After") or 2) + 1)
                      else:
                          time.sleep(2 * (tent + 1))
                  except (urllib.error.URLError, TimeoutError, ValueError, OSError):
                      time.sleep(2 * (tent + 1))
              raise ConnectionError(f"TMDB sem resposta em {caminho}")

          # ========= Helpers (idênticos ao capas) =========
          def norm(s):
              s = unicodedata.normalize("NFD", s).encode("ascii", "ignore").decode().lower()
              return re.sub(r"[^a-z0-9]+", " ", s).strip()

          def do_arquivo(slug):
              slug = re.sub(r"_(\d{4})_\1$", r"_\1", slug)
              slug = re.sub(r"^(.*_(?:19|20)\d{2})_\d{1,2}$", r"\1", slug)
              m = re.search(r"^(.*?)_(\d{4})$", slug)
              base, ano = (m.group(1), m.group(2)) if m else (slug, "")
              nome = " ".join(w.capitalize() for w in re.split(r"[_\-\s]+", base) if w)
              return f"{nome} ({ano})" if ano else nome

          def do_html(conteudo, slug_norm):
              m = RX_TITULO.search(conteudo)
              if not m:
                  return None
              t = htmllib.unescape(re.sub(r"<[^>]+>", "", m.group(1) or m.group(2) or "")).strip()
              t = re.sub(r"\s*[-|–—]?\s*[^\w\s]*\s*clau(\s*flix)?\s*$", "", t, flags=re.I)
              t = SUFIXOS.sub("", t)
              t = re.sub(r"(\(\d{4}\))(\s*[-|–—]\s*\1)+", r"\1", t)
              t = re.sub(r"[\s\-|–—]+$", "", t)
              t = re.sub(r"\s*[-|–—]?\s*(?:T\d+\s*E(?:P)?\d+|\d+x\d+)\b.*$", "", t, flags=re.I).strip()
              t = re.sub(r"\s*\(?\b(\d{4})\b\)?\s+\(?\1\)?$", r" (\1)", t).strip()
              sem_ano = re.sub(r"\(\d{4}\)|\b\d{4}\b", "", t)
              if t and norm(sem_ano) and slug_norm.startswith(norm(sem_ano)):
                  return t
              return None

          ROMANOS = {"ii":"2","iii":"3","iv":"4","v":"5","vi":"6","vii":"7","viii":"8","ix":"9","x":"10"}
          EXTRAS_OK = {"parte","part","vol","volume","capitulo","chapter","o","a","filme","the","movie"}

          def nm(t):
              t = unicodedata.normalize("NFKD", str(t or "")).encode("ascii","ignore").decode().lower().replace("&"," e ")
              return " ".join(ROMANOS.get(w,w) for w in re.sub(r"[^a-z0-9]+"," ",t).split())

          def variantes(nome):
              v = [nome]
              sem_par = re.sub(r"\s*\((?!\d{4}\))[^)]*\)", "", nome).strip()
              v += [sem_par] + re.findall(r"\((?!\d{4}\))([^)]+)\)", nome)
              partes = [x.strip() for x in re.split(r"\s+[-–—]\s+|:\s+", sem_par) if len(x.strip()) >= 3]
              limpo = re.sub(r"\b(?:19|20)\d{2}\b(?=.*\b(?:19|20)\d{2}\b)", "", sem_par)
              limpo = re.sub(r"\s+\d{1,2}$", "", re.sub(r"\s+"," ",limpo).strip())
              v.append(limpo)
              visto, res = set(), []
              for x, forte in [(x,True) for x in v] + [(x,False) for x in partes]:
                  x = re.sub(r"\s+"," ",x).strip(" -–—:")
                  if len(x) >= 3 and nm(x) not in visto:
                      visto.add(nm(x)); res.append((x,forte))
              return res[:6]

          def aceitar(q, ano, r, filme, primeiro):
              nq = nm(q)
              cands = [nm(r.get("title" if filme else "name","")), nm(r.get("original_title" if filme else "original_name",""))]
              brutos = [r.get("title" if filme else "name",""), r.get("original_title" if filme else "original_name","")]
              y = int(((r.get("release_date" if filme else "first_air_date")) or "0")[:4] or 0)
              ano_ok = (not ano) or (y and abs(y - ano) <= 1)
              if nq in cands: return ano_ok
              for c, b in zip(cands, brutos):
                  if not c: continue
                  rt = difflib.SequenceMatcher(None, nq, c).ratio()
                  if rt >= (0.88 if ano else 0.92) and ano_ok: return True
                  wq, wc = nq.split(), c.split()
                  if ano and ano_ok and wc and wq[:len(wc)] == wc and all(w.isdigit() or w in EXTRAS_OK for w in wq[len(wc):]): return True
                  antes = nm(re.split(r":\s|\s[-–—]\s", b, maxsplit=1)[0]) if re.search(r":\s|\s[-–—]\s", b or "") else ""
                  if antes and antes == nq and (ano_ok if ano else primeiro): return True
                  if not ano and not filme and primeiro and len(wq) >= 2 and wc[:len(wq)] == wq: return True
              return False

          def achar(tipo, titulo):
              m = re.search(r"\((\d{4})\)\s*$", titulo)
              ano = int(m.group(1)) if m else None
              nome = re.sub(r"\s*\(\d{4}\)\s*$", "", titulo).strip()
              filme = tipo == "movie"
              for q, forte in variantes(nome):
                  if not forte and not ano: continue
                  for filtro_ano in ([ano, None] if ano else [None]):
                      params = {"query": q}
                      if filtro_ano: params["year" if filme else "first_air_date_year"] = filtro_ano
                      resultados = tmdb(f"search/{tipo}", **params).get("results", [])
                      for n, r in enumerate(resultados):
                          if aceitar(q, ano, r, filme, n == 0):
                              return r
              return None

          def mapear_generos(details):
              gs = []
              for g in details.get("genres", []) or []:
                  nome = TMDB_GENERO_MAP.get(g.get("id"))
                  if nome and nome in GENEROS and nome not in gs:
                      gs.append(nome)
              return gs[:3]

          def parece_id(t):
              if not t: return True
              t = t.strip().lower()
              if re.match(r'^tt\d+', t): return True
              if re.match(r'^\d+([_\-\s]|$)', t): return True
              return False

          # ========= Cache (carrega todos os shards + legado) =========
          def carregar_cache():
              dados = {}
              # Legado (single-file) — base, se existir e for cache de verdade
              if os.path.exists(SAIDA):
                  try:
                      with open(SAIDA, encoding="utf-8") as f:
                          d = json.load(f)
                      if isinstance(d, dict) and not isinstance(d.get("parts"), list):
                          dados.update(d)
                  except Exception as e:
                      log(f"[x] {SAIDA} ilegível ({e}). Abortando.")
                      sys.exit(1)
              # Shards (sobrepõem o legado)
              for f in sorted(glob.glob("classificacao_*.json")):
                  try:
                      with open(f, encoding="utf-8") as fh:
                          d = json.load(fh)
                      if not isinstance(d, dict):
                          raise ValueError("não é objeto")
                      dados.update(d)
                  except Exception as e:
                      log(f"[x] {f} ilegível ({e}). Abortando.")
                      sys.exit(1)
              return dados

          def _serializar_compacto(obj):
              return json.dumps(obj, ensure_ascii=False, separators=(",", ":"))

          def salvar():
              # Limpa campos legados
              for v in cache.values():
                  if isinstance(v, dict):
                      v.pop("modelo", None)

              # Agrupa em shards respeitando o limite de bytes por shard
              entries = list(cache.items())
              shards, current, cur_size = [], {}, 2   # 2 = "{}"
              for k, v in entries:
                  entry_size = len(_serializar_compacto({k: v}).encode("utf-8")) + 1  # +1 vírgula
                  if current and cur_size + entry_size > LIMITE_SHARD:
                      shards.append(current)
                      current, cur_size = {}, 2
                  current[k] = v
                  cur_size += entry_size
              if current or not shards:
                  shards.append(current)

              # Escreve cada shard num arquivo .tmp e depois renomeia (atômico)
              nomes_novos = []
              for i, shard in enumerate(shards, 1):
                  nome = f"classificacao_{i}.json"
                  nomes_novos.append(nome)
                  tmp = nome + ".tmp"
                  with open(tmp, "w", encoding="utf-8") as f:
                      f.write(_serializar_compacto(shard))
                  os.replace(tmp, nome)

              # Manifesto
              manifest = {
                  "parts": nomes_novos,
                  "total": len(cache),
                  "gerado_em": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              }
              with open(SAIDA + ".tmp", "w", encoding="utf-8") as f:
                  json.dump(manifest, f, ensure_ascii=False, indent=2)
              os.replace(SAIDA + ".tmp", SAIDA)

              # Remove shards antigos que sobraram
              for f in glob.glob("classificacao_*.json"):
                  if f not in nomes_novos:
                      try:
                          os.remove(f)
                      except OSError:
                          pass

          cache = carregar_cache()

          # ========= Agrupamento (igual ao capas) =========
          def chave_unidade(slug):
              m = RX_ID_SERIE.match(slug)
              if m: return f"serie:{m.group(1)}"
              if RX_ID_FILME.match(slug): return slug
              m = RX_TT_SERIE.match(slug)
              if m: return f"serie:{m.group(1).lower()}"
              if RX_TT_FILME.match(slug): return slug
              m = RX_EP.match(slug)
              if m: return "serie:" + m.group(1).lower()
              return slug

          def montar_unidades(arquivos):
              try:
                  tit = json.load(open("titulos.json", encoding="utf-8"))
              except (OSError, ValueError):
                  tit = {}
              res = {}
              for arq in sorted(arquivos):
                  slug = arq[:-5]
                  chave = chave_unidade(slug)
                  u = res.setdefault(chave, {"arqs": [], "_pronto": False})
                  u["arqs"].append(arq)
                  if u["_pronto"]: continue
                  ms = RX_ID_SERIE.match(slug); mf = RX_ID_FILME.match(slug)
                  ts = RX_TT_SERIE.match(slug);  tf = RX_TT_FILME.match(slug)
                  m  = RX_EP.match(slug)
                  if ms or mf:
                      num = (ms or mf).group(1)
                      u.update(tmdb_id=int(num), tipo="tv" if ms else "movie", nome=num, alt=num)
                  elif ts or tf:
                      num = (ts or tf).group(1).lower()
                      u.update(imdb_id=num, tipo="tv" if ts else "movie", nome=num, alt=num)
                  else:
                      try:
                          conteudo = open(arq, encoding="utf-8", errors="ignore").read()
                      except OSError:
                          conteudo = ""
                      if m:
                          alt = do_html(conteudo, norm(m.group(1))) or do_arquivo(m.group(1))
                          u["tipo"] = "tv"
                      else:
                          alt = do_html(conteudo, norm(re.sub(r"_(\d{4})_\1$", r"_\1", slug))) or do_arquivo(slug)
                          u["tipo"] = "movie"
                      u["nome"] = (tit.get(chave) or {}).get("titulo") or alt
                      u["alt"] = alt
                  u["_pronto"] = True
              for u in res.values():
                  u.pop("_pronto", None)
              return res

          # ========= Resolução =========
          def resolver_id(tmdb_id, tipo, nome_fallback):
              d = tmdb(f"{tipo}/{tmdb_id}")
              if not d:
                  return None
              generos = mapear_generos(d)
              titulo = (d.get("name") if tipo == "tv" else d.get("title")) or nome_fallback
              ext = tmdb(f"{tipo}/{tmdb_id}/external_ids")
              imdb_id = (ext or {}).get("imdb_id")
              return generos, imdb_id, tmdb_id, tipo, titulo

          def resolver_imdb(u):
              serie = u["tipo"] == "tv"
              d = tmdb(f"find/{u['imdb_id']}", external_source="imdb_id")
              achados = d.get("tv_results" if serie else "movie_results") or []
              if not achados:
                  return None
              r = resolver_id(achados[0]["id"], "tv" if serie else "movie", u.get("nome", ""))
              if r:
                  gs, _, tid, tipo, tit = r
                  return gs, u["imdb_id"], tid, tipo, tit
              return None

          def resolver(u):
              if u.get("imdb_id"):
                  return resolver_imdb(u)
              if u.get("tmdb_id"):
                  return resolver_id(u["tmdb_id"], u["tipo"], u["nome"])
              serie = u["tipo"] == "tv"
              r = achar("tv" if serie else "movie", u["nome"])
              if not r and u.get("alt") and u["alt"] != u["nome"]:
                  r = achar("tv" if serie else "movie", u["alt"])
              if not r:
                  return None
              return resolver_id(r["id"], "tv" if serie else "movie", u["nome"])

          # ========= Título por arquivo =========
          def titulo_arquivo(arq, base_titulo):
              base = re.sub(r"\s*T\d+E\d+.*$", "", base_titulo or "", flags=re.I).strip()
              slug = arq[:-5]
              m = RX_EP.match(slug)
              if m:
                  t, ep = (m.group(2), m.group(3)) if m.group(2) else (m.group(4), m.group(5))
                  base2 = base or do_arquivo(m.group(1))
                  return f"{base2} T{int(t)}E{int(ep)}"
              ms = RX_ID_SERIE.match(slug) or RX_TT_SERIE.match(slug)
              if ms:
                  t, ep = int(ms.group(2)), int(ms.group(3))
                  return f"{base} T{t}E{ep}" if base else ""
              return base or do_arquivo(slug)

          def titulo_do_html(arq):
              try:
                  texto = open(arq, encoding="utf-8", errors="ignore").read()
              except OSError:
                  return ""
              m = RX_TITULO.search(texto)
              if not m:
                  return ""
              t = htmllib.unescape(re.sub(r"<[^>]+>", "", m.group(1) or m.group(2) or "")).strip()
              t = re.sub(r"\s*[-|–—]?\s*[^\w\s]*\s*clau(\s*flix)?\s*$", "", t, flags=re.I)
              t = SUFIXOS.sub("", t).strip()
              t = re.sub(r"\s*[-|–—]?\s*(?:T\d+\s*E(?:P)?\d+|\d+x\d+)\b.*$", "", t, flags=re.I).strip()
              return t if t and not parece_id(t) else ""

          # ========= Aplicar resultado =========
          def aplicar(u, resultado):
              if resultado:
                  gs, imdb_id, tmdb_id, tipo_tmdb, titulo_tmdb = resultado
                  tipo = "serie" if tipo_tmdb == "tv" else "filme"
              else:
                  gs = []
                  imdb_id = u.get("imdb_id")
                  tmdb_id = u.get("tmdb_id")
                  tipo = "serie" if u.get("tipo") == "tv" else "filme"
                  titulo_tmdb = None

              for arq in u["arqs"]:
                  e = cache.get(arq) or {}
                  titulo_atual = e.get("titulo") or ""
                  if not titulo_atual or parece_id(titulo_atual):
                      html_t = titulo_do_html(arq)
                      if html_t:
                          titulo_atual = html_t
                  titulo = titulo_atual if not parece_id(titulo_atual) else titulo_arquivo(arq, titulo_tmdb or "")

                  if gs:
                      cache[arq] = {
                          "titulo": titulo, "tipo": tipo, "generos": gs,
                          "fonte": "tmdb", "imdb_id": imdb_id, "tmdb_id": tmdb_id,
                      }
                  elif e.get("fonte") == "tmdb":
                      continue
                  else:
                      tent = (e.get("tentativas") if e else 0) + 1
                      cache[arq] = {
                          "titulo": titulo, "tipo": tipo,
                          "generos": ["indefinido"], "fonte": "indefinido",
                          "tentativas": tent, "nome": u.get("nome", ""),
                          "imdb_id": imdb_id, "tmdb_id": tmdb_id,
                      }

          # ========= Herdar entre irmãs =========
          def herdar_entre_irmas(unidades):
              n = 0
              for k, u in unidades.items():
                  es = [cache.get(a) for a in u["arqs"]]
                  clas = [e for e in es if e and e.get("fonte") == "tmdb"
                          and e.get("generos") and "indefinido" not in e.get("generos", [])]
                  if not clas:
                      continue
                  fonte = clas[0]
                  for arq in u["arqs"]:
                      e = cache.get(arq)
                      if e is None or e.get("fonte") == "indefinido":
                          base = fonte.get("titulo", "")
                          titulo = titulo_arquivo(arq, base)
                          cache[arq] = {
                              "titulo": titulo, "tipo": fonte.get("tipo"),
                              "generos": fonte.get("generos"), "fonte": "tmdb",
                              "herdado": True,
                              "imdb_id": fonte.get("imdb_id"),
                              "tmdb_id": fonte.get("tmdb_id"),
                          }
                          n += 1
              return n

          # ========= Pendência / poda / correções =========
          def pendente(k, u):
              if RX_FILTRO and not any(RX_FILTRO.search(a) for a in u["arqs"]):
                  return False
              if MODO == "tudo":
                  return True
              es = [cache.get(a) for a in u["arqs"]]
              if MODO == "indefinidos":
                  return any(e and e.get("fonte") == "indefinido" for e in es)
              if all(e and e.get("fonte") == "tmdb" for e in es):
                  ident = u.get("imdb_id") or u.get("tmdb_id")
                  if ident and es[0]:
                      ic = es[0].get("imdb_id") or es[0].get("tmdb_id")
                      if ic and str(ic) != str(ident):
                          return True
                  return False
              tent = max([e.get("tentativas", 0) for e in es if e] or [0])
              return tent < MAX_TENTATIVAS

          def podar(arquivos):
              obsoletos = [a for a in cache if a not in arquivos]
              if not obsoletos:
                  return 0
              if not arquivos or len(obsoletos) > LIMITE_PODA * len(cache):
                  log(f"[!] Poda ignorada ({len(obsoletos)} órfãos > {int(LIMITE_PODA*100)}%).")
                  return 0
              for a in obsoletos:
                  del cache[a]
              return len(obsoletos)

          def corrigir_cache():
              n = 0
              for arq, e in cache.items():
                  m = (RX_EP.match(arq[:-5]) or RX_ID_SERIE.match(arq[:-5]) or RX_TT_SERIE.match(arq[:-5]))
                  if m and e.get("tipo") != "serie":
                      e["tipo"] = "serie"
                      n += 1
              return n

          # ========= Execução =========
          arquivos = [a for a in sorted(os.listdir(".")) if a.endswith(".html") and a not in IGNORAR]
          log("=" * 50)
          log(f"🔎 Modo: {MODO}" + (f" | filtro: {FILTRO}" if FILTRO else "") + f" | {len(arquivos)} arquivos | {len(cache)} no cache")

          n_tipo = corrigir_cache()
          n_podados = podar(set(arquivos))
          unidades_dict = montar_unidades(arquivos)
          n_herdados = herdar_entre_irmas(unidades_dict)
          log(f"🧹 Correções: {n_tipo} tipos, {n_herdados} herdados, {n_podados} removidos.")
          if n_tipo or n_herdados or n_podados:
              salvar()

          pendentes = [(k, u) for k, u in sorted(unidades_dict.items()) if pendente(k, u)]
          if not pendentes:
              log("[info] Nada pendente. Encerrando.")
              salvar()
              sys.exit(0)

          total = len(pendentes)
          log(f"🚀 {total} unidades para o TMDB.")
          log("=" * 50)

          inicio = time.time()
          achou = nao = falhou = 0
          amostras = []
          processados = 0

          with ThreadPoolExecutor(max_workers=MAX_WORKERS) as ex:
              futs = {ex.submit(resolver, u): (k, u) for k, u in pendentes}
              for i, fut in enumerate(as_completed(futs), 1):
                  k, u = futs[fut]
                  if time.time() - inicio > TEMPO_LIMITE:
                      log("⏰ Tempo limite atingido.")
                      for f in futs:
                          f.cancel()
                      break
                  try:
                      resultado = fut.result()
                  except ChaveInvalida as err:
                      print(f"❌ {err}: confira o secret.")
                      salvar()
                      sys.exit(1)
                  except Exception as err:
                      falhou += 1
                      log(f"[!] {k}: {str(err)[:80]}")
                      resultado = None
                  aplicar(u, resultado)
                  if resultado and resultado[0]:
                      achou += 1
                      if (u.get("imdb_id") or u.get("tmdb_id")) and len(amostras) < 15:
                          amostras.append(f"{k} → {resultado[4]} | {resultado[0]} | IMDb {resultado[1]}")
                  else:
                      nao += 1
                  processados += 1
                  if processados % 50 == 0:
                      salvar()
                      log(f"📊 {processados}/{total}")

          salvar()

          log("=" * 50)
          # Resumo de "sem classificação" deduplicado por nome (série conta 1x, não 1x por episódio)
          sem_class = {}
          for k, e in cache.items():
              if e.get("fonte") == "indefinido" and e.get("tentativas", 0) >= MAX_TENTATIVAS:
                  nome = e.get("nome") or e.get("titulo") or k
                  sem_class[nome] = sem_class.get(nome, 0) + 1
          if sem_class:
              log(f"⚠️  {len(sem_class)} título(s) ainda sem classificação (rode no modo 'indefinidos' após corrigir):")
              for nome, cnt in sorted(sem_class.items())[:40]:
                  log(f"   • {nome} ({cnt} arquivo{'s' if cnt>1 else ''})")
              if len(sem_class) > 40:
                  log(f"   ... e mais {len(sem_class)-40}.")
          for a in amostras[:10]:
              log(f"   ✓ {a}")
          log(f"🎉 {achou} classificados, {nao} sem gêneros, {falhou} falhas de rede.")
          log(f"💾 {len(cache)} entradas | {len(glob.glob('classificacao_*.json'))} shard(s) de saída.")
          for f in sorted(glob.glob("classificacao_*.json")):
              log(f"   {f}: {os.path.getsize(f)/1024/1024:.1f} MB")

          if falhou and not achou and not nao:
              log("[x] Todas as requisições falharam.")
              sys.exit(1)
          PYEOF

      - name: Commitar índice atualizado
        if: always()
        env:
          MODO: ${{ inputs.modo || 'novos' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 'classificacao*.json' pega o manifesto (classificacao.json) E todos os shards
          # (classificacao_1.json, classificacao_2.json, ...). -A também estagia deleções
          # de shards removidos.
          git add -A -- 'classificacao*.json'
          if git diff --cached --quiet; then
            echo "Sem mudanças."
            exit 0
          fi
          git commit -m "chore: atualiza classificacao via TMDB (${MODO}) [skip ci]"
          for i in 1 2 3; do
            if git pull origin "$GITHUB_REF_NAME" -X ours --no-rebase && git push; then
              exit 0
            fi
            echo "Push falhou (tentativa $i)."
            sleep 5
          done
          exit 1
