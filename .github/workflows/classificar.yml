name: Classificar filmes

on:
  push:
    paths:
      - '**.html'
      - '.github/workflows/classificar.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'

permissions:
  contents: write

concurrency:
  group: classificar
  cancel-in-progress: false

jobs:
  classificar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar deps
        run: pip install beautifulsoup4 openai

      - name: Rodar classificador
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODELO: ${{ vars.NVIDIA_MODELO || 'nvidia/nemotron-3-ultra-550b-a55b' }}
        run: |
          python - <<'PYEOF'
          import json, os, re, time
          from bs4 import BeautifulSoup
          from openai import OpenAI

          client = OpenAI(
              api_key=os.environ["NVIDIA_API_KEY"],
              base_url="https://integrate.api.nvidia.com/v1",
          )
          MODELO = os.getenv("NVIDIA_MODELO", "nvidia/nemotron-3-ultra-550b-a55b")

          GENEROS = ["Ação","Aventura","Animação","Comédia","Crime","Documentário","Drama",
                     "Família","Fantasia","História","Terror","Música","Mistério","Romance",
                     "Ficção Científica","Thriller","Guerra","Faroeste"]
          PASTA, SAIDA, LOTE = ".", "classificacao.json", 20
          IGNORAR = {"index.html", "sobre.html", "contato.html", "404.html"}

          SCHEMA = {
              "type": "object",
              "properties": {
                  "filmes": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "id":      {"type": "string"},
                              "generos": {"type": "array",
                                          "items": {"type": "string", "enum": GENEROS}},
                          },
                          "required": ["id", "generos"],
                      },
                  }
              },
              "required": ["filmes"],
          }

          cache = json.load(open(SAIDA, encoding="utf-8")) if os.path.exists(SAIDA) else {}

          def extrair_titulos():
              if not os.path.isdir(PASTA):
                  return
              total, com_titulo = 0, 0
              for arq in sorted(os.listdir(PASTA)):
                  if not arq.endswith(".html"):
                      continue
                  if arq in IGNORAR:
                      continue
                  total += 1
                  soup = BeautifulSoup(open(os.path.join(PASTA, arq), encoding="utf-8"), "html.parser")
                  el = soup.select_one("h1, .titulo, title")
                  if not el:
                      continue
                  com_titulo += 1
                  titulo = re.sub(r"\s*[-|–].*$", "", el.get_text(strip=True)).strip()
                  yield arq, titulo
              print(f"[info] {total} HTMLs candidatos, {com_titulo} com título extraído")

          def classificar_lote(pares):
              entrada = [{"id": str(i), "titulo": t} for i, (_, t) in enumerate(pares)]
              prompt = (
                  "Classifique cada filme em 1 a 3 gêneros da lista fixa.\n"
                  f"Gêneros permitidos: {', '.join(GENEROS)}\n"
                  "Regras:\n"
                  "- Use APENAS gêneros da lista, escritos exatamente como estão.\n"
                  "- Se não reconhecer o filme, retorne 'generos': [].\n"
                  "- Não invente. Não explique.\n"
                  "- Responda APENAS o JSON, sem texto antes ou depois.\n\n"
                  + json.dumps({"filmes": entrada}, ensure_ascii=False)
              )

              resp = client.chat.completions.create(
                  model=MODELO,
                  messages=[{"role": "user", "content": prompt}],
                  temperature=0,
                  max_tokens=8192,
                  response_format={
                      "type": "json_schema",
                      "json_schema": {
                          "name": "ClassificacaoFilmes",
                          "schema": SCHEMA,
                      },
                  },
              )

              if not resp.choices:
                  raise ValueError("resposta sem choices")

              choice = resp.choices[0]
              finish = getattr(choice, "finish_reason", "?")
              msg = choice.message
              content = msg.content

              # fallback: alguns modelos só populam reasoning_content
              if not content:
                  content = getattr(msg, "reasoning_content", None)

              if not content:
                  raise ValueError(f"content vazio (finish_reason={finish})")

              try:
                  data = json.loads(content)
              except json.JSONDecodeError as e:
                  raise ValueError(f"JSON inválido (finish_reason={finish}): {e}")

              if "filmes" not in data:
                  raise ValueError(f"JSON sem 'filmes' (finish_reason={finish})")

              por_id = {str(x.get("id")): x.get("generos", []) for x in data["filmes"]}
              result = {}
              for i, (arq, tit) in enumerate(pares):
                  gs = [g for g in por_id.get(str(i), []) if g in GENEROS][:3]
                  result[arq] = {
                      "titulo": tit,
                      "generos": gs or ["indefinido"],
                      "fonte": "ia" if gs else "indefinido",
                  }
              return result

          def classificar_com_retry(pares, tentativas=5):
              if not pares:
                  return {}
              for n in range(tentativas):
                  try:
                      return classificar_lote(pares)
                  except Exception as e:
                      msg = str(e)
                      # rate limit: backoff exponencial, mesma lista
                      if "429" in msg or "rate limit" in msg.lower():
                          espera = 2 ** n
                          print(f"[aviso] 429 — esperando {espera}s (tentativa {n+1}/{tentativas})")
                          time.sleep(espera)
                          continue
                      # erro de conteúdo/parse: divide o lote pela metade
                      if len(pares) > 1:
                          mid = len(pares) // 2
                          print(f"[aviso] lote de {len(pares)} falhou ({msg}); dividindo em {mid}+{len(pares)-mid}")
                          r1 = classificar_com_retry(pares[:mid], tentativas)
                          time.sleep(2.0)
                          r2 = classificar_com_retry(pares[mid:], tentativas)
                          time.sleep(2.0)
                          r1.update(r2)
                          return r1
                      # 1 filme só, desiste
                      arq, tit = pares[0]
                      print(f"[erro] não classificou: {tit} ({msg})")
                      return {arq: {"titulo": tit, "generos": ["indefinido"], "fonte": "indefinido"}}
              # esgotou tentativas 429
              print(f"[aviso] lote de {len(pares)} abandonado após {tentativas} tentativas")
              return {}

          pendentes = [(a, t) for a, t in extrair_titulos()
                       if a not in cache or cache[a].get("fonte") == "indefinido"]

          print(f"[info] pendentes para classificar: {len(pendentes)}")
          if not pendentes:
              print("[info] nada a fazer. Encerrando.")

          for i in range(0, len(pendentes), LOTE):
              bloco = pendentes[i:i + LOTE]
              print(f"[info] lote {i//LOTE + 1}: {len(bloco)} filmes")
              resultado = classificar_com_retry(bloco)
              if resultado:
                  cache.update(resultado)
                  json.dump(cache, open(SAIDA, "w", encoding="utf-8"), ensure_ascii=False, indent=2)
                  print(f"[info] progresso: {min(i + LOTE, len(pendentes))}/{len(pendentes)}")
              time.sleep(2.0)

          indef = sum(1 for v in cache.values() if v["fonte"] == "indefinido")
          print(f"[ok] total no índice: {len(cache)}, indefinidos: {indef}")
          PYEOF

      - name: Commitar índice atualizado
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add classificacao.json
          if git diff --cached --quiet; then
            echo "Sem mudanças — nada a commitar."
          else
            git commit -m "chore: atualiza classificacao.json [skip ci]"
            git push
          fi
