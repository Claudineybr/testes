name: Classificar filmes e séries com TMDB

# Push de .html -> classifica só o que falta (modo "novos").
# Botão "Run workflow" -> você escolhe o modo:
#   novos        só o que falta (padrão)
#   indefinidos  re-tenta os que o TMDB não encontrou, ignorando o limite de tentativas
#   tudo         reclassifica tudo; nada é apagado, a entrada só é trocada quando o TMDB responde
# O campo "filtro" limita o trabalho a arquivos cujo nome contenha o texto (ex.: scooby).
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "O que classificar"
        type: choice
        default: novos
        options:
          - novos
          - indefinidos
          - tudo
      filtro:
        description: "Opcional: só arquivos cujo nome contenha este texto (ex.: scooby)"
        type: string
        required: false
        default: ""
  push:
    paths:
      - '**.html'
      - '!index.html'
      - '!serie.html'

permissions:
  contents: write

concurrency:
  group: classificar
  cancel-in-progress: false

jobs:
  classificar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar deps
        run: pip install requests beautifulsoup4

      - name: Rodar classificador TMDB
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          MODO: ${{ inputs.modo || 'novos' }}
          FILTRO: ${{ inputs.filtro || '' }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -u - <<'PYEOF'
          import json, os, re, sys, time, threading, unicodedata
          from collections import Counter
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from bs4 import BeautifulSoup
          import requests

          # ==================================================================
          # CONFIGURAÇÃO
          # ==================================================================
          MODO = (os.environ.get("MODO") or "novos").strip().lower()
          FILTRO = (os.environ.get("FILTRO") or "").strip()
          if MODO not in ("novos", "indefinidos", "tudo"):
              print(f"Modo inválido: {MODO!r}. Use novos, indefinidos ou tudo.", flush=True)
              sys.exit(1)
          try:
              RX_FILTRO = re.compile(FILTRO, re.I) if FILTRO else None
          except re.error as e:
              print(f"FILTRO inválido ({e}).", flush=True)
              sys.exit(1)

          TMDB_API_KEY = os.environ.get("TMDB_API_KEY")
          if not TMDB_API_KEY:
              print("[x] Falta o secret TMDB_API_KEY (Settings > Secrets and variables > Actions).", flush=True)
              sys.exit(1)

          # ------------------------------------------------------------------
          # Mapeamento de gêneros do TMDB (IDs) para a lista fixa usada no site
          # ------------------------------------------------------------------
          TMDB_GENERO_MAP = {
              # Filmes
              28: "Ação",
              12: "Aventura",
              16: "Animação",
              35: "Comédia",
              80: "Crime",
              99: "Documentário",
              18: "Drama",
              10751: "Família",
              14: "Fantasia",
              36: "História",
              27: "Terror",
              10402: "Música",
              9648: "Mistério",
              10749: "Romance",
              878: "Ficção Científica",
              53: "Thriller",
              10752: "Guerra",
              37: "Faroeste",
              # Séries (alguns IDs adicionais)
              10759: "Ação",          # Action & Adventure
              10765: "Ficção Científica", # Sci-Fi & Fantasy
              10768: "Guerra",        # War & Politics
          }

          GENEROS = ["Ação","Aventura","Animação","Comédia","Crime","Documentário","Drama",
                     "Família","Fantasia","História","Terror","Música","Mistério","Romance",
                     "Ficção Científica","Thriller","Guerra","Faroeste"]

          LOTE = 20                    # não usado para TMDB, mantido por compatibilidade
          MAX_WORKERS = 8              # requisições paralelas ao TMDB
          MAX_TENTATIVAS = 2           # tentativas antes de desistir (modo "novos")
          TEMPO_LIMITE = 330 * 60      # segurança: para antes do limite de 6h do job
          LIMITE_PODA = 0.20           # nunca apaga mais de 20% do cache de uma vez

          PASTA, SAIDA = ".", "classificacao.json"
          IGNORAR = {"index.html", "sobre.html", "contato.html", "404.html", "serie.html"}

          RX_EPISODIO = re.compile(r"_(?:t(\d+)e(?:p)?(\d+)|(\d+)x(\d+))", re.I)

          log_lock = threading.Lock()
          def log(msg):
              with log_lock:
                  print(msg, flush=True)

          # ==================================================================
          # CACHE
          # ==================================================================
          def carregar_cache():
              if not os.path.exists(SAIDA):
                  return {}
              try:
                  with open(SAIDA, encoding="utf-8") as f:
                      dados = json.load(f)
                  if not isinstance(dados, dict):
                      raise ValueError("o JSON não é um objeto")
                  return dados
              except Exception as e:
                  log(f"[x] {SAIDA} ilegível ({e}). Abortando para não perder o histórico.")
                  sys.exit(1)

          def salvar():
              for v in cache.values():
                  if isinstance(v, dict) and v.get("modelo") is None:
                      v.pop("modelo", None)
              tmp = SAIDA + ".tmp"
              with open(tmp, "w", encoding="utf-8") as f:
                  json.dump(cache, f, ensure_ascii=False, indent=2)
              os.replace(tmp, SAIDA)

          cache = carregar_cache()

          # ==================================================================
          # NOMES, TÍTULOS E TIPO (sem IA)
          # ==================================================================
          def normalizar(s):
              s = unicodedata.normalize("NFD", str(s)).encode("ascii", "ignore").decode()
              return re.sub(r"[^a-z0-9]+", " ", s.lower()).strip()

          def eh_serie(arq):
              return bool(RX_EPISODIO.search(arq))

          def prefixo_serie(arq):
              return RX_EPISODIO.split(arq[:-5], 1)[0]

          def palavras_do_arquivo(arq):
              s = prefixo_serie(arq) if eh_serie(arq) else arq[:-5]
              s = re.sub(r"_(\d{4})_\1$", "", s)
              s = re.sub(r"_\d{4}_\d{4}$", "", s)
              return [w for w in s.lower().split("_") if w]

          MINUSCULAS = {"de","da","do","das","dos","e","a","o","as","os","em","no","na","um","uma","para","por","com"}
          def capitalizar(palavras):
              return " ".join(w if (i and w in MINUSCULAS) else w.capitalize() for i, w in enumerate(palavras))

          def numeros_do_episodio(arq):
              m = RX_EPISODIO.search(arq)
              t, e = (m.group(1), m.group(2)) if m.group(1) else (m.group(3), m.group(4))
              return int(t), int(e)

          def titulo_do_arquivo(arq):
              nome = capitalizar(palavras_do_arquivo(arq))
              if eh_serie(arq):
                  t, e = numeros_do_episodio(arq)
                  return f"{nome} T{t}E{e}"
              ano = re.search(r"_(\d{4})_\1\.html$", arq)
              return f"{nome} ({ano.group(1)})" if ano else nome

          def tem_titulo_cortado(arq, titulo):
              base = re.sub(r"\(\d{4}\)", " ", titulo or "")
              base = re.sub(r"\s*(?:T\d+E\d+|\d+x\d+)\b.*$", "", base, flags=re.I)
              tw = normalizar(base).split()
              sw = normalizar(" ".join(palavras_do_arquivo(arq))).split()
              return bool(tw) and len(tw) < len(sw) and sw[:len(tw)] == tw

          def limpar_titulo(txt):
              t = re.sub(r"\s+", " ", txt or "").strip()
              ep = re.search(r"\bT\d+E\d+\b", t, re.I)
              m = re.match(r"^(.*?\(\d{4}\))", t)
              if m:
                  t = m.group(1).strip()
              else:
                  t = re.sub(r"\s+[-|–—]\s+(?:assistir|online|dublado|legendado|gr[aá]tis|download|hd|clau\s*flix)\b.*$", "", t, flags=re.I).strip()
              if ep and ep.group(0).lower() not in t.lower():
                  t = f"{t} {ep.group(0)}"
              return t

          def ler_titulo_html(arq):
              try:
                  with open(os.path.join(PASTA, arq), encoding="utf-8", errors="ignore") as f:
                      soup = BeautifulSoup(f.read(), "html.parser")
                  el = soup.select_one("h1, .titulo, title")
                  return limpar_titulo(el.get_text(strip=True)) if el else ""
              except Exception as e:
                  log(f"[!] Não consegui ler {arq}: {e}")
                  return ""

          def descobrir_titulo(arq):
              e = cache.get(arq)
              antigo = (e or {}).get("titulo") or ""
              if e is None or MODO == "tudo":
                  t = ler_titulo_html(arq)
                  if t and not tem_titulo_cortado(arq, t):
                      return t
                  if antigo and not tem_titulo_cortado(arq, antigo):
                      return antigo
                  return titulo_do_arquivo(arq)
              return antigo or titulo_do_arquivo(arq)

          # ==================================================================
          # CORREÇÕES GRATUITAS NO CACHE
          # ==================================================================
          def corrigir_cache():
              n_tipo = n_titulo = 0
              for arq, e in cache.items():
                  tipo = "serie" if eh_serie(arq) else "filme"
                  if e.get("tipo") != tipo:
                      e["tipo"] = tipo
                      n_tipo += 1
                  if tem_titulo_cortado(arq, e.get("titulo")):
                      e["titulo"] = titulo_do_arquivo(arq)
                      e.pop("tentativas", None)
                      if e.get("fonte") == "tmdb":
                          e["fonte"] = "revisar"
                      n_titulo += 1
              return n_tipo, n_titulo

          def podar(arquivos):
              obsoletos = [a for a in cache if a not in arquivos]
              if not obsoletos:
                  return 0
              if not arquivos or len(obsoletos) > LIMITE_PODA * len(cache):
                  log(f"[!] {len(obsoletos)} entradas sem arquivo (>{int(LIMITE_PODA * 100)}% do cache): poda ignorada por segurança.")
                  return 0
              for a in obsoletos:
                  del cache[a]
              return len(obsoletos)

          # ==================================================================
          # UNIDADES (filme = 1 item; série = 1 item para todos os episódios)
          # ==================================================================
          def montar_unidades(arquivos, titulos):
              unidades = {}
              for arq in arquivos:
                  chave = "serie:" + prefixo_serie(arq) if eh_serie(arq) else arq
                  u = unidades.setdefault(chave, {"tipo": "serie" if eh_serie(arq) else "filme", "arqs": []})
                  u["arqs"].append(arq)
              for chave, u in unidades.items():
                  if u["tipo"] == "filme":
                      u["nome"] = titulos[u["arqs"][0]]
                  else:
                      nomes = []
                      for a in u["arqs"]:
                          n = re.sub(r"\s*(?:T\d+E\d+|\d+x\d+)\b.*$", "", titulos[a], flags=re.I).strip(" -–—|:")
                          if n:
                              nomes.append(n)
                      nome = Counter(nomes).most_common(1)[0][0] if nomes else ""
                      if not nome or tem_titulo_cortado(u["arqs"][0], nome):
                          nome = capitalizar(palavras_do_arquivo(u["arqs"][0]))
                      u["nome"] = nome
                  u["nome"] = corrigido(u["arqs"][0]) or u["nome"]
              return unidades

          def generos_da_serie(arqs):
              cont = Counter()
              for a in arqs:
                  e = cache.get(a)
                  if e and e.get("fonte") == "tmdb":
                      cont.update(g for g in e.get("generos", []) if g in GENEROS)
              return [g for g, _ in sorted(cont.items(), key=lambda kv: (-kv[1], GENEROS.index(kv[0])))][:3]

          def modelo_da_serie(arqs, gs):
              for a in arqs:
                  e = cache.get(a)
                  if e and e.get("fonte") == "tmdb" and e.get("generos") == gs and e.get("modelo") and not e.get("herdado"):
                      return e["modelo"]
              return None

          def herdar_series(unidades, titulos):
              herdados = 0
              for u in unidades.values():
                  if u["tipo"] != "serie":
                      continue
                  gs = generos_da_serie(u["arqs"])
                  if not gs:
                      continue
                  for arq in u["arqs"]:
                      e = cache.get(arq)
                      if e is None or e.get("fonte") == "indefinido":
                          cache[arq] = {"titulo": titulos[arq], "tipo": "serie", "generos": gs, "fonte": "tmdb",
                                        "modelo": modelo_da_serie(u["arqs"], gs), "herdado": True}
                          herdados += 1
              return herdados

          CORRIGIDOS = {}

          def carregar_corrigidos():
              try:
                  with open("titulos.json", encoding="utf-8") as f:
                      dados = json.load(f)
              except (OSError, ValueError):
                  return {}
              return {k: v["titulo"] for k, v in dados.items() if isinstance(v, dict) and v.get("titulo")}

          def corrigido(arq):
              k = ("serie:" + prefixo_serie(arq).lower()) if eh_serie(arq) else arq[:-5]
              return CORRIGIDOS.get(k)

          def nome_tentado(e):
              return e.get("nome") or re.sub(r"\s*(?:T\d+E\d+|\d+x\d+)\b.*$", "", e.get("titulo", ""), flags=re.I).strip()

          def renomeado(u, es):
              c = corrigido(u["arqs"][0])
              return bool(c) and any(e and e.get("fonte") == "indefinido" and nome_tentado(e) != c for e in es)

          def pendente(u):
              if RX_FILTRO and not any(RX_FILTRO.search(a) for a in u["arqs"]):
                  return False
              if MODO == "tudo":
                  return True
              es = [cache.get(a) for a in u["arqs"]]
              if u["tipo"] == "serie":
                  revisar = any(e and e.get("fonte") == "revisar" for e in es)
                  conhecida = any(e and e.get("fonte") == "tmdb" for e in es)
                  precisa = revisar or not conhecida
              else:
                  e = es[0]
                  precisa = e is None or e.get("fonte") in ("indefinido", "revisar")
              if not precisa:
                  return False
              if MODO == "novos":
                  tentativas = max([e.get("tentativas", 0) for e in es if e] or [0])
                  if tentativas >= MAX_TENTATIVAS and not renomeado(u, es):
                      return False
              return True

          def aplicar(u, gs, imdb_id, titulos, modelo=None):
              for arq in u["arqs"]:
                  e = cache.get(arq)
                  if gs:
                      cache[arq] = {
                          "titulo": titulos[arq],
                          "tipo": u["tipo"],
                          "generos": gs,
                          "fonte": "tmdb",
                          "modelo": modelo or "tmdb",
                          "imdb_id": imdb_id,
                      }
                  elif e and e.get("fonte") == "tmdb":
                      continue
                  elif e and e.get("fonte") == "revisar":
                      e["tentativas"] = e.get("tentativas", 0) + 1
                  else:
                      tent = (e or {}).get("tentativas", 0) + 1
                      cache[arq] = {"titulo": titulos[arq], "tipo": u["tipo"], "generos": ["indefinido"],
                                    "fonte": "indefinido", "tentativas": tent, "nome": u["nome"], "modelo": modelo or "tmdb"}

          # ==================================================================
          # TMDB – BUSCA E DETALHES
          # ==================================================================
          SESSION = requests.Session()
          SESSION.headers.update({
              "User-Agent": "ClassificadorTMDB/1.0 (https://github.com/seu-usuario/seu-repo)",
              "Accept": "application/json",
          })

          def tmdb_get(path, params=None):
              url = f"https://api.themoviedb.org/3{path}"
              p = {"api_key": TMDB_API_KEY, "language": "pt-BR"}
              if params:
                  p.update(params)
              try:
                  r = SESSION.get(url, params=p, timeout=30)
                  r.raise_for_status()
                  return r.json()
              except requests.HTTPError as e:
                  if e.response.status_code == 404:
                      return None
                  log(f"[!] TMDB HTTP {e.response.status_code} em {path}: {e}")
                  return None
              except Exception as e:
                  log(f"[!] TMDB erro em {path}: {e}")
                  return None

          def extrair_ano(titulo):
              m = re.search(r"\((\d{4})\)", titulo)
              return int(m.group(1)) if m else None

          def buscar_tmdb(titulo, tipo, ano=None):
              """
              Retorna (tmdb_id, media_type) ou (None, None).
              tipo: "filme" ou "serie"
              """
              query = re.sub(r"\(\d{4}\)", "", titulo).strip()
              if tipo == "filme":
                  params = {"query": query}
                  if ano:
                      params["year"] = ano
                  data = tmdb_get("/search/movie", params)
                  if data and data.get("results"):
                      return data["results"][0]["id"], "movie"
              else:
                  params = {"query": query}
                  if ano:
                      params["first_air_date_year"] = ano
                  data = tmdb_get("/search/tv", params)
                  if data and data.get("results"):
                      return data["results"][0]["id"], "tv"
              return None, None

          def obter_detalhes_tmdb(tmdb_id, media_type):
              """
              Retorna (generos_lista, imdb_id).
              generos_lista: lista de strings da GENEROS (pode ser vazia).
              imdb_id: string "tt..." ou None.
              """
              generos = []
              imdb_id = None
              # 1) Detalhes (gêneros)
              details = tmdb_get(f"/{media_type}/{tmdb_id}")
              if details:
                  for g in details.get("genres", []):
                      nome = TMDB_GENERO_MAP.get(g["id"])
                      if nome and nome in GENEROS and nome not in generos:
                          generos.append(nome)
              # 2) External IDs (IMDb)
              ext = tmdb_get(f"/{media_type}/{tmdb_id}/external_ids")
              if ext:
                  imdb_id = ext.get("imdb_id")
              return generos[:3], imdb_id

          def classificar_unidade_tmdb(u):
              """
              Retorna (generos, imdb_id, modelo="tmdb").
              generos vazio significa "não encontrado".
              """
              titulo = u["nome"]
              ano = extrair_ano(titulo)
              tipo = "filme" if u["tipo"] == "filme" else "serie"
              tmdb_id, media_type = buscar_tmdb(titulo, tipo, ano)
              if not tmdb_id:
                  log(f"[?] TMDB não encontrou: {titulo!r} ({tipo})")
                  return [], None, "tmdb"
              generos, imdb_id = obter_detalhes_tmdb(tmdb_id, media_type)
              if not generos:
                  log(f"[?] TMDB encontrou {titulo!r} mas sem gêneros mapeáveis (ID {tmdb_id})")
              else:
                  log(f"[✓] {titulo!r} -> {generos} | IMDb: {imdb_id}")
              return generos, imdb_id, "tmdb"

          # ==================================================================
          # EXECUÇÃO
          # ==================================================================
          if not os.path.isdir(PASTA):
              log("[x] Pasta inválida.")
              sys.exit(1)

          arquivos = [a for a in sorted(os.listdir(PASTA)) if a.endswith(".html") and a not in IGNORAR]
          log("==================================================")
          log(f"🔎 Modo: {MODO}" + (f" | filtro: {FILTRO}" if FILTRO else "") + f" | {len(arquivos)} arquivos | {len(cache)} no cache")

          n_tipo, n_titulo = corrigir_cache()
          n_podados = podar(set(arquivos))
          CORRIGIDOS = carregar_corrigidos()
          titulos = {a: (corrigido(a) if not eh_serie(a) and corrigido(a) else descobrir_titulo(a)) for a in arquivos}
          unidades = montar_unidades(arquivos, titulos)
          n_herdados = herdar_series(unidades, titulos)
          log(f"🧹 Correções sem IA: {n_tipo} tipos, {n_titulo} títulos cortados, {n_herdados} episódios herdaram gêneros da série, {n_podados} entradas removidas.")
          if n_tipo or n_titulo or n_herdados or n_podados:
              salvar()

          pendentes = [(c, u) for c, u in sorted(unidades.items()) if pendente(u)]
          if not pendentes:
              log("[info] Nenhum título pendente. Encerrando.")
              salvar()
              sys.exit(0)

          unid_pendentes = [u for _, u in pendentes]
          total = len(unid_pendentes)
          log(f"🚀 {total} itens para o TMDB (séries contam 1 vez, não 1 por episódio).")
          log(f"⚙️  {MAX_WORKERS} threads paralelas.")
          log("==================================================")

          inicio_execucao = time.time()
          respondidos = desconhecidos = 0
          processados = 0

          with ThreadPoolExecutor(max_workers=MAX_WORKERS) as executor:
              futuros = {executor.submit(classificar_unidade_tmdb, u): u for u in unid_pendentes}
              for futuro in as_completed(futuros):
                  if time.time() - inicio_execucao > TEMPO_LIMITE:
                      log("⏰ Tempo limite de segurança atingido. Parando de processar...")
                      for f in futuros:
                          f.cancel()
                      break
                  u = futuros[futuro]
                  try:
                      gs, imdb_id, modelo = futuro.result()
                  except Exception as e:
                      log(f"[x] Erro ao classificar {u['nome']!r}: {e}")
                      gs, imdb_id, modelo = [], None, "tmdb"
                  aplicar(u, gs, imdb_id, titulos, modelo)
                  respondidos += 1
                  if not gs:
                      desconhecidos += 1
                  processados += 1
                  if processados % 10 == 0 or processados == total:
                      salvar()
                      log(f"📊 PROGRESSO: {processados}/{total} salvos.")

          herdar_series(unidades, titulos)
          salvar()

          sem_resposta = total - respondidos
          log("==================================================")
          log(f"🎉 FINALIZADO! {respondidos} itens processados, {desconhecidos} não encontrados no TMDB, {sem_resposta} sem resposta.")
          log(f"💾 {len(cache)} títulos no cache. O passo de commit fará o push.")
          log("==================================================")
          if respondidos == 0:
              log("[x] O TMDB não retornou nenhum resultado. Verifique a chave e a conectividade.")
              sys.exit(1)
          PYEOF

      - name: Commitar índice atualizado
        if: always()
        env:
          MODO: ${{ inputs.modo || 'novos' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add classificacao.json
          if git diff --cached --quiet; then
            echo "Sem mudanças — nada a commitar."
            exit 0
          fi
          git commit -m "chore: atualiza classificacao via TMDB (${MODO}) [skip ci]"
          for i in 1 2 3; do
            if git pull origin "$GITHUB_REF_NAME" -X ours --no-rebase && git push; then
              exit 0
            fi
            echo "Push falhou (tentativa $i). Tentando de novo..."
            sleep 5
          done
          exit 1
