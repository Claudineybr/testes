name: Classificar filmes

on:
  push:
    paths:
      - '**.html'
      - '.github/workflows/classificar.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'

permissions:
  contents: write

concurrency:
  group: classificar
  cancel-in-progress: false

jobs:
  classificar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar deps
        run: pip install beautifulsoup4 openai

      - name: Rodar classificador
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -u - <<'PYEOF'
          import json, os, re, time, threading
          from bs4 import BeautifulSoup
          from openai import OpenAI
          from concurrent.futures import ThreadPoolExecutor, as_completed

          # Trava para os prints não se misturarem entre as threads
          log_lock = threading.Lock()
          def log(msg):
              with log_lock:
                  print(msg, flush=True)

          MODELOS = [
              "meta/llama-3.1-8b-instruct",
              "meta/llama-3.3-70b-instruct",
              "openai/gpt-oss-20b",
              "mistralai/mixtral-8x22b-instruct-v0.1",
              "nvidia/llama-3.3-nemotron-super-49b-v1"
          ]
          
          LOTE = 20
          MAX_WORKERS = 5

          client = OpenAI(
              api_key=os.environ["NVIDIA_API_KEY"],
              base_url="https://integrate.api.nvidia.com/v1",
          )

          GENEROS = ["Ação","Aventura","Animação","Comédia","Crime","Documentário","Drama",
                     "Família","Fantasia","História","Terror","Música","Mistério","Romance",
                     "Ficção Científica","Thriller","Guerra","Faroeste"]
          PASTA, SAIDA = ".", "classificacao.json"
          IGNORAR = {"index.html", "sobre.html", "contato.html", "404.html"}

          SCHEMA = {
              "type": "object",
              "properties": {
                  "filmes": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "id":      {"type": "string"},
                              "generos": {"type": "array", "items": {"type": "string", "enum": GENEROS}},
                          },
                          "required": ["id", "generos"],
                      },
                  }
              },
              "required": ["filmes"],
          }

          cache = json.load(open(SAIDA, encoding="utf-8")) if os.path.exists(SAIDA) else {}

          def extrair_titulos():
              if not os.path.isdir(PASTA): return
              for arq in sorted(os.listdir(PASTA)):
                  if not arq.endswith(".html") or arq in IGNORAR: continue
                  soup = BeautifulSoup(open(os.path.join(PASTA, arq), encoding="utf-8"), "html.parser")
                  el = soup.select_one("h1, .titulo, title")
                  if not el: continue
                  titulo = re.sub(r"\s*[-|–].*$", "", el.get_text(strip=True)).strip()
                  yield arq, titulo

          def classificar_lote(pares, modelo, lote_num, total_lotes):
              entrada = [{"id": str(i), "titulo": t} for i, (_, t) in enumerate(pares)]
              prompt = (
                  "Classifique cada filme em 1 a 3 gêneros da lista fixa.\n"
                  f"Gêneros permitidos: {', '.join(GENEROS)}\n"
                  "Regras: Use APENAS gêneros da lista. Se não reconhecer, retorne [].\n"
                  "Responda APENAS o JSON.\n\n"
                  + json.dumps({"filmes": entrada}, ensure_ascii=False)
              )

              tempo_inicio = time.time()
              log(f"[▶] Iniciando lote {lote_num}/{total_lotes} | Modelo: {modelo}")

              for n in range(3):
                  try:
                      resp = client.chat.completions.create(
                          model=modelo,
                          messages=[{"role": "user", "content": prompt}],
                          temperature=0,
                          max_tokens=4096,
                          response_format={"type": "json_schema", "json_schema": {"name": "ClassificacaoFilmes", "schema": SCHEMA}},
                      )
                      content = resp.choices[0].message.content
                      if not content:
                          content = getattr(resp.choices[0].message, "reasoning_content", None)
                      
                      data = json.loads(content)
                      por_id = {str(x.get("id")): x.get("generos", []) for x in data.get("filmes", [])}
                      
                      result = {}
                      for i, (arq, tit) in enumerate(pares):
                          gs = [g for g in por_id.get(str(i), []) if g in GENEROS][:3]
                          result[arq] = {"titulo": tit, "generos": gs or ["indefinido"], "fonte": "ia" if gs else "indefinido"}
                      
                      tempo_decorrido = time.time() - tempo_inicio
                      log(f"[✓] Concluído lote {lote_num}/{total_lotes} | Tempo: {tempo_decorrido:.1f}s | Modelo: {modelo}")
                      return result
                  except Exception as e:
                      if "429" in str(e) or "rate" in str(e).lower():
                          log(f"[!] Rate Limit (429) no lote {lote_num} ({modelo}). Tentativa {n+1}/3. Aguardando {2**n}s...")
                          time.sleep(2 ** n)
                      else:
                          log(f"[x] Erro no lote {lote_num} ({modelo}): {e}")
                          time.sleep(1)
              
              log(f"[x] Lote {lote_num} falhou após 3 tentativas.")
              return {}

          pendentes = [(a, t) for a, t in extrair_titulos() if a not in cache or cache[a].get("fonte") == "indefinido"]
          
          if not pendentes:
              log("[info] Nenhum filme pendente. Encerrando.")
              exit(0)

          total_lotes = (len(pendentes) + LOTE - 1) // LOTE
          log(f"==================================================")
          log(f"🚀 INICIANDO: {len(pendentes)} filmes em {total_lotes} lotes.")
          log(f"⚙️  Configuração: {MAX_WORKERS} threads paralelas, {len(MODELOS)} modelos em rotação.")
          log(f"==================================================")

          tarefas = []
          for i in range(0, len(pendentes), LOTE):
              bloco = pendentes[i:i + LOTE]
              modelo = MODELOS[(i // LOTE) % len(MODELOS)]
              lote_num = (i // LOTE) + 1
              tarefas.append((bloco, modelo, lote_num, total_lotes))

          processados = 0
          with ThreadPoolExecutor(max_workers=MAX_WORKERS) as executor:
              futures = [executor.submit(classificar_lote, b, m, n, tot) for b, m, n, tot in tarefas]
              
              for future in as_completed(futures):
                  resultado = future.result()
                  if resultado:
                      cache.update(resultado)
                      json.dump(cache, open(SAIDA, "w", encoding="utf-8"), ensure_ascii=False, indent=2)
                  
                  processados += 1
                  porcentagem = (processados / total_lotes) * 100
                  log(f"📊 PROGRESSO GLOBAL: {processados}/{total_lotes} lotes ({porcentagem:.1f}%) finalizados e salvos no JSON.")

          log("==================================================")
          log(f"🎉 FINALIZADO! Total de filmes no cache: {len(cache)}")
          log("==================================================")
          PYEOF

      - name: Commitar índice atualizado
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add classificacao.json
          if git diff --cached --quiet; then
            echo "Sem mudanças — nada a commitar."
          else
            git commit -m "chore: atualiza classificacao.json [skip ci]"
            git push
          fi
