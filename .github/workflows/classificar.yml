name: Classificar filmes

on:
  push:
    paths:
      - '**.html'
      - '.github/workflows/classificar.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'   # opcional: todo domingo às 3h

permissions:
  contents: write

concurrency:
  group: classificar
  cancel-in-progress: false

jobs:
  classificar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar deps
        run: pip install beautifulsoup4 openai

      - name: Rodar classificador
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -u - <<'PYEOF'
          import json, os, re, time, threading
          from bs4 import BeautifulSoup
          from openai import OpenAI
          from concurrent.futures import ThreadPoolExecutor, as_completed

          # ---------- CONFIGURAÇÃO DE MODELOS ----------
          # Ordem de preferência: principais → reservas.
          MODELOS = [
              "nvidia/nemotron-3-ultra-550b-a55b",
              "nvidia/nemotron-3-super-120b-a12b",
              "nvidia/nemotron-3-nano-30b-a3b",
              "z-ai/glm-5.2",
              "deepseek-ai/deepseek-v4-flash-0731",
              "meta/llama-3.3-70b-instruct",
              "openai/gpt-oss-120b",
              "mistralai/mixtral-8x22b-instruct-v0.1",
              "meta/llama-3.1-8b-instruct",
          ]

          LOTE = 20
          MAX_WORKERS = 5

          client = OpenAI(
              api_key=os.environ["NVIDIA_API_KEY"],
              base_url="https://integrate.api.nvidia.com/v1",
          )

          GENEROS = ["Ação","Aventura","Animação","Comédia","Crime","Documentário","Drama",
                     "Família","Fantasia","História","Terror","Música","Mistério","Romance",
                     "Ficção Científica","Thriller","Guerra","Faroeste"]
          PASTA, SAIDA = ".", "classificacao.json"
          IGNORAR = {"index.html", "sobre.html", "contato.html", "404.html"}

          SCHEMA = {
              "type": "object",
              "properties": {
                  "filmes": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "id":      {"type": "string"},
                              "generos": {"type": "array", "items": {"type": "string", "enum": GENEROS}},
                          },
                          "required": ["id", "generos"],
                      },
                  }
              },
              "required": ["filmes"],
          }

          cache = json.load(open(SAIDA, encoding="utf-8")) if os.path.exists(SAIDA) else {}

          # ---------- LOG THREAD-SAFE ----------
          log_lock = threading.Lock()
          def log(msg):
              with log_lock:
                  print(msg, flush=True)

          # ---------- EXTRAÇÃO DE TÍTULOS ----------
          def extrair_titulos():
              if not os.path.isdir(PASTA): return
              for arq in sorted(os.listdir(PASTA)):
                  if not arq.endswith(".html") or arq in IGNORAR: continue
                  soup = BeautifulSoup(open(os.path.join(PASTA, arq), encoding="utf-8"), "html.parser")
                  el = soup.select_one("h1, .titulo, title")
                  if not el: continue
                  titulo = re.sub(r"\s*[-|–].*$", "", el.get_text(strip=True)).strip()
                  yield arq, titulo

          # ---------- CLASSIFICAÇÃO COM FALLBACK ----------
          def classificar_lote_com_fallback(pares, lote_num, total_lotes):
              entrada = [{"id": str(i), "titulo": t} for i, (_, t) in enumerate(pares)]
              prompt = (
                  "Classifique cada filme em 1 a 3 gêneros da lista fixa.\n"
                  f"Gêneros permitidos: {', '.join(GENEROS)}\n"
                  "Regras: Use APENAS gêneros da lista. Se não reconhecer, retorne [].\n"
                  "Responda APENAS o JSON, sem texto antes ou depois.\n\n"
                  + json.dumps({"filmes": entrada}, ensure_ascii=False)
              )

              for modelo in MODELOS:
                  for tentativa in range(2):   # 2 tentativas por modelo antes de pular
                      try:
                          log(f"[▶] Lote {lote_num}/{total_lotes} | Modelo: {modelo}")
                          resp = client.chat.completions.create(
                              model=modelo,
                              messages=[{"role": "user", "content": prompt}],
                              temperature=0,
                              max_tokens=4096,
                              response_format={
                                  "type": "json_schema",
                                  "json_schema": {"name": "ClassificacaoFilmes", "schema": SCHEMA},
                              },
                          )
                          content = resp.choices[0].message.content
                          if not content:
                              content = getattr(resp.choices[0].message, "reasoning_content", None)

                          data = json.loads(content)
                          por_id = {str(x.get("id")): x.get("generos", []) for x in data.get("filmes", [])}

                          result = {}
                          for i, (arq, tit) in enumerate(pares):
                              gs = [g for g in por_id.get(str(i), []) if g in GENEROS][:3]
                              result[arq] = {
                                  "titulo": tit,
                                  "generos": gs or ["indefinido"],
                                  "fonte": "ia" if gs else "indefinido",
                              }
                          log(f"[✓] Lote {lote_num} concluído com {modelo}")
                          return result

                      except Exception as e:
                          msg = str(e)
                          if "410" in msg:
                              log(f"[!] Modelo {modelo} aposentado (410). Pulando...")
                              break          # sai do loop de tentativas e vai para o próximo modelo
                          elif "429" in msg:
                              espera = 2 ** tentativa
                              log(f"[!] Rate limit (429) em {modelo}. Aguardando {espera}s...")
                              time.sleep(espera)
                          else:
                              log(f"[x] Erro no lote {lote_num} ({modelo}): {e}")
                              time.sleep(1)

              log(f"[x] Lote {lote_num} falhou em todos os modelos.")
              return {}

          # ---------- EXECUÇÃO PRINCIPAL ----------
          pendentes = [(a, t) for a, t in extrair_titulos()
                       if a not in cache or cache[a].get("fonte") == "indefinido"]

          if not pendentes:
              log("[info] Nenhum filme pendente. Encerrando.")
              exit(0)

          total_lotes = (len(pendentes) + LOTE - 1) // LOTE
          log(f"==================================================")
          log(f"🚀 INICIANDO: {len(pendentes)} filmes em {total_lotes} lotes.")
          log(f"⚙️  {MAX_WORKERS} threads paralelas, {len(MODELOS)} modelos em fallback.")
          log(f"==================================================")

          tarefas = []
          for i in range(0, len(pendentes), LOTE):
              bloco = pendentes[i:i + LOTE]
              lote_num = (i // LOTE) + 1
              # O modelo inicial é escolhido pela rotação (apenas para distribuir a carga).
              modelo_inicial = MODELOS[(i // LOTE) % len(MODELOS)]
              # Mas a função de fallback tentará todos os modelos na ordem.
              tarefas.append((bloco, lote_num, total_lotes))

          processados = 0
          with ThreadPoolExecutor(max_workers=MAX_WORKERS) as executor:
              futures = [executor.submit(classificar_lote_com_fallback, b, n, tot)
                         for b, n, tot in tarefas]

              for future in as_completed(futures):
                  resultado = future.result()
                  if resultado:
                      cache.update(resultado)
                      json.dump(cache, open(SAIDA, "w", encoding="utf-8"),
                                ensure_ascii=False, indent=2)

                  processados += 1
                  porcentagem = (processados / total_lotes) * 100
                  log(f"📊 PROGRESSO: {processados}/{total_lotes} lotes ({porcentagem:.1f}%) salvos.")

          log("==================================================")
          log(f"🎉 FINALIZADO! Total de filmes no cache: {len(cache)}")
          log("==================================================")
          PYEOF

      - name: Commitar índice atualizado
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add classificacao.json
          if git diff --cached --quiet; then
            echo "Sem mudanças — nada a commitar."
          else
            git commit -m "chore: atualiza classificacao.json [skip ci]"
            git push
          fi
