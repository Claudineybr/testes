name: Classificar filmes e séries com TMDB

# Push de .html -> classifica só o que falta (modo "novos").
# Botão "Run workflow" -> você escolhe o modo:
#   novos        só o que falta (padrão)
#   indefinidos  re-tenta os que o TMDB não encontrou, ignorando o limite de tentativas
#   tudo         reclassifica tudo; nada é apagado, a entrada só é trocada quando o TMDB responde
# O campo "filtro" limita o trabalho a arquivos cujo nome contenha o texto.
# Os arquivos já estão renomeados com o ID do TMDB e/ou IMDb (ex.: "1399_tt0944947_t1e1.html").
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "O que classificar"
        type: choice
        default: novos
        options:
          - novos
          - indefinidos
          - tudo
      filtro:
        description: "Opcional: só arquivos cujo nome contenha este texto (ex.: 1399)"
        type: string
        required: false
        default: ""
  push:
    paths:
      - '**.html'
      - '!index.html'
      - '!serie.html'

permissions:
  contents: write

concurrency:
  group: classificar
  cancel-in-progress: false

jobs:
  classificar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar deps
        run: pip install requests beautifulsoup4

      - name: Rodar classificador TMDB (por ID)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          MODO: ${{ inputs.modo || 'novos' }}
          FILTRO: ${{ inputs.filtro || '' }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -u - <<'PYEOF'
          import json, os, re, sys, time, threading
          from collections import Counter
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from bs4 import BeautifulSoup
          import requests

          # ==================================================================
          # CONFIGURAÇÃO
          # ==================================================================
          MODO = (os.environ.get("MODO") or "novos").strip().lower()
          FILTRO = (os.environ.get("FILTRO") or "").strip()
          if MODO not in ("novos", "indefinidos", "tudo"):
              print(f"Modo inválido: {MODO!r}. Use novos, indefinidos ou tudo.", flush=True)
              sys.exit(1)
          try:
              RX_FILTRO = re.compile(FILTRO, re.I) if FILTRO else None
          except re.error as e:
              print(f"FILTRO inválido ({e}).", flush=True)
              sys.exit(1)

          TMDB_API_KEY = os.environ.get("TMDB_API_KEY")
          if not TMDB_API_KEY:
              print("[x] Falta o secret TMDB_API_KEY (Settings > Secrets and variables > Actions).", flush=True)
              sys.exit(1)

          # ------------------------------------------------------------------
          # Mapeamento de gêneros do TMDB (IDs) -> lista fixa usada no site
          # ------------------------------------------------------------------
          TMDB_GENERO_MAP = {
              # Filmes
              28: "Ação", 12: "Aventura", 16: "Animação", 35: "Comédia",
              80: "Crime", 99: "Documentário", 18: "Drama", 10751: "Família",
              14: "Fantasia", 36: "História", 27: "Terror", 10402: "Música",
              9648: "Mistério", 10749: "Romance", 878: "Ficção Científica",
              53: "Thriller", 10752: "Guerra", 37: "Faroeste",
              # Séries (IDs adicionais)
              10759: "Ação", 10765: "Ficção Científica", 10768: "Guerra",
          }

          GENEROS = ["Ação","Aventura","Animação","Comédia","Crime","Documentário","Drama",
                     "Família","Fantasia","História","Terror","Música","Mistério","Romance",
                     "Ficção Científica","Thriller","Guerra","Faroeste"]

          MAX_WORKERS = 8
          MAX_TENTATIVAS = 2
          TEMPO_LIMITE = 330 * 60
          LIMITE_PODA = 0.20

          PASTA, SAIDA = ".", "classificacao.json"
          IGNORAR = {"index.html", "sobre.html", "contato.html", "404.html", "serie.html"}

          RX_EPISODIO = re.compile(r"_(?:t(\d+)e(?:p)?(\d+)|(\d+)x(\d+))", re.I)

          log_lock = threading.Lock()
          def log(msg):
              with log_lock:
                  print(msg, flush=True)

          # ==================================================================
          # CACHE
          # ==================================================================
          def carregar_cache():
              if not os.path.exists(SAIDA):
                  return {}
              try:
                  with open(SAIDA, encoding="utf-8") as f:
                      dados = json.load(f)
                  if not isinstance(dados, dict):
                      raise ValueError("o JSON não é um objeto")
                  return dados
              except Exception as e:
                  log(f"[x] {SAIDA} ilegível ({e}). Abortando para não perder o histórico.")
                  sys.exit(1)

          def salvar():
              tmp = SAIDA + ".tmp"
              with open(tmp, "w", encoding="utf-8") as f:
                  json.dump(cache, f, ensure_ascii=False, indent=2)
              os.replace(tmp, SAIDA)

          cache = carregar_cache()

          # ==================================================================
          # EXTRAÇÃO DE IDs DO NOME DO ARQUIVO
          # ==================================================================
          def extrair_ids(arq):
              """
              Retorna (tmdb_id, imdb_id) extraídos do nome do arquivo.
              Aceita formatos como:
                - "1399.html"                     -> (1399, None)
                - "tt0944947.html"                -> (None, "tt0944947")
                - "1399_tt0944947.html"           -> (1399, "tt0944947")
                - "tmdb_1399_tt0944947_t1e1.html" -> (1399, "tt0944947")
                - "some_name_1399_t1e1.html"      -> (1399, None)
              Exclui anos (1900-2099) e marcadores de episódio.
              """
              s = arq[:-5].lower()  # sem .html
              imdb = None
              tmdb = None

              m = re.search(r'(tt\d{6,9})', s)
              if m:
                  imdb = m.group(1)

              m = re.search(r'tmdb[_\-\s]?(\d{1,8})', s)
              if m:
                  tmdb = int(m.group(1))
              else:
                  # Remove IMDb e marcadores de episódio para não capturá-los como TMDB ID
                  s2 = re.sub(r'tt\d{6,9}', ' ', s)
                  s2 = re.sub(r't\d+e\d+|\d+x\d+', ' ', s2)
                  nums = re.findall(r'(?<![a-z0-9])(\d{1,8})(?![a-z0-9])', s2)
                  candidatos = [int(n) for n in nums if int(n) > 0]
                  # Descarta anos (4 dígitos, 1900-2099)
                  nao_anos = [c for c in candidatos
                              if not (len(str(c)) == 4 and 1900 <= c <= 2099)]
                  if nao_anos:
                      tmdb = nao_anos[0]
                  elif len(candidatos) == 1:
                      tmdb = candidatos[0]

              return tmdb, imdb

          def parece_id(titulo):
              """True se o título for só um ID (ou vazio) — nesse caso preferimos o título do TMDB."""
              if not titulo:
                  return True
              t = titulo.strip().lower()
              if re.match(r'^tt\d+', t):
                  return True
              if re.match(r'^\d+([_\-\s]|$)', t):
                  return True
              return False

          # ==================================================================
          # NOMES E TIPO (sem IA)
          # ==================================================================
          def eh_serie(arq):
              return bool(RX_EPISODIO.search(arq))

          def prefixo_serie(arq):
              return RX_EPISODIO.split(arq[:-5], 1)[0]

          def numeros_do_episodio(arq):
              m = RX_EPISODIO.search(arq)
              t, e = (m.group(1), m.group(2)) if m.group(1) else (m.group(3), m.group(4))
              return int(t), int(e)

          def limpar_titulo(txt):
              t = re.sub(r"\s+", " ", txt or "").strip()
              ep = re.search(r"\bT\d+E\d+\b", t, re.I)
              m = re.match(r"^(.*?\(\d{4}\))", t)
              if m:
                  t = m.group(1).strip()
              else:
                  t = re.sub(r"\s+[-|–—]\s+(?:assistir|online|dublado|legendado|gr[aá]tis|download|hd|clau\s*flix)\b.*$", "", t, flags=re.I).strip()
              if ep and ep.group(0).lower() not in t.lower():
                  t = f"{t} {ep.group(0)}"
              return t

          def ler_titulo_html(arq):
              try:
                  with open(os.path.join(PASTA, arq), encoding="utf-8", errors="ignore") as f:
                      soup = BeautifulSoup(f.read(), "html.parser")
                  el = soup.select_one("h1, .titulo, title")
                  return limpar_titulo(el.get_text(strip=True)) if el else ""
              except Exception as e:
                  log(f"[!] Não consegui ler {arq}: {e}")
                  return ""

          def descobrir_titulo(arq):
              e = cache.get(arq)
              antigo = (e or {}).get("titulo") or ""
              if e is None or MODO == "tudo":
                  t = ler_titulo_html(arq)
                  if t and not parece_id(t):
                      return t
                  if antigo and not parece_id(antigo):
                      return antigo
                  return ""  # deixaremos o TMDB preencher depois
              return antigo

          # ==================================================================
          # CORREÇÕES GRATUITAS NO CACHE
          # ==================================================================
          def corrigir_cache():
              n_tipo = 0
              for arq, e in cache.items():
                  tipo = "serie" if eh_serie(arq) else e.get("tipo", "filme")
                  # Só marca como série se o nome tem marcador de episódio.
                  # Se o cache já diz "serie" (por consulta anterior ao TMDB) e não há marcador,
                  # mantemos o que está — não sobrescrevemos com "filme".
                  if eh_serie(arq) and e.get("tipo") != "serie":
                      e["tipo"] = "serie"
                      n_tipo += 1
              return n_tipo

          def podar(arquivos):
              obsoletos = [a for a in cache if a not in arquivos]
              if not obsoletos:
                  return 0
              if not arquivos or len(obsoletos) > LIMITE_PODA * len(cache):
                  log(f"[!] {len(obsoletos)} entradas sem arquivo (>{int(LIMITE_PODA * 100)}% do cache): poda ignorada por segurança.")
                  return 0
              for a in obsoletos:
                  del cache[a]
              return len(obsoletos)

          # ==================================================================
          # UNIDADES (filme = 1 item; série = 1 item para todos os episódios)
          # ==================================================================
          def chave_unidade(arq):
              """Agrupa episódios da mesma série. Prefere TMDB ID (sempre série-nível)."""
              if eh_serie(arq):
                  tmdb_id, imdb_id = extrair_ids(arq)
                  if tmdb_id:
                      return f"serie:tmdb_{tmdb_id}"
                  if imdb_id:
                      return f"serie:imdb_{imdb_id}"
                  return "serie:" + prefixo_serie(arq)
              return arq

          def montar_unidades(arquivos, titulos):
              unidades = {}
              for arq in arquivos:
                  chave = chave_unidade(arq)
                  u = unidades.setdefault(chave, {"tipo": "serie" if eh_serie(arq) else "filme", "arqs": []})
                  u["arqs"].append(arq)
              for chave, u in unidades.items():
                  if u["tipo"] == "filme":
                      u["nome"] = titulos.get(u["arqs"][0]) or ""
                  else:
                      # Pega o título "mais frequente" entre os episódios (ou vazio)
                      nomes = [titulos.get(a, "") for a in u["arqs"]]
                      nomes = [n for n in nomes if n and not parece_id(n)]
                      u["nome"] = Counter(nomes).most_common(1)[0][0] if nomes else ""
              return unidades

          def generos_da_serie(arqs):
              cont = Counter()
              for a in arqs:
                  e = cache.get(a)
                  if e and e.get("fonte") == "tmdb":
                      cont.update(g for g in e.get("generos", []) if g in GENEROS)
              return [g for g, _ in sorted(cont.items(), key=lambda kv: (-kv[1], GENEROS.index(kv[0])))][:3]

          def herdar_series(unidades, titulos):
              """Episódio novo (ou 'indefinido') de uma série já classificada herda os gêneros dela."""
              herdados = 0
              for u in unidades.values():
                  if u["tipo"] != "serie":
                      continue
                  gs = generos_da_serie(u["arqs"])
                  if not gs:
                      continue
                  ref = next((cache.get(a) for a in u["arqs"]
                              if cache.get(a) and cache[a].get("fonte") == "tmdb"), None)
                  for arq in u["arqs"]:
                      e = cache.get(arq)
                      if e is None or e.get("fonte") == "indefinido":
                          novo = {"titulo": titulos.get(arq) or (ref.get("titulo") if ref else ""),
                                  "tipo": "serie",
                                  "generos": gs,
                                  "fonte": "tmdb",
                                  "herdado": True}
                          if ref:
                              novo["imdb_id"] = ref.get("imdb_id")
                              novo["tmdb_id"] = ref.get("tmdb_id")
                          cache[arq] = novo
                          herdados += 1
              return herdados

          def pendente(u):
              if RX_FILTRO and not any(RX_FILTRO.search(a) for a in u["arqs"]):
                  return False
              if MODO == "tudo":
                  return True
              es = [cache.get(a) for a in u["arqs"]]
              if u["tipo"] == "serie":
                  revisar = any(e and e.get("fonte") == "revisar" for e in es)
                  conhecida = any(e and e.get("fonte") == "tmdb" for e in es)
                  precisa = revisar or not conhecida
              else:
                  e = es[0]
                  precisa = e is None or e.get("fonte") in ("indefinido", "revisar")
              if not precisa:
                  return False
              if MODO == "novos":
                  tentativas = max([e.get("tentativas", 0) for e in es if e] or [0])
                  if tentativas >= MAX_TENTATIVAS:
                      return False
              return True

          def aplicar(u, gs, imdb_id, tmdb_id, tipo_tmdb, titulo_tmdb, titulos):
              """Grava o resultado. Prefere o título do HTML, cai pro TMDB se for só ID/vazio."""
              for arq in u["arqs"]:
                  e = cache.get(arq)
                  tipo = "serie" if tipo_tmdb == "tv" else ("filme" if tipo_tmdb == "movie" else u["tipo"])
                  titulo_html = titulos.get(arq) or (e or {}).get("titulo") or ""
                  titulo = titulo_html if not parece_id(titulo_html) else (titulo_tmdb or titulo_html or "")
                  if gs:
                      cache[arq] = {
                          "titulo": titulo,
                          "tipo": tipo,
                          "generos": gs,
                          "fonte": "tmdb",
                          "imdb_id": imdb_id,
                          "tmdb_id": tmdb_id,
                      }
                  elif e and e.get("fonte") == "tmdb":
                      continue
                  elif e and e.get("fonte") == "revisar":
                      e["tentativas"] = e.get("tentativas", 0) + 1
                  else:
                      tent = (e or {}).get("tentativas", 0) + 1
                      cache[arq] = {"titulo": titulo, "tipo": tipo,
                                    "generos": ["indefinido"], "fonte": "indefinido",
                                    "tentativas": tent, "nome": u.get("nome", ""),
                                    "imdb_id": imdb_id, "tmdb_id": tmdb_id}

          # ==================================================================
          # TMDB
          # ==================================================================
          SESSION = requests.Session()
          SESSION.headers.update({
              "User-Agent": "ClassificadorTMDB/1.0 (+https://github.com/)",
              "Accept": "application/json",
          })

          def tmdb_get(path, params=None):
              url = f"https://api.themoviedb.org/3{path}"
              p = {"api_key": TMDB_API_KEY, "language": "pt-BR"}
              if params:
                  p.update(params)
              try:
                  r = SESSION.get(url, params=p, timeout=30)
                  if r.status_code == 404:
                      return None
                  r.raise_for_status()
                  return r.json()
              except requests.HTTPError as e:
                  log(f"[!] TMDB HTTP {e.response.status_code} em {path}: {e}")
                  return None
              except Exception as e:
                  log(f"[!] TMDB erro em {path}: {e}")
                  return None

          def extrair_ano(titulo):
              m = re.search(r"\((\d{4})\)", titulo or "")
              return int(m.group(1)) if m else None

          def buscar_por_ids(tmdb_id, imdb_id):
              """
              Resolve (tmdb_id, tipo_tmdb, details_dict) a partir dos IDs disponíveis.
              tipo_tmdb: 'movie' | 'tv' | None
              """
              # 1) Se só temos IMDb, usa /find para obter TMDB ID e o tipo.
              tipo_tmdb = None
              if not tmdb_id and imdb_id:
                  data = tmdb_get(f"/find/{imdb_id}", {"external_source": "imdb_id"})
                  if data:
                      if data.get("movie_results"):
                          tmdb_id = data["movie_results"][0]["id"]
                          tipo_tmdb = "movie"
                      elif data.get("tv_results"):
                          tmdb_id = data["tv_results"][0]["id"]
                          tipo_tmdb = "tv"
                  if not tmdb_id:
                      return None, None, None

              # 2) Consulta detalhes. Se tipo desconhecido, tenta movie -> tv.
              if tipo_tmdb == "movie":
                  details = tmdb_get(f"/movie/{tmdb_id}")
                  return (tmdb_id, "movie", details) if details else (tmdb_id, None, None)
              if tipo_tmdb == "tv":
                  details = tmdb_get(f"/tv/{tmdb_id}")
                  return (tmdb_id, "tv", details) if details else (tmdb_id, None, None)

              # Desconhecido: tenta movie
              details = tmdb_get(f"/movie/{tmdb_id}")
              if details:
                  return tmdb_id, "movie", details
              details = tmdb_get(f"/tv/{tmdb_id}")
              if details:
                  return tmdb_id, "tv", details
              return tmdb_id, None, None

          def mapear_generos(details):
              gs = []
              for g in details.get("genres", []) or []:
                  nome = TMDB_GENERO_MAP.get(g.get("id"))
                  if nome and nome in GENEROS and nome not in gs:
                      gs.append(nome)
              return gs[:3]

          def obter_imdb(details, tipo_tmdb, tmdb_id):
              # Só chama external_ids se ainda não temos IMDb e é útil
              try:
                  ext = tmdb_get(f"/{tipo_tmdb}/{tmdb_id}/external_ids")
                  return (ext or {}).get("imdb_id")
              except Exception:
                  return None

          def classificar_unidade_tmdb(u):
              """
              Retorna (generos, imdb_id, tmdb_id, tipo_tmdb, titulo_tmdb).
              generos == [] significa "não encontrado / sem gêneros mapeáveis".
              """
              arq0 = u["arqs"][0]
              tmdb_id, imdb_id = extrair_ids(arq0)

              tmdb_id, tipo_tmdb, details = buscar_por_ids(tmdb_id, imdb_id)
              if not details or not tipo_tmdb:
                  log(f"[?] TMDB não resolveu: {arq0!r} (tmdb={tmdb_id}, imdb={imdb_id})")
                  return [], imdb_id, tmdb_id, tipo_tmdb, None

              titulo_tmdb = details.get("title") or details.get("name")
              generos = mapear_generos(details)

              # Se não veio IMDb do filename, tenta external_ids
              if not imdb_id:
                  imdb_id = obter_imdb(details, tipo_tmdb, tmdb_id)

              log(f"[✓] {arq0!r} -> {generos} | tipo={tipo_tmdb} | tmdb={tmdb_id} | imdb={imdb_id}")
              return generos, imdb_id, tmdb_id, tipo_tmdb, titulo_tmdb

          # ==================================================================
          # EXECUÇÃO
          # ==================================================================
          if not os.path.isdir(PASTA):
              log("[x] Pasta inválida.")
              sys.exit(1)

          arquivos = [a for a in sorted(os.listdir(PASTA)) if a.endswith(".html") and a not in IGNORAR]
          log("==================================================")
          log(f"🔎 Modo: {MODO}" + (f" | filtro: {FILTRO}" if FILTRO else "") + f" | {len(arquivos)} arquivos | {len(cache)} no cache")

          n_tipo = corrigir_cache()
          n_podados = podar(set(arquivos))
          titulos = {a: (cache.get(a, {}).get("titulo") or descobrir_titulo(a)) for a in arquivos}
          unidades = montar_unidades(arquivos, titulos)
          n_herdados = herdar_series(unidades, titulos)
          log(f"🧹 Correções sem IA: {n_tipo} tipos, {n_herdados} episódios herdaram gêneros da série, {n_podados} entradas removidas.")
          if n_tipo or n_herdados or n_podados:
              salvar()

          pendentes = [(c, u) for c, u in sorted(unidades.items()) if pendente(u)]
          if not pendentes:
              log("[info] Nenhum título pendente. Encerrando.")
              salvar()
              sys.exit(0)

          unid_pendentes = [u for _, u in pendentes]
          total = len(unid_pendentes)
          log(f"🚀 {total} itens para o TMDB (séries contam 1 vez, não 1 por episódio).")
          log(f"⚙️  {MAX_WORKERS} threads paralelas.")
          log("==================================================")

          inicio_execucao = time.time()
          respondidos = desconhecidos = 0
          processados = 0

          with ThreadPoolExecutor(max_workers=MAX_WORKERS) as executor:
              futuros = {executor.submit(classificar_unidade_tmdb, u): u for u in unid_pendentes}
              for futuro in as_completed(futuros):
                  if time.time() - inicio_execucao > TEMPO_LIMITE:
                      log("⏰ Tempo limite de segurança atingido. Parando...")
                      for f in futuros:
                          f.cancel()
                      break
                  u = futuros[futuro]
                  try:
                      gs, imdb_id, tmdb_id, tipo_tmdb, titulo_tmdb = futuro.result()
                  except Exception as e:
                      log(f"[x] Erro ao classificar {u['arqs'][0]!r}: {e}")
                      gs, imdb_id, tmdb_id, tipo_tmdb, titulo_tmdb = [], None, None, None, None
                  aplicar(u, gs, imdb_id, tmdb_id, tipo_tmdb, titulo_tmdb, titulos)
                  respondidos += 1
                  if not gs:
                      desconhecidos += 1
                  processados += 1
                  if processados % 10 == 0 or processados == total:
                      salvar()
                      log(f"📊 PROGRESSO: {processados}/{total} salvos.")

          herdar_series(unidades, titulos)
          salvar()

          sem_resposta = total - respondidos
          log("==================================================")
          log(f"🎉 FINALIZADO! {respondidos} itens processados, {desconhecidos} não resolvidos no TMDB, {sem_resposta} sem resposta.")
          log(f"💾 {len(cache)} títulos no cache. O passo de commit fará o push.")
          log("==================================================")
          if respondidos == 0:
              log("[x] O TMDB não retornou nenhum resultado. Verifique a chave e a conectividade.")
              sys.exit(1)
          PYEOF

      - name: Commitar índice atualizado
        if: always()
        env:
          MODO: ${{ inputs.modo || 'novos' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add classificacao.json
          if git diff --cached --quiet; then
            echo "Sem mudanças — nada a commitar."
            exit 0
          fi
          git commit -m "chore: atualiza classificacao via TMDB (${MODO}) [skip ci]"
          for i in 1 2 3; do
            if git pull origin "$GITHUB_REF_NAME" -X ours --no-rebase && git push; then
              exit 0
            fi
            echo "Push falhou (tentativa $i). Tentando de novo..."
            sleep 5
          done
          exit 1
