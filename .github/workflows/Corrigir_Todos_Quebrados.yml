name: Corrigir Todos os Arquivos Quebrados

on:
  workflow_dispatch:
    inputs:
      lote:
        description: 'Quantos arquivos quebrados verificar por run'
        required: false
        default: '500'
        type: string

permissions:
  contents: write

concurrency:
  group: corrigir-quebrados
  cancel-in-progress: false

jobs:
  consertar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Instalar dependências
        run: pip install requests beautifulsoup4

      - name: Verificar e consertar todos
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          LOTE_SIZE: ${{ inputs.lote || '500' }}
        run: |
          cat > /tmp/corrigir_tudo.py << 'PYEOF'
          import re, os, sys, json, shutil, requests
          from pathlib import Path
          from bs4 import BeautifulSoup

          API_KEY   = os.environ.get("TMDB_API_KEY")
          LOTE_SIZE = int(os.environ.get("LOTE_SIZE", 500))
          TMDB_API  = "https://api.themoviedb.org/3"
          IMG_BASE  = "https://image.tmdb.org/t/p/w500"

          PLACEHOLDERS = {"", "desconhecido", "desconhecida", "desconhecidos",
                          "desconhecidas", "n/a", "null", "none", "sem titulo", "sem título"}

          def log(*a): print(*a, flush=True); sys.stdout.flush()

          def extract_candidate(nome):
              """Extrai o possível título real de um nome quebrado."""
              if not nome: return ""
              n = nome.replace("🍿Clau", "").strip()
              n = re.sub(r'[\s\-]+$', '', n).strip()
              m = re.match(r'^(.*?)\s+-\s+(?:\(\d{4}\)|-|$)', n)
              if m: n = m.group(1).strip()
              n = re.sub(r'[\s\-]+$', '', n).strip()
              n = re.sub(r'\s*\(\d{4}\)\s*$', '', n).strip()
              return n

          def is_placeholder(t):
              return t.lower().strip() in PLACEHOLDERS

          def is_broken(nome):
              """Só marca como quebrado padrões realmente inválidos."""
              if not nome or len(nome.strip()) < 2: return True
              if " - - " in nome: return True                        # separador quebrado
              if re.search(r'\d{4}\s*-\s*\(\d{4}\)', nome): return True  # "2017 - (2017)"
              if re.search(r'\(\d{4}\).*\(\d{4}\)', nome): return True   # duplicação de ano
              if is_placeholder(extract_candidate(nome)): return True    # só "Desconhecido"
              return False

          def tmdb_get(path, params):
              if not API_KEY: return None
              try:
                  p = dict(params); p["api_key"] = API_KEY; p["language"] = "pt-BR"
                  return requests.get(f"{TMDB_API}{path}", params=p, timeout=10).json()
              except Exception:
                  return None

          def tmdb_by_imdb(imdb):
              d = tmdb_get(f"/find/{imdb}", {"external_source": "imdb_id"})
              if not d: return None
              if d.get("movie_results"): return "movie", d["movie_results"][0]
              if d.get("tv_results"):    return "tv",    d["tv_results"][0]
              return None

          def tmdb_search(query):
              d = tmdb_get("/search/multi", {"query": query, "include_adult": "false"})
              if d and d.get("results"): return d["results"][0]
              return None

          def build_title(kind, item, ep=None):
              if kind == "movie":
                  ano = (item.get("release_date") or "")[:4]
                  titulo = item.get("title") or item.get("original_title") or ""
              else:
                  ano = (item.get("first_air_date") or "")[:4]
                  titulo = item.get("name") or item.get("original_name") or ""
              if not titulo: return None, None
              full = f"{titulo} ({ano})" if ano else titulo
              if ep: full = f"{full} T{ep[0]}E{ep[1]}"
              poster = IMG_BASE + item["poster_path"] if item.get("poster_path") else None
              return full, poster

          def main():
              arquivos = sorted(Path(".").glob("*.html"))
              log(f"Analisando {len(arquivos)} arquivos HTML...")

              rev = Path("_revisar"); rev.mkdir(exist_ok=True)
              processados = consertados = movidos = ja_ok = 0

              for f in arquivos:
                  if processados >= LOTE_SIZE:
                      log(f"Lote de {LOTE_SIZE} atingido. Parando.")
                      break
                  if f.name in ("catalogo.html", "index.html"): continue

                  try:
                      conteudo = f.read_text(encoding="utf-8")
                      soup = BeautifulSoup(conteudo, "html.parser")
                      tag  = soup.find("script", type="application/ld+json")
                      if not tag: continue
                      dados = json.loads(tag.string)
                  except Exception as e:
                      log(f"  [x] Erro lendo {f.name}: {e}"); continue

                  nome_atual = dados.get("name", "") or ""
                  video      = dados.get("contentUrl", "") or ""

                  if not is_broken(nome_atual):
                      ja_ok += 1
                      continue

                  processados += 1
                  log(f"[{processados}/{LOTE_SIZE}] Quebrado: {f.name} — '{nome_atual}'")

                  candidate = extract_candidate(nome_atual)
                  ep = None
                  em = re.search(r'\bT(\d+)E(\d+)\b', nome_atual)
                  if em: ep = (em.group(1), em.group(2))

                  novo_full = novo_poster = None
                  origem = None

                  # Estratégia 1 — IMDB presente no contentUrl
                  im = re.search(r'(tt\d{7,9})', video)
                  if im:
                      res = tmdb_by_imdb(im.group(1))
                      if res:
                          novo_full, novo_poster = build_title(res[0], res[1], ep)
                          if novo_full: origem = "IMDB"

                  # Estratégia 2 — busca por título candidato no TMDB
                  if not novo_full and candidate and not is_placeholder(candidate):
                      q = re.sub(r'\s*T\d+E\d+\s*', ' ', candidate).strip() if ep else candidate
                      item = tmdb_search(q)
                      if item:
                          kind = "tv" if (item.get("media_type") == "tv" or "first_air_date" in item) else "movie"
                          novo_full, novo_poster = build_title(kind, item, ep)
                          if novo_full: origem = f"TMDB busca '{q}'"

                  # Estratégia 3 — busca pelo nome do arquivo
                  if not novo_full:
                      slug = re.sub(r'_\d{4}_\d{4}', '', f.stem)
                      slug = re.sub(r'_\d{4}$', '', slug)
                      slug = re.sub(r'_+', ' ', slug).strip()
                      if slug and not is_placeholder(slug):
                          item = tmdb_search(slug)
                          if item:
                              kind = "tv" if (item.get("media_type") == "tv" or "first_air_date" in item) else "movie"
                              novo_full, novo_poster = build_title(kind, item, ep)
                              if novo_full: origem = f"TMDB filename '{slug}'"

                  # Estratégia 4 — mantém nome limpo (NUNCA deleta)
                  if not novo_full and candidate and not is_placeholder(candidate):
                      novo_full = candidate
                      origem = "candidato do nome (sem TMDB)"

                  # Se nem isso resolveu, move para _revisar (não deleta)
                  if not novo_full:
                      dest = rev / f.name
                      n = 1
                      while dest.exists():
                          dest = rev / f"{f.stem}_{n}{f.suffix}"; n += 1
                      shutil.move(str(f), str(dest))
                      log(f"  [?] Sem solução — movido para _revisar/{dest.name}")
                      movidos += 1
                      continue

                  # Aplica correções
                  full_suffix = novo_full if "🍿Clau" in novo_full else f"{novo_full} - 🍿Clau"
                  dados["name"]        = full_suffix
                  dados["description"] = f"Assista {novo_full}"
                  if novo_poster:
                      dados["thumbnailUrl"] = [novo_poster]

                  novo_json = json.dumps(dados, ensure_ascii=False, indent=4)
                  novo_html = conteudo.replace(tag.string, novo_json)
                  novo_html = re.sub(r'<title>.*?</title>', f'<title>{full_suffix}</title>', novo_html, count=1)
                  novo_html = re.sub(r'<h1[^>]*>.*?</h1>', f'<h1 class="post-title">{full_suffix}</h1>', novo_html, count=1)
                  if novo_poster:
                      novo_html = re.sub(r'poster="[^"]*"',   f'poster="{novo_poster}"', novo_html, count=1)
                      novo_html = re.sub(r'<img\s+src="[^"]*"', f'<img src="{novo_poster}"', novo_html, count=1)

                  base = re.sub(r'\s*-\s*🍿Clau', '', full_suffix).strip()
                  slug = re.sub(r'[^a-z0-9]+', '_', base.lower()).strip('_')
                  dest = Path(f"{slug}.html")
                  if dest.exists() and dest.name != f.name:
                      n = 1
                      while dest.exists():
                          dest = Path(f"{slug}_{n}.html"); n += 1

                  dest.write_text(novo_html, encoding="utf-8")
                  if f.name != dest.name: f.unlink()

                  log(f"  [+] ({origem}) → {dest.name}")
                  consertados += 1

              log(f"Finalizado! Analisados: {processados} | Consertados: {consertados} | "
                  f"Já OK: {ja_ok} | Movidos p/ _revisar: {movidos}")

          if __name__ == "__main__":
              main()
          PYEOF
          python3 /tmp/corrigir_tudo.py

      - name: Salvar arquivos e progresso
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset .github/ 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nada a consertar."; exit 0; fi
          git commit -m "fix: consertar arquivos quebrados (sem deletar válidos)"
          for i in $(seq 1 5); do
            if git push origin HEAD:main; then break; fi
            echo "Conflito. Sincronizando..."
            git pull origin main --no-rebase -X ours --no-edit
            git add -A; git reset .github/ 2>/dev/null || true
            git commit -m "fix: retry $i" || true
            sleep $((RANDOM % 10 + 5))
          done
