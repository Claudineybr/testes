name: Corrigir Todos os Arquivos Quebrados

on:
  workflow_dispatch:
    inputs:
      lote:
        description: 'Quantos arquivos quebrados verificar por run'
        required: false
        default: '20'
        type: string

permissions:
  contents: write

concurrency:
  group: corrigir-quebrados
  cancel-in-progress: false

jobs:
  consertar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Instalar dependências
        run: pip install requests beautifulsoup4

      - name: Verificar e consertar todos
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          LOTE_SIZE: ${{ inputs.lote || '20' }}
        run: |
          cat > /tmp/corrigir_tudo.py << 'PYEOF'
          import re, os, sys, json, shutil, unicodedata, requests
          from pathlib import Path
          from bs4 import BeautifulSoup

          API_KEY   = os.environ.get("TMDB_API_KEY")
          LOTE_SIZE = int(os.environ.get("LOTE_SIZE", 20))
          TMDB_API  = "https://api.themoviedb.org/3"
          IMG_BASE  = "https://image.tmdb.org/t/p/w500"

          PLACEHOLDERS = {"", "desconhecido", "desconhecida", "desconhecidos",
                          "desconhecidas", "n/a", "null", "none", "sem titulo", "sem título"}

          def log(*a): print(*a, flush=True); sys.stdout.flush()

          # ---------- FIX 1: acentuação ----------
          def slugify(s):
              s = unicodedata.normalize('NFKD', s).encode('ascii', 'ignore').decode('ascii')
              s = s.lower()
              s = re.sub(r'[^a-z0-9]+', '_', s)
              return re.sub(r'_+', '_', s).strip('_')

          # ---------- FIX 2: extrair ano do nome do arquivo ----------
          def year_from_filename(fname):
              years = re.findall(r'_((?:19|20)\d{2})(?=_)', fname.rsplit('.', 1)[0] + "_")
              return years[-1] if years else None

          def year_from_text(t):
              m = re.search(r'\b((?:19|20)\d{2})\b', t or "")
              return m.group(1) if m else None

          # ---------- FIX 3: busca TMDB com ano e preferência por ano exato ----------
          def tmdb_get(path, params):
              if not API_KEY: return None
              try:
                  p = dict(params); p["api_key"] = API_KEY; p["language"] = "pt-BR"
                  return requests.get(f"{TMDB_API}{path}", params=p, timeout=10).json()
              except Exception:
                  return None

          def tmdb_by_imdb(imdb):
              d = tmdb_get(f"/find/{imdb}", {"external_source": "imdb_id"})
              if not d: return None
              if d.get("movie_results"): return "movie", d["movie_results"][0]
              if d.get("tv_results"):    return "tv",    d["tv_results"][0]
              return None

          def tmdb_search(query, year=None):
              out = []
              p = {"query": query, "include_adult": "false"}
              if year: p["year"] = year
              d = tmdb_get("/search/movie", p)
              if d:
                  for r in d.get("results", []):
                      r["media_type"] = "movie"; out.append(r)
              p = {"query": query, "include_adult": "false"}
              if year: p["first_air_date_year"] = year
              d = tmdb_get("/search/tv", p)
              if d:
                  for r in d.get("results", []):
                      r["media_type"] = "tv"; out.append(r)

              if not out:
                  return None

              if year:
                  for r in out:
                      dt = r.get("release_date") or r.get("first_air_date") or ""
                      if dt.startswith(year): return r
                  return None

              out.sort(key=lambda r: r.get("release_date") or r.get("first_air_date") or "9999")
              return out[0]

          def build_title(kind, item, ep=None):
              if kind == "movie":
                  ano = (item.get("release_date") or "")[:4]
                  titulo = item.get("title") or item.get("original_title") or ""
              else:
                  ano = (item.get("first_air_date") or "")[:4]
                  titulo = item.get("name") or item.get("original_name") or ""
              if not titulo: return None, None, None
              full = f"{titulo} ({ano})" if ano else titulo
              if ep: full = f"{full} T{ep[0]}E{ep[1]}"
              poster = IMG_BASE + item["poster_path"] if item.get("poster_path") else None
              return titulo, ano, (full, poster)

          # ---------- Verificação de coerência ----------
          def titles_similar(a, b):
              a, b = slugify(a or ""), slugify(b or "")
              if not a or not b: return False
              return a in b or b in a

          def imdb_plausible(broken_name, file_year, tmdb_title, tmdb_year):
              if file_year and tmdb_year and file_year != tmdb_year:
                  return False
              candidate = extract_candidate(broken_name)
              if candidate and not titles_similar(candidate, tmdb_title):
                  return False
              return True

          # ---------- Extração e detecção ----------
          def extract_candidate(nome):
              if not nome: return ""
              n = nome.replace("🍿Clau", "").strip()
              n = re.sub(r'[\s\-]+$', '', n).strip()
              m = re.match(r'^(.*?)\s+-\s+(?:\(\d{4}\)|-|$)', n)
              if m: n = m.group(1).strip()
              n = re.sub(r'[\s\-]+$', '', n).strip()
              n = re.sub(r'\s*\(\d{4}\)\s*$', '', n).strip()
              return n

          def is_placeholder(t): return slugify(t) in {slugify(p) for p in PLACEHOLDERS}

          def is_broken(nome):
              if not nome or len(nome.strip()) < 2: return True
              if " - - " in nome: return True
              if re.search(r'\d{4}\s*-\s*\(\d{4}\)', nome): return True
              if re.search(r'\(\d{4}\).*\(\d{4}\)', nome): return True
              if is_placeholder(extract_candidate(nome)): return True
              return False

          # ---------- Nome do destino ----------
          def unique_dest(base_slug, year, imdb_id):
              base = f"{base_slug}_{year}" if year else base_slug
              p = Path(f"{base}.html")
              if not p.exists(): return p
              if imdb_id:
                  try:
                      old = p.read_text(encoding="utf-8")
                      if imdb_id in old: return None
                  except: pass
              if year:
                  return Path(f"{base_slug}_{year}_{imdb_id or 'x'}.html")
              return Path(f"{base_slug}_{imdb_id or 'x'}.html")

          # ---------- Main ----------
          def main():
              arquivos = sorted(Path(".").glob("*.html"))
              log(f"Analisando {len(arquivos)} arquivos HTML...")

              rev = Path("_revisar"); rev.mkdir(exist_ok=True)
              processados = consertados = movidos = ja_ok = duplicatas = 0

              for f in arquivos:
                  if processados >= LOTE_SIZE:
                      log(f"Lote de {LOTE_SIZE} atingido. Parando."); break
                  if f.name in ("catalogo.html", "index.html"): continue

                  try:
                      conteudo = f.read_text(encoding="utf-8")
                      soup = BeautifulSoup(conteudo, "html.parser")
                      tag  = soup.find("script", type="application/ld+json")
                      if not tag: continue
                      dados = json.loads(tag.string)
                  except Exception as e:
                      log(f"  [x] Erro lendo {f.name}: {e}"); continue

                  nome_atual = dados.get("name", "") or ""
                  video      = dados.get("contentUrl", "") or ""

                  if not is_broken(nome_atual):
                      ja_ok += 1; continue

                  processados += 1
                  log(f"[{processados}/{LOTE_SIZE}] Quebrado: {f.name} — '{nome_atual}'")

                  candidate = extract_candidate(nome_atual)
                  file_year = year_from_filename(f.name) or year_from_text(nome_atual)
                  ep = None
                  em = re.search(r'\bT(\d+)E(\d+)\b', nome_atual)
                  if em: ep = (em.group(1), em.group(2))

                  im = re.search(r'(tt\d{7,9})', video)
                  imdb_id = im.group(1) if im else None

                  novo_full = novo_poster = None
                  origem = None

                  # Estratégia 1: IMDB (só se coerente com nome/ano do arquivo)
                  if imdb_id:
                      res = tmdb_by_imdb(imdb_id)
                      if res:
                          kind, item = res
                          t, y, built = build_title(kind, item, ep)
                          if built and imdb_plausible(nome_atual, file_year, t, y):
                              novo_full, novo_poster = built
                              origem = "IMDB"

                  # Estratégia 2: busca TMDB por título, com filtro de ano
                  if not novo_full and candidate and not is_placeholder(candidate):
                      q = re.sub(r'\s*T\d+E\d+\s*', ' ', candidate).strip() if ep else candidate
                      item = tmdb_search(q, year=file_year)
                      if item:
                          kind = "tv" if (item.get("media_type") == "tv" or "first_air_date" in item) else "movie"
                          t, y, built = build_title(kind, item, ep)
                          if built:
                              novo_full, novo_poster = built
                              origem = f"TMDB busca '{q}' ({file_year or 'sem ano'})"

                  # Estratégia 3: busca pelo slug do arquivo (com ano)
                  if not novo_full:
                      slug_q = re.sub(r'_\d{4}_\d{4}', '', f.stem)
                      slug_q = re.sub(r'_\d{4}$', '', slug_q)
                      slug_q = re.sub(r'_+', ' ', slug_q).strip()
                      if slug_q and not is_placeholder(slug_q):
                          item = tmdb_search(slug_q, year=file_year)
                          if item:
                              kind = "tv" if (item.get("media_type") == "tv" or "first_air_date" in item) else "movie"
                              t, y, built = build_title(kind, item, ep)
                              if built:
                                  novo_full, novo_poster = built
                                  origem = f"TMDB filename '{slug_q}'"

                  # Sem solução: move para _revisar
                  if not novo_full:
                      dest = rev / f.name
                      n = 1
                      while dest.exists():
                          dest = rev / f"{f.stem}_{n}{f.suffix}"; n += 1
                      shutil.move(str(f), str(dest))
                      log(f"  [?] Sem solução → _revisar/{dest.name}")
                      movidos += 1
                      continue

                  # Aplicar no HTML
                  full_suffix = novo_full if "🍿Clau" in novo_full else f"{novo_full} - 🍿Clau"
                  dados["name"]        = full_suffix
                  dados["description"] = f"Assista {novo_full}"
                  if novo_poster:
                      dados["thumbnailUrl"] = [novo_poster]

                  novo_json = json.dumps(dados, ensure_ascii=False, indent=4)
                  novo_html = conteudo.replace(tag.string, novo_json)
                  novo_html = re.sub(r'<title>.*?</title>', f'<title>{full_suffix}</title>', novo_html, count=1)
                  novo_html = re.sub(r'<h1[^>]*>.*?</h1>', f'<h1 class="post-title">{full_suffix}</h1>', novo_html, count=1)
                  if novo_poster:
                      novo_html = re.sub(r'poster="[^"]*"', f'poster="{novo_poster}"', novo_html, count=1)
                      novo_html = re.sub(r'<img\s+src="[^"]*"', f'<img src="{novo_poster}"', novo_html, count=1)

                  # FIX 1+4: slugify correto + sem _1/_2
                  base = re.sub(r'\s*-\s*🍿Clau', '', full_suffix).strip()
                  base_slug = slugify(base)
                  dest = unique_dest(base_slug, file_year, imdb_id)

                  if dest is None:
                      log(f"  [=] Duplicata (mesmo IMDB já existe) → deletando quebrado")
                      f.unlink()
                      duplicatas += 1
                      continue

                  dest.write_text(novo_html, encoding="utf-8")
                  if f.name != dest.name: f.unlink()
                  log(f"  [+] ({origem}) → {dest.name}")
                  consertados += 1

              log(f"Analisados: {processados} | Consertados: {consertados} | "
                  f"Já OK: {ja_ok} | _revisar: {movidos} | Duplicatas removidas: {duplicatas}")

          if __name__ == "__main__":
              main()
          PYEOF
          python3 /tmp/corrigir_tudo.py

      - name: Salvar arquivos e progresso
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git reset .github/ 2>/dev/null || true

          if git diff --cached --quiet; then echo "Nenhum arquivo precisou ser consertado."; exit 0; fi
          git commit -m "fix: consertar arquivos quebrados (sem deletar validos, com slugify e busca por ano)"

          for i in $(seq 1 5); do
            if git push origin HEAD:main; then break; fi
            echo "Conflito detectado. Sincronizando de forma segura..."
            git pull origin main --no-rebase -X ours --no-edit
            git add -A
            git reset .github/ 2>/dev/null || true
            git commit -m "fix: retry corrigir quebrados $i" || true
            sleep $((RANDOM % 10 + 5))
          done
