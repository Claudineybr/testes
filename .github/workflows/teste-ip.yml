name: Teste Real URLs

on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'Padrão de requisições'
        required: true
        default: 'sequencial_2s'
        type: choice
        options:
          - burst             # sem delay (pior caso)
          - sequencial_2s     # igual ao script de produção
          - sequencial_5s     # conservador
          - sequencial_10s    # bem lento
      quantidade:
        description: 'Quantas URLs testar (1-80)'
        required: false
        default: '30'
        type: string
      carregar_feed:
        description: 'Carregar o feed completo antes (31 requests)?'
        required: false
        default: 'nao'
        type: choice
        options:
          - 'nao'
          - 'sim'

jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Rodar teste com URLs reais
        env:
          MODO: ${{ inputs.modo }}
          QUANTIDADE: ${{ inputs.quantidade }}
          CARREGAR_FEED: ${{ inputs.carregar_feed }}
        run: |
          python3 << 'PYEOF'
          import requests, time, sys, os, json

          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          HEADERS = {"User-Agent": UA, "Accept-Language": "pt-BR,pt;q=0.9,en;q=0.8"}
          BASE_URL = "https://www.vini7xgrave.site"

          MODO = os.environ.get("MODO", "sequencial_2s")
          QUANTIDADE = int(os.environ.get("QUANTIDADE", "30"))
          CARREGAR_FEED = os.environ.get("CARREGAR_FEED", "nao") == "sim"

          DELAYS = {"burst": 0.0, "sequencial_2s": 2.0, "sequencial_5s": 5.0, "sequencial_10s": 10.0}
          DELAY = DELAYS.get(MODO, 2.0)

          URLS = [
              "https://www.vini7xgrave.site/2024/10/inix-12-horas-para-o-fim-do-mundo.html",
              "https://www.vini7xgrave.site/2024/10/inix-alerta-ambar.html",
              "https://www.vini7xgrave.site/2024/10/inix-animais-em-apuros.html",
              "https://www.vini7xgrave.site/2024/10/inix-apanhador-de-pesadelos.html",
              "https://www.vini7xgrave.site/2024/10/inix-apanhador-pesadelos-2020.html",
              "https://www.vini7xgrave.site/2024/10/inix-bee-movie-historia-de-uma-abelha.html",
              "https://www.vini7xgrave.site/2024/10/inix-cabana-do-inferno-2002.html",
              "https://www.vini7xgrave.site/2024/10/inix-deadpool-2-2018-acaocomedia.html",
              "https://www.vini7xgrave.site/2024/10/inix-deadpool-2016-acaocomedia.html",
              "https://www.vini7xgrave.site/2024/10/inix-feios.html",
              "https://www.vini7xgrave.site/2024/10/inix-guerra-do-amanha-2021-acaoficcao.html",
              "https://www.vini7xgrave.site/2024/10/inix-guerra-e-revolta.html",
              "https://www.vini7xgrave.site/2024/10/inix-identidade-em-jogo.html",
              "https://www.vini7xgrave.site/2024/10/inix-kung-fu-panda-4.html",
              "https://www.vini7xgrave.site/2024/10/inix-lenda-do-tesouro-perdido-2004.html",
              "https://www.vini7xgrave.site/2024/10/inix-lobisomen-besta-entre-nos-2012.html",
              "https://www.vini7xgrave.site/2024/10/inix-maxxxine-2024.html",
              "https://www.vini7xgrave.site/2024/10/inix-memorias-ocultas.html",
              "https://www.vini7xgrave.site/2024/10/inix-minority-report-nova-lei-14.html",
              "https://www.vini7xgrave.site/2024/10/inix-missao-de-sandy-bochechas-2024.html",
              "https://www.vini7xgrave.site/2024/10/inix-o-bastardo.html",
              "https://www.vini7xgrave.site/2024/10/inix-o-chamado-do-mal-2018_30.html",
              "https://www.vini7xgrave.site/2024/10/inix-o-crime-nao-tira-ferias.html",
              "https://www.vini7xgrave.site/2024/10/inix-o-sistema-2022-acaothriller.html",
              "https://www.vini7xgrave.site/2024/10/inix-orion-e-o-escuro-10-2024.html",
              "https://www.vini7xgrave.site/2024/10/inix-os-observadores-2024.html",
              "https://www.vini7xgrave.site/2024/10/inix-pets-em-acao-2024-comediaanimacao.html",
              "https://www.vini7xgrave.site/2024/10/inix-pisque-duas-vezes.html",
              "https://www.vini7xgrave.site/2024/10/inix-sangue-frio-2023-terrorsuspense.html",
              "https://www.vini7xgrave.site/2024/10/inix-shift-o-deslocamento-2023-ficcao.html",
              "https://www.vini7xgrave.site/2024/10/inix-tom-jerry-o-filme.html",
              "https://www.vini7xgrave.site/2024/10/inix-twisters-2024-acaothriller.html",
              "https://www.vini7xgrave.site/2024/11/inix-eragon-10-2006-infantilfantasia.html",
              "https://www.vini7xgrave.site/2024/11/inix-eragon-2006-infantilfantasia.html",
              "https://www.vini7xgrave.site/2024/11/inix-feitico-2020-terrorsobrenatural.html",
              "https://www.vini7xgrave.site/2024/11/inix-o-estranho-mundo-de-jack-livre.html",
              "https://www.vini7xgrave.site/2024/11/inix-os-incriveis-2004-infantilacao.html",
              "https://www.vini7xgrave.site/2024/11/inix-panico-na-ilha-2009-terrormisterio.html",
              "https://www.vini7xgrave.site/2024/11/inix-robo-selvagem-2024-infantilaventura.html",
              "https://www.vini7xgrave.site/2025/02/9-salvacao-2009.html",
              "https://www.vini7xgrave.site/2025/02/a-furia-de-becky-2023.html",
              "https://www.vini7xgrave.site/2025/02/a-maldicao-de-savannah-2021.html",
              "https://www.vini7xgrave.site/2025/02/a-origem-2010.html",
              "https://www.vini7xgrave.site/2025/02/a-saga-dr-dolittle.html",
              "https://www.vini7xgrave.site/2025/02/a-saga-x-men.html",
              "https://www.vini7xgrave.site/2025/02/a-semente-do-mal-2023.html",
              "https://www.vini7xgrave.site/2025/02/a-serie-velozes-e-furiosos.html",
              "https://www.vini7xgrave.site/2025/02/a-vida-secreta-de-zoe-2014.html",
              "https://www.vini7xgrave.site/2025/02/advogado-do-diabo-1997.html",
              "https://www.vini7xgrave.site/2025/02/apartamento-7a.html",
              "https://www.vini7xgrave.site/2025/02/armadilha-2024.html",
              "https://www.vini7xgrave.site/2025/02/ate-as-ultimas-consequencias-1996.html",
              "https://www.vini7xgrave.site/2025/02/bolt-o-supercao-2008.html",
              "https://www.vini7xgrave.site/2025/02/capita-marvel-2019.html",
              "https://www.vini7xgrave.site/2025/02/capitao-america-admiravel-mundo-novo.html",
              "https://www.vini7xgrave.site/2025/02/chamada-de-emergencia-2013.html",
              "https://www.vini7xgrave.site/2025/02/colecao-tinker-bell.html",
              "https://www.vini7xgrave.site/2025/02/colega-monster-high.html",
              "https://www.vini7xgrave.site/2025/02/demolidor-o-homem-sem-medo-2003.html",
              "https://www.vini7xgrave.site/2025/02/diabolica-2024.html",
              "https://www.vini7xgrave.site/2025/02/duologia-divertidamente.html",
              "https://www.vini7xgrave.site/2025/02/duologia-homem-formiga.html",
              "https://www.vini7xgrave.site/2025/02/feios-2024.html",
              "https://www.vini7xgrave.site/2025/02/guerreiros-do-basquete-2024.html",
              "https://www.vini7xgrave.site/2025/02/hannibal-2001.html",
              "https://www.vini7xgrave.site/2025/02/lobos-2024.html",
              "https://www.vini7xgrave.site/2025/02/madame-teia-2024.html",
              "https://www.vini7xgrave.site/2025/02/na-selva-2017.html",
              "https://www.vini7xgrave.site/2025/02/o-carma-de-um-assassino-2018.html",
              "https://www.vini7xgrave.site/2025/02/o-espirito-das-trevas-2022.html",
              "https://www.vini7xgrave.site/2025/02/o-exterminador-do-futuro.html",
              "https://www.vini7xgrave.site/2025/02/o-incrivel-hulk-2008.html",
              "https://www.vini7xgrave.site/2025/02/o-silencio-dos-inocentes-1991.html",
              "https://www.vini7xgrave.site/2025/02/o-ultimo-desafio-2013.html",
              "https://www.vini7xgrave.site/2025/02/os-vingadores-avengers.html",
              "https://www.vini7xgrave.site/2025/03/60-segundos-2000.html",
              "https://www.vini7xgrave.site/2025/03/a-casa-assombrada-2010.html",
              "https://www.vini7xgrave.site/2025/03/a-ilha-fantasma-2020.html",
              "https://www.vini7xgrave.site/2025/03/a-mulher-do-pantano-2011.html",
          ]

          stats = {"200": 0, "404": 0, "429": 0, "403": 0, "outros": 0, "erros": 0}
          primeiro_429 = None
          primeiro_429_url = None
          t0 = time.time()

          print("=" * 70)
          print(f"MODO: {MODO} | DELAY: {DELAY}s | URLs: {QUANTIDADE} | FEED: {'sim' if CARREGAR_FEED else 'nao'}")
          print("=" * 70)

          if CARREGAR_FEED:
              print()
              print("FASE 0: Carregando feed (páginas de 150 posts)")
              feed_ok = 0
              feed_429 = 0
              for start in range(1, 5000, 150):
                  url_feed = f"{BASE_URL}/feeds/posts/default?alt=json&max-results=150&start-index={start}"
                  try:
                      r = requests.get(url_feed, headers=HEADERS, timeout=30)
                      if r.status_code == 200:
                          feed_ok += 1
                          try:
                              entries = json.loads(r.text).get("feed", {}).get("entry", [])
                              if len(entries) < 150:
                                  break
                          except Exception:
                              pass
                      elif r.status_code == 429:
                          feed_429 += 1
                          print(f"  [FEED start={start}] 429 <<<<<<")
                      else:
                          print(f"  [FEED start={start}] HTTP {r.status_code}")
                  except Exception as e:
                      print(f"  [FEED start={start}] ERRO: {str(e)[:60]}")
                  time.sleep(2)
              print(f"  Resultado feed: {feed_ok} OK, {feed_429} × 429")

          print()
          print("FASE 1: Testando URLs reais")
          print()

          urls = URLS[:QUANTIDADE]

          for i, url in enumerate(urls, 1):
              if i > 1 and DELAY > 0:
                  time.sleep(DELAY)
              ts = time.strftime("%H:%M:%S")
              try:
                  t1 = time.time()
                  r = requests.get(url, headers=HEADERS, timeout=20)
                  dt = time.time() - t1
                  st = r.status_code
                  size = len(r.text)

                  if st == 200:
                      stats["200"] += 1
                      marker = "OK"
                  elif st == 404:
                      stats["404"] += 1
                      marker = "404"
                  elif st == 429:
                      stats["429"] += 1
                      marker = "429 <<<<<<"
                      if primeiro_429 is None:
                          primeiro_429 = i
                          primeiro_429_url = url
                  elif st == 403:
                      stats["403"] += 1
                      marker = "403 (block?)"
                  else:
                      stats["outros"] += 1
                      marker = f"HTTP {st}"

                  slug = url.split("/")[-1][:50]
                  print(f"[{ts}] [{i:3d}/{len(urls)}] {st} ({size:6d}B, {dt:5.2f}s) {marker:14s} {slug}")

                  if primeiro_429 == i:
                      print(f"  ⚠️  >>> PRIMEIRO 429 na requisição #{i} ({(time.time()-t0):.0f}s após início)")
              except Exception as e:
                  stats["erros"] += 1
                  print(f"[{ts}] [{i:3d}/{len(urls)}] ERRO: {type(e).__name__}: {str(e)[:60]}")

          print()
          print("=" * 70)
          print("RESUMO")
          print("=" * 70)
          dt_total = time.time() - t0
          print(f"Tempo total: {dt_total:.0f}s")
          print(f"Stats: {stats}")
          print(f"Primeiro 429: " + (f"#{primeiro_429} — {primeiro_429_url}" if primeiro_429 else "NENHUM"))
          print()
          if primeiro_429:
              print(f"⚠️ RATE LIMIT ATINGIDO na requisição #{primeiro_429}")
              print(f"   Com '{MODO}', o limite do Google é ~{primeiro_429} requests por run")
              print(f"   Ação: reduzir LOTE_SIZE para < {primeiro_429} OU aumentar DELAY")
          elif stats["429"] == 0:
              print(f"✅ SEM RATE LIMIT: {len(urls)} URLs passaram sem 429 com '{MODO}'")
              print(f"   Se o script real ainda toma 429, NÃO é esta taxa.")
              print(f"   Verificar: auto-chain, múltiplos workflows simultâneos, Playwright")
          PYEOF
