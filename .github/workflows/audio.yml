name: Verificar audio pt-BR

# Lê o idioma das faixas de áudio de cada título (série: 1º episódio; filme: o filme)
# direto nos cabeçalhos dos .mp4 — ~12 KB por título, sem baixar vídeo.
# Resultado: artifacts/audio_ptbr.json, com pt / original / indefinido / erro.
# Roda de novo quando quiser: o script retoma de onde parou (só tenta de novo os erros).
"on":
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'          # toda segunda, 7h UTC

permissions:
  contents: write

concurrency:
  group: audio
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Baixar o codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Conferir o idioma do audio de cada titulo
        run: python3 -u audio_ptbr.py --por-host 48 --paralelo 140 --timeout 12

      - name: Disparar próxima run (se fila não vazia)
        if: |
          success() && (
            github.event_name == 'schedule' ||
            inputs.auto_run == true ||
            inputs.auto_run == 'true'
          )
        env:
          GH_TOKEN: ${{ secrets.PAT_CHAIN }}
          REPO: ${{ github.repository }}
          LOTE_IN: ${{ inputs.lote || '100' }}
          MODO_IN: ${{ inputs.modo || 'baixar_e_consertar' }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "PAT_CHAIN não configurado: sem auto-chain."; exit 0; fi
          FALTAM=$(cat /tmp/faltam.txt 2>/dev/null || echo 0)
          echo "Faltam: $FALTAM"
          if [ "${FALTAM:-0}" -le 0 ]; then exit 0; fi
          LIMITE_ISO=$(date -u -d '60 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          RECENTES=$(gh run list --workflow="audio.yml" --event workflow_dispatch --limit 100 \
            --json createdAt --jq "[.[] | select(.createdAt > \"$LIMITE_ISO\")] | length" \
            --repo "$REPO" 2>/dev/null || echo 0)
          echo "Encadeamentos na última hora: $RECENTES"
          if [ "${RECENTES:-0}" -ge 60 ]; then echo "Limite por hora atingido."; exit 0; fi
          sleep 30
          gh workflow run "audio.yml" --repo "$REPO" --ref main \
            -f auto_run=true -f lote="$LOTE_IN" -f reprocessar_tudo=false \
            -f modo="$MODO_IN"

      - name: Commitar o resultado
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/audio_ptbr.json
          if git diff --cached --quiet; then
            echo "Sem mudanças — nada a commitar."
            exit 0
          fi
          git commit -m "chore: atualiza o idioma do audio do catalogo [skip ci]"
          for i in 1 2 3; do
            if git pull origin "$GITHUB_REF_NAME" -X ours --no-rebase && git push; then
              exit 0
            fi
            echo "Push falhou (tentativa $i). Tentando de novo..."
            sleep 5
          done
          exit 1
