name: Consertar Capas Faltantes

on:
  workflow_dispatch:
    inputs:
      lote:
        description: 'Quantos arquivos verificar por run'
        required: false
        default: '1000'
        type: string

permissions:
  contents: write

concurrency:
  group: consertar-capas
  cancel-in-progress: false

jobs:
  consertar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Instalar dependências
        run: pip install requests beautifulsoup4

      - name: Verificar e consertar capas
        env:
          LOTE_SIZE: ${{ inputs.lote || '1000' }}
        run: |
          cat > /tmp/consertar_capas.py << 'PYEOF'
          import requests, re, os, sys, json, unicodedata
          from pathlib import Path
          from bs4 import BeautifulSoup

          BASE_URL = "https://www.vini7xgrave.site"
          HEADERS = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"}
          LOTE_SIZE = int(os.environ.get('LOTE_SIZE', 1000))

          def log(*a): print(*a, flush=True); sys.stdout.flush()

          # Carrega todas as URLs da fila para busca exata
          todas_urls = []
          for f_name in ["series_fila.txt", "filmes_fila.txt"]:
              p = Path(f_name)
              if p.exists():
                  todas_urls.extend([l.strip() for l in p.read_text(encoding="utf-8").splitlines() if l.strip()])

          def achar_url_na_fila(slug):
              # Transforma "breaking_bad" em "breaking-bad" para bater com a URL
              slug_busca = slug.replace('_', '-').lower()
              for u in todas_urls:
                  if slug_busca in u.lower():
                      return u
              return None

          def extrair_capa(html_text):
              soup = BeautifulSoup(html_text, 'html.parser')
              
              # 1. og:image
              og_img = soup.find('meta', property='og:image')
              if og_img and og_img.get('content') and 'placeholder' not in og_img['content'] and len(og_img['content']) > 10:
                  return og_img['content']
              
              # 2. Link <a> do blogger
              link_img = soup.find('a', href=re.compile(r'https://blogger\.googleusercontent\.com/img/'))
              if link_img:
                  return link_img['href']
                  
              # 3. Tag <img> (verifica src, data-src e srcset)
              for img in soup.find_all('img'):
                  for attr in ['src', 'data-src', 'srcset']:
                      val = img.get(attr, '')
                      if val and 'blogger.googleusercontent.com' in val and not any(x in val.lower() for x in ['logo', 'icon', 'avatar']):
                          return val.split(' ')[0] # Pega a primeira do srcset

              # 4. Tag <video> (poster)
              video = soup.find('video')
              if video and video.get('poster') and 'placeholder' not in video.get('poster'):
                  return video.get('poster')

              # 5. Regex no HTML inteiro (qualquer link do blogger)
              m = re.search(r'(https://blogger\.googleusercontent\.com/img/[^"\'\s<>]+)', html_text)
              if m: return m.group(1)
              
              return None

          def main():
              arquivos = list(Path(".").glob("*.html"))
              total = len(arquivos)
              log(f"Analisando {total} arquivos HTML...")
              
              processados = 0
              consertados = 0

              for i, f in enumerate(arquivos, 1):
                  if processados >= LOTE_SIZE:
                      log(f"Lote de {LOTE_SIZE} atingido. Parando por hoje.")
                      break

                  if any(x in f.name for x in ["catalogo", "serie_desconhecida", "index"]):
                      continue

                  try:
                      conteudo = f.read_text(encoding="utf-8")
                      
                      if "via.placeholder.com" not in conteudo and "Sem+Capa" not in conteudo:
                          continue
                          
                      processados += 1
                      log(f"[{processados}/{LOTE_SIZE}] Procurando capa para: {f.name}")
                      
                      # Extrai o "slug" do nome do arquivo
                      slug_arquivo = re.sub(r'_t\d+e\d+\.html$', '', f.name, flags=re.I).replace('.html', '')
                      
                      url_pagina = achar_url_na_fila(slug_arquivo)

                      if not url_pagina:
                          # Fallback: tenta extrair do título e buscar no Feed
                          soup = BeautifulSoup(conteudo, 'html.parser')
                          script_ld = soup.find('script', type='application/ld+json')
                          titulo = ""
                          if script_ld:
                              try:
                                  dados = json.loads(script_ld.string)
                                  titulo = dados.get('name', '')
                              except: pass
                          
                          if not titulo:
                              h1 = soup.find('h1')
                              if h1: titulo = h1.text.strip()

                          busca = re.sub(r'\s*-\s*🍿Clau', '', titulo).strip()
                          partes = re.split(r'\s+-\s+|\s*T\d+E\d+', busca, maxsplit=1, flags=re.I)
                          nome_pai = partes[0].strip()
                          nome_pai = re.sub(r'\s*\(?\d{4}\)?\s*$', '', nome_pai).strip()

                          try:
                              r_feed = requests.get(f"{BASE_URL}/feeds/posts/default?q={requests.utils.quote(nome_pai)}&alt=json", headers=HEADERS, timeout=10)
                              if r_feed.status_code == 200:
                                  entries = r_feed.json().get("feed", {}).get("entry", [])
                                  if entries:
                                      url_pagina = next((l["href"] for l in entries[0].get("link", []) if l.get("rel") == "alternate"), None)
                          except: pass

                      if not url_pagina:
                          log(f"  [-] URL não encontrada para '{slug_arquivo}'")
                          continue

                      # Visita a página principal para pegar a capa
                      r = requests.get(url_pagina, headers=HEADERS, timeout=15)
                      nova_capa = extrair_capa(r.text)

                      if nova_capa:
                          conteudo = re.sub(r'poster="[^"]*"', f'poster="{nova_capa}"', conteudo)
                          conteudo = re.sub(r'"thumbnailUrl":\s*\[[^\]]*\]', f'"thumbnailUrl": ["{nova_capa}"]', conteudo, flags=re.DOTALL)
                          f.write_text(conteudo, encoding="utf-8")
                          log(f"  [+] Capa atualizada: {f.name}")
                          consertados += 1
                      else:
                          log(f"  [-] Não foi possível extrair a capa da página {url_pagina}")
                          
                  except Exception as e:
                      log(f"  [x] Erro ao processar {f.name}: {e}")

              log(f"Finalizado! Arquivos analisados: {processados} | Capas consertadas: {consertados}")

          if __name__ == "__main__":
              main()
          PYEOF
          python3 /tmp/consertar_capas.py

      - name: Salvar arquivos e progresso
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add -A
          git reset .github/ 2>/dev/null || true
          
          if git diff --cached --quiet; then echo "Nenhuma capa precisou ser consertada nesta run."; exit 0; fi
          git commit -m "fix: consertar capas faltantes nos arquivos antigos"
          
          for i in $(seq 1 5); do
            if git push origin HEAD:main; then break; fi
            echo "Conflito detectado. Sincronizando de forma segura..."
            git pull origin main --no-rebase -X ours --no-edit
            git add -A
            git reset .github/ 2>/dev/null || true
            git commit -m "fix: retry consertar capas $i" || true
            sleep $((RANDOM % 10 + 5))
          done
