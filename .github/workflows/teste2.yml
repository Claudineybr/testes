name: Salvar URL do Vídeo e Capa em TXT

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Escanear HTMLs e gerar TXT
        run: |
          python3 -u << 'PYEOF'
          import re
          from pathlib import Path

          PLACEHOLDER = "https://via.placeholder.com/500x750?text=Sem+Capa"

          todos = []
          sem_capa = []
          sem_video = 0
          arquivos_vistos = 0

          for arq in sorted(Path('.').rglob('*.html')):
              if '.git' in arq.parts: continue
              arquivos_vistos += 1
              try: texto = arq.read_text(encoding='utf-8', errors='ignore')
              except: continue

              # Extrai video URL (prioriza contentUrl, depois <video src>)
              video = None
              for pat in [r'"contentUrl"\s*:\s*"([^"]+)"',
                          r'<video[^>]+src=["\']([^"\']+)["\']']:
                  m = re.search(pat, texto, re.I)
                  if m: video = m.group(1).strip(); break

              if not video:
                  sem_video += 1
                  continue

              # Extrai capa (prioriza thumbnailUrl, depois <video poster>)
              capa = None
              for pat in [r'"thumbnailUrl"\s*:\s*(?:\[\s*)?"([^"]+)"',
                          r'<video[^>]+poster=["\']([^"\']+)["\']']:
                  m = re.search(pat, texto, re.I)
                  if m: capa = m.group(1).strip(); break

              tem_capa = bool(capa and capa != PLACEHOLDER and len(capa) > 15 and capa.startswith(('http://','https://')))
              status = "com_capa" if tem_capa else "sem_capa"

              todos.append(f"{arq.name}\t{video}\t{capa or ''}\t{status}")
              if not tem_capa:
                  sem_capa.append(f"{arq.name}\t{video}")

          # Salva inventário completo
          Path('videos_e_capas.txt').write_text(
              "arquivo\tvideo_url\tcapa_url\tstatus\n" + '\n'.join(todos),
              encoding='utf-8'
          )

          # Salva só os sem capa
          Path('videos_sem_capa.txt').write_text(
              '\n'.join(sem_capa) if sem_capa else "",
              encoding='utf-8'
          )

          com_capa = len(todos) - len(sem_capa)
          print(f"Arquivos HTML vistos: {arquivos_vistos}")
          print(f"Com video URL: {len(todos)}")
          print(f"Com capa: {com_capa}")
          print(f"Sem capa: {len(sem_capa)}")
          print(f"Sem video URL: {sem_video}")
          print(f"\nArquivos gerados:")
          print(f"  videos_e_capas.txt   ({len(todos)} linhas)")
          print(f"  videos_sem_capa.txt  ({len(sem_capa)} linhas)")
          PYEOF

      - name: Mostrar amostra
        run: |
          echo "=== videos_e_capas.txt (5 primeiras) ==="
          head -6 videos_e_capas.txt
          echo ""
          echo "=== videos_sem_capa.txt (5 primeiras) ==="
          head -5 videos_sem_capa.txt 2>/dev/null || echo "(vazio)"

      - name: Commitar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos_e_capas.txt videos_sem_capa.txt
          if git diff --cached --quiet; then echo "Nada novo."; exit 0; fi
          git commit -m "chore: inventário de vídeos e capas [skip ci]"
          git push
