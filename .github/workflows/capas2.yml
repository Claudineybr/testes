name: Aplicar Capas do Site (BFS profundo)

on:
  workflow_dispatch:
    inputs:
      apply_changes:
        description: 'Aplicar capas aos HTMLs?'
        type: boolean
        default: true
      max_pages:
        description: 'Máx. de páginas a visitar por run'
        type: string
        default: '200'

permissions:
  contents: write

# evita que dois runs do chain se sobreponham
concurrency:
  group: scrape-chain
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      # ⚠️ troque se renomear o arquivo .yml
      WORKFLOW_FILE: scrape.yml

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Playwright
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Raspar site (BFS) e aplicar capas
        env:
          APPLY: ${{ inputs.apply_changes }}
          MAX_PAGES: ${{ inputs.max_pages }}
        run: |
          python3 << 'PYEOF'
          import os, re, json, time, urllib.parse
          from pathlib import Path
          from collections import deque
          from playwright.sync_api import sync_playwright

          SITE         = "https://www.vini7xgrave.site"
          PLACEHOLDER  = "https://via.placeholder.com/500x750?text=Sem+Capa"
          USER_AGENT   = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          MAX_PAGES    = int(os.environ.get("MAX_PAGES") or "200")
          APPLY        = os.environ.get("APPLY", "true").lower() == "true"

          DATA_FILE   = Path('.scrape_data.json')
          SEEN_FILE   = Path('.scrape_seen.json')
          SKIP_FILE   = Path('.scrape_skip.json')
          STATUS_FILE = Path('.scrape_status.json')

          video_map = {}
          title_map = {}
          seen_urls = set()
          skip_urls = set()

          if DATA_FILE.exists():
              try:
                  d = json.loads(DATA_FILE.read_text(encoding='utf-8'))
                  video_map = d.get('video_map', {})
                  title_map = d.get('title_map', {})
                  print(f"Retomando: video={len(video_map)} title={len(title_map)}")
              except: pass
          if SEEN_FILE.exists():
              try: seen_urls = set(json.loads(SEEN_FILE.read_text(encoding='utf-8')))
              except: pass
          if SKIP_FILE.exists():
              try: skip_urls = set(json.loads(SKIP_FILE.read_text(encoding='utf-8')))
              except: pass

          def save_all():
              DATA_FILE.write_text(json.dumps({'video_map': video_map, 'title_map': title_map}, ensure_ascii=False, indent=2), encoding='utf-8')
              SEEN_FILE.write_text(json.dumps(list(seen_urls), ensure_ascii=False), encoding='utf-8')
              SKIP_FILE.write_text(json.dumps(list(skip_urls), ensure_ascii=False), encoding='utf-8')

          def save_status(queue_remaining, visited):
              STATUS_FILE.write_text(json.dumps({
                  'queue_remaining': queue_remaining,
                  'visited': visited,
                  'max_pages': MAX_PAGES,
                  'video_map': len(video_map),
                  'title_map': len(title_map),
                  'timestamp': int(time.time()),
              }, ensure_ascii=False, indent=2), encoding='utf-8')

          def norm_video(url):
              if not url: return ""
              m = re.search(r'(tt\d{6,10})', url.lower())
              if m: return m.group(1) + ".mp4"
              u = url.split('?')[0].split('#')[0].rstrip('/')
              return u.split('/')[-1].lower()

          def norm_title(t):
              if not t: return ""
              t = t.lower().strip()
              t = re.sub(r'^(assistir|ver|onde assistir|onde ver)\s+', '', t)
              t = re.sub(r'\s*[-–|]\s*[\w\s]*clau[\w\s]*$', '', t, flags=re.I)
              t = re.sub(r'\s*[-–|]\s*[\w\s]*vini7xgrave[\w\s]*$', '', t, flags=re.I)
              t = re.sub(r'\s*[-–]\s*t\d+e\d+.*$', '', t, flags=re.I)
              t = re.sub(r'\(\d+\)', '', t)
              t = re.sub(r'\b(19|20)\d{2}\b', '', t)
              t = re.sub(r'\b(online|dublado|legendado|hdcam|completo|filme|serie|t\d+e\d+)\b', '', t, flags=re.I)
              t = re.sub(r'[^\w\s]', ' ', t)
              return re.sub(r'\s+', ' ', t).strip()

          def add_pair(video, cover, title=None):
              if cover:
                  cover = cover.strip()
                  if cover.startswith('//'): cover = 'https:' + cover
                  if video:
                      vk = norm_video(video)
                      if vk and vk not in video_map: video_map[vk] = cover
                  if title:
                      tk = norm_title(title)
                      if tk and tk not in title_map: title_map[tk] = cover

          def is_detail_url(u):
              p = urllib.parse.urlparse(u)
              path = p.path.lower().strip('/')
              if not path: return False
              if path in ('dmca','contato','privacidade','sobre','termos','login','cadastro','search'): return False
              if re.match(r'^[a-z0-9]+(-[a-z0-9]+)+$', path): return True
              if re.match(r'^[a-z0-9]+(_[a-z0-9]+)+$', path): return True
              return False

          def is_listing_url(u):
              p = urllib.parse.urlparse(u)
              path = p.path.lower()
              if re.search(r'/page/\d+', path): return True
              if re.search(r'[?&]page=\d+', u): return True
              if re.search(r'[?&]paged=\d+', u): return True
              for kw in ('/filme','/serie','/genero','/categoria','/tag','/letra','/category','/genre','/todos','/catalogo'):
                  if kw in path: return True
              if path.count('/') <= 1 and path.strip('/'): return True
              return False

          def walk_json(obj, depth=0):
              if depth > 8: return
              if isinstance(obj, dict):
                  video = cover = title = None
                  for k in ('contentUrl','content_url','video_url','videoUrl','video','file','src','stream_url','stream','link_play','play_url'):
                      v = obj.get(k)
                      if isinstance(v, str) and any(x in v.lower() for x in ('.mp4','.m3u8','.ts','/hls/','/vod/','stream','embed')):
                          video = v; break
                  for k in ('thumbnailUrl','thumbnail_url','poster','poster_path','cover','image','img','thumbnail','capa','imagem','thumb'):
                      v = obj.get(k)
                      if isinstance(v, list) and v and isinstance(v[0], str): cover = v[0]; break
                      if isinstance(v, str) and (v.startswith('http') or v.startswith('//')): cover = v; break
                  for k in ('name','title','titulo','nome'):
                      v = obj.get(k)
                      if isinstance(v, str) and v: title = v; break
                  if cover: add_pair(video, cover, title)
                  for v in obj.values(): walk_json(v, depth+1)
              elif isinstance(obj, list):
                  for x in obj: walk_json(x, depth+1)

          def walk_html(html):
              video = cover = title = None
              for pat in [r'"contentUrl"\s*:\s*"([^"]+)"',
                          r'<video[^>]+src=["\']([^"\']+)["\']',
                          r'<iframe[^>]+src=["\']([^"\']+\.(?:mp4|m3u8)[^"\']*)["\']']:
                  m = re.search(pat, html, re.I)
                  if m: video = m.group(1); break
              for pat in [r'"thumbnailUrl"\s*:\s*(?:\[\s*)?"([^"]+)"',
                          r'<meta[^>]*property=["\']og:image["\'][^>]*content=["\']([^"\']+)["\']',
                          r'<video[^>]+poster=["\']([^"\']+)["\']']:
                  m = re.search(pat, html, re.I)
                  if m: cover = m.group(1); break
              m = re.search(r'<title>([^<]+)</title>', html, re.I)
              if m: title = m.group(1)
              if cover: add_pair(video, cover, title)

          visited = 0
          added_urls = 0
          queue = deque()

          with sync_playwright() as p:
              browser = p.chromium.launch(
                  headless=True,
                  args=['--no-sandbox','--disable-blink-features=AutomationControlled','--disable-dev-shm-usage']
              )
              ctx = browser.new_context(
                  user_agent=USER_AGENT,
                  viewport={'width': 1920, 'height': 1080},
                  locale='pt-BR',
              )
              page = ctx.new_page()

              def on_response(resp):
                  try:
                      ct = (resp.headers.get('content-type') or '').lower()
                      if 'json' in ct:
                          try: walk_json(resp.json())
                          except: pass
                      elif 'html' in ct:
                          try: walk_html(resp.text())
                          except: pass
                  except: pass
              page.on('response', on_response)

              def collect_links_and_cards():
                  try:
                      data = page.evaluate('''() => {
                          const cards = [];
                          const seen = new WeakSet();
                          const sel = ['article','.card','.item','.post','.movie','.film','.serie',
                                       '[class*="card"]','[class*="movie"]','[class*="serie"]',
                                       '[class*="film"]','[class*="post"]','[class*="item"]','[class*="entry"]'];
                          for (const s of sel) {
                              document.querySelectorAll(s).forEach(el => {
                                  if (seen.has(el)) return;
                                  seen.add(el);
                                  const img = el.querySelector('img[src],img[data-src],img[data-lazy-src],img[data-original]');
                                  const a = el.querySelector('a[href]');
                                  const tEl = el.querySelector('h1,h2,h3,.title,[class*="title"],[class*="name"]');
                                  let poster = img ? (img.src || img.dataset.src || img.dataset.lazySrc || img.dataset.original) : null;
                                  if (!poster) {
                                      const bg = el.querySelector('[style*="background-image"]');
                                      if (bg) { const m = bg.style.backgroundImage.match(/url\\(["']?(.+?)["']?\\)/); if (m) poster = m[1]; }
                                  }
                                  let title = tEl ? tEl.textContent.trim() : (img ? img.alt : null);
                                  if (poster && title) cards.push({poster, title, href: a ? a.href : null});
                              });
                          }
                          const links = [...document.querySelectorAll('a[href]')].map(a => a.href);
                          return {cards, links};
                      }''')
                      for c in data['cards']:
                          add_pair(None, c.get('poster'), c.get('title'))
                      return data['links']
                  except:
                      return []

              start_urls = [
                  SITE + '/',
                  SITE + '/filmes/', SITE + '/series/',
                  SITE + '/page/2/', SITE + '/page/3/',
                  SITE + '/categoria/filmes/', SITE + '/categoria/series/',
              ]
              for u in start_urls: queue.append(u)
              seen_urls.update(start_urls)

              while queue and visited < MAX_PAGES:
                  url = queue.popleft()
                  if url in skip_urls: continue
                  try:
                      resp = page.goto(url, wait_until='domcontentloaded', timeout=20000)
                      if resp and resp.status >= 400:
                          skip_urls.add(url); continue
                      page.wait_for_timeout(500)

                      try:
                          for _ in range(2):
                              btn = page.query_selector('button:has-text("Carregar mais"), button:has-text("Ver mais"), button:has-text("Load more"), .load-more, [class*="load-more"]')
                              if btn:
                                  btn.click(timeout=2000); page.wait_for_timeout(1200)
                              else: break
                      except: pass

                      try:
                          page.evaluate('window.scrollTo(0, document.body.scrollHeight)')
                          page.wait_for_timeout(500)
                      except: pass

                      links = collect_links_and_cards()
                      visited += 1

                      for link in links:
                          if not link.startswith(SITE): continue
                          if link in seen_urls or link in skip_urls: continue
                          if any(x in link.lower() for x in ('#','mailto:','javascript:','.css','.js','.png','.jpg','.jpeg','.webp','.svg','.ico','wp-login','/dmca','/contato','/privacidade','/sobre','/termos')):
                              continue
                          seen_urls.add(link)
                          if is_detail_url(link) or is_listing_url(link):
                              queue.append(link); added_urls += 1

                      if visited % 25 == 0:
                          print(f"[{visited}/{MAX_PAGES}] queue={len(queue)} video={len(video_map)} title={len(title_map)} novos_links={added_urls}")
                          save_all()
                          save_status(len(queue), visited)

                  except Exception:
                      skip_urls.add(url); continue

              browser.close()
              # queue ainda pode ter itens (se bateu MAX_PAGES) — capturamos aqui
              queue_remaining = len(queue)

          save_all()
          save_status(queue_remaining, visited)

          print(f"\nVisited: {visited} | Novos links: {added_urls} | Queue restante: {queue_remaining}")
          print(f"video_map={len(video_map)} | title_map={len(title_map)}")

          if not APPLY:
              print("APPLY=false — apenas coleta. Chain vai decidir se continua.")
              raise SystemExit(0)

          # aplica capas nos HTMLs
          total = alterados = via_video = via_title = via_filename = sem_match = 0
          for arq in sorted(Path('.').rglob('*.html')):
              if '.git' in arq.parts: continue
              total += 1
              try: texto = arq.read_text(encoding='utf-8', errors='ignore')
              except: continue
              if PLACEHOLDER not in texto: continue

              cu = re.search(r'"contentUrl"\s*:\s*"([^"]+)"', texto)
              cover = None; source = None

              if cu:
                  cover = video_map.get(norm_video(cu.group(1)))
                  if cover: source = "video"

              if not cover:
                  nm = re.search(r'"name"\s*:\s*"([^"]+)"', texto)
                  if nm:
                      cover = title_map.get(norm_title(nm.group(1)))
                      if cover: source = "title"

              if not cover:
                  cover = title_map.get(norm_title(arq.stem))
                  if cover: source = "filename"

              if not cover:
                  sem_match += 1; continue

              novo = texto.replace(PLACEHOLDER, cover)
              if novo != texto:
                  arq.write_text(novo, encoding='utf-8')
                  alterados += 1
                  if source == "video": via_video += 1
                  elif source == "title": via_title += 1
                  else: via_filename += 1
                  print(f"[ok/{source}] {arq.name}")

          print(f"\nTotal HTMLs: {total}")
          print(f"Alterados: {alterados} (video={via_video}, title={via_title}, filename={via_filename})")
          print(f"Sem match: {sem_match}")
          PYEOF

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-state
          path: |
            .scrape_data.json
            .scrape_seen.json
            .scrape_skip.json
            .scrape_status.json
          retention-days: 30

      - name: Commitar estado do scraper
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .scrape_data.json .scrape_seen.json .scrape_skip.json .scrape_status.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: estado do scraper [skip ci]"
          git push

      - name: Commitar capas aplicadas
        if: inputs.apply_changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "*.html"
          if git diff --cached --quiet; then
            echo "Nenhum HTML modificado."
            exit 0
          fi
          git commit -m "Auto: capas reais do site aplicadas [skip ci]"
          git push

      - name: Disparar próxima run (se fila não vazia)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.PAT_CHAIN }}
          REPO: ${{ github.repository }}
          WORKFLOW_FILE: ${{ env.WORKFLOW_FILE }}
        run: |
          # ----- status do run -----
          if [ ! -f .scrape_status.json ]; then
            echo "Sem .scrape_status.json — chain encerrada."
            exit 0
          fi

          QUEUE=$(python3 -c "import json; print(json.load(open('.scrape_status.json')).get('queue_remaining', -1))")
          VISITED=$(python3 -c "import json; print(json.load(open('.scrape_status.json')).get('visited', 0))")
          MAX_P=$(python3 -c "import json; print(json.load(open('.scrape_status.json')).get('max_pages', 0))")

          echo "📊 Queue restante: $QUEUE | Páginas visitadas: $VISITED/$MAX_P"

          if [ "$QUEUE" -le 0 ]; then
            echo "✅ Fila vazia. Chain encerrada."
            exit 0
          fi

          if [ -f .scrape_stop ]; then
            echo "🛑 .scrape_stop encontrado. Chain parada pelo usuário."
            exit 0
          fi

          # ----- limite 30 runs/hora -----
          LIMITE_ISO=$(date -u -d '60 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          RECENTES=$(gh run list \
            --workflow="$WORKFLOW_FILE" \
            --limit 100 \
            --json event,createdAt \
            --jq "[.[] | select(.event == \"workflow_dispatch\") | select(.createdAt > \"$LIMITE_ISO\")] | length" \
            --repo "$REPO" 2>/dev/null || echo 0)

          if [ "$RECENTES" -ge 30 ]; then
            echo "⚠️ Limite de 30 runs/hora atingido (recentes=$RECENTES). Chain encerrada."
            exit 0
          fi

          # ----- dispara -----
          APPLY="${{ inputs.apply_changes }}"
          MAX_PAGES_NEXT="${{ inputs.max_pages }}"
          echo "🔁 Disparando próxima run em 30s (apply=$APPLY, max_pages=$MAX_PAGES_NEXT)..."
          sleep 30

          for i in {1..5}; do
            if gh workflow run "$WORKFLOW_FILE" \
                --repo "$REPO" \
                --ref main \
                -f apply_changes="$APPLY" \
                -f max_pages="$MAX_PAGES_NEXT"; then
              echo "✅ Próxima run disparada com sucesso!"
              break
            else
              echo "⚠️ Erro ao disparar (tentativa $i/5). Tentando de novo em 15s..."
              sleep 15
            fi
          done
