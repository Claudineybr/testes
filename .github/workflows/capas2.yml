name: Aplicar Capas do Site

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar requests
        run: pip install requests

      - name: Raspar site + aplicar capas
        run: |
          python3 << 'PYEOF'
          import re, json, time
          from pathlib import Path
          import requests

          SITE = "https://www.vini7xgrave.site"
          PLACEHOLDER = "https://via.placeholder.com/500x750?text=Sem+Capa"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36",
              "Accept-Language": "pt-BR,pt;q=0.9,en;q=0.8",
          }

          session = requests.Session()
          session.headers.update(HEADERS)

          # ---------- cache ----------
          CACHE_FILE = Path(".site_scrape_cache.json")
          cache = {}
          if CACHE_FILE.exists():
              try: cache = json.loads(CACHE_FILE.read_text(encoding='utf-8'))
              except: cache = {}

          # ---------- normalizadores ----------
          def norm_video(url):
              if not url: return ""
              u = url.split('?')[0].split('#')[0].rstrip('/')
              return u.split('/')[-1].lower()

          def norm_title(t):
              if not t: return ""
              t = t.lower().strip()
              t = re.sub(r'^(assistir|ver|onde assistir|onde ver)\s+', '', t)
              t = re.sub(r'\s*[-–|]\s*[\w\s]*clau[\w\s]*$', '', t, flags=re.I)
              t = re.sub(r'\s*[-–|]\s*[\w\s]*vini7xgrave[\w\s]*$', '', t, flags=re.I)
              t = re.sub(r'\s*[-–]\s*t\d+e\d+.*$', '', t, flags=re.I)
              t = re.sub(r'\(\d+\)', '', t)
              t = re.sub(r'\b(19|20)\d{2}\b', '', t)
              t = re.sub(r'\b(online|dublado|legendado|hdcam|completo|filme|serie)\b', '', t, flags=re.I)
              t = re.sub(r'[^\w\s]', ' ', t)
              return re.sub(r'\s+', ' ', t).strip()

          # ---------- extrair video/capa/titulo de um HTML ----------
          def extract(html):
              video = cover = title = None
              m = re.search(r'"contentUrl"\s*:\s*"([^"]+)"', html)
              if m: video = m.group(1)
              if not video:
                  m = re.search(r'<meta[^>]*property=["\']og:video(?::url)?["\'][^>]*content=["\']([^"\']+)["\']', html, re.I)
                  if m: video = m.group(1)
              if not video:
                  m = re.search(r'<video[^>]+src=["\']([^"\']+)["\']', html, re.I)
                  if m: video = m.group(1)

              m = re.search(r'"thumbnailUrl"\s*:\s*(?:\[\s*)?"([^"]+)"', html)
              if m: cover = m.group(1)
              if not cover:
                  m = re.search(r'<meta[^>]*property=["\']og:image["\'][^>]*content=["\']([^"\']+)["\']', html, re.I)
                  if m: cover = m.group(1)
              if not cover:
                  m = re.search(r'<video[^>]+poster=["\']([^"\']+)["\']', html, re.I)
                  if m: cover = m.group(1)

              m = re.search(r'<title>([^<]+)</title>', html, re.I)
              if m: title = m.group(1)
              return video, cover, title

          # ---------- fetch com cache ----------
          def fetch(url):
              if url in cache:
                  return cache[url]
              try:
                  r = session.get(url, timeout=25)
                  if r.status_code != 200:
                      cache[url] = {"video": None, "cover": None, "title": None}
                      return cache[url]
                  v, c, t = extract(r.text)
                  cache[url] = {"video": v, "cover": c, "title": t}
                  return cache[url]
              except Exception as e:
                  print(f"  [erro] {url}: {e}")
                  cache[url] = {"video": None, "cover": None, "title": None}
                  return cache[url]

          # ---------- descoberta de URLs ----------
          def get_urls_wp_api():
              try:
                  r = session.get(f"{SITE}/wp-json/wp/v2/posts?per_page=100&page=1&_fields=link", timeout=20)
                  if r.status_code != 200: return None
                  urls, page = [], 1
                  while True:
                      r = session.get(f"{SITE}/wp-json/wp/v2/posts?per_page=100&page={page}&_fields=link", timeout=20)
                      if r.status_code == 400: break
                      if r.status_code != 200: break
                      data = r.json()
                      if not isinstance(data, list) or not data: break
                      urls.extend(x.get("link") for x in data if x.get("link"))
                      page += 1
                      if page > 200: break
                  return urls if urls else None
              except: return None

          def get_urls_sitemap():
              urls = set()
              for path in ["/sitemap.xml", "/sitemap_index.xml", "/wp-sitemap.xml"]:
                  try:
                      r = session.get(SITE + path, timeout=20)
                      if r.status_code == 200 and '<loc>' in r.text:
                          locs = re.findall(r'<loc>(.*?)</loc>', r.text)
                          xmls = [u for u in locs if u.endswith('.xml')]
                          urls.update(u for u in locs if not u.endswith('.xml'))
                          for sm in xmls[:20]:  # limita a 20 sub-sitemaps
                              try:
                                  r2 = session.get(sm, timeout=20)
                                  if r2.status_code == 200:
                                      urls.update(re.findall(r'<loc>(.*?)</loc>', r2.text))
                              except: pass
                          if urls: return list(urls)
                  except: pass
              return list(urls)

          # ---------- teste de acesso ----------
          try:
              r = session.get(SITE, timeout=20)
              if r.status_code == 403:
                  print("AVISO: site retornou 403. Pode estar bloqueando. Considere Playwright.")
          except Exception as e:
              print(f"AVISO: nao consegui acessar {SITE}: {e}")

          # ---------- coleta ----------
          print("== Buscando URLs ==")
          urls = get_urls_wp_api()
          if urls:
              print(f"WP API: {len(urls)} posts")
          else:
              print("WP API indisponivel, tentando sitemap...")
              urls = get_urls_sitemap()
              print(f"Sitemap: {len(urls)} URLs")

          SKIP_EXT = ('.xml', '.jpg', '.jpeg', '.png', '.gif', '.webp', '.css', '.js', '.ico', '.svg')
          video_map = {}
          title_map = {}
          new_fetches = 0

          for i, url in enumerate(urls):
              if any(url.lower().split('?')[0].endswith(e) for e in SKIP_EXT):
                  continue
              was_cached = url in cache
              info = fetch(url)
              if not was_cached: new_fetches += 1

              if info["video"] and info["cover"]:
                  vk = norm_video(info["video"])
                  if vk and vk not in video_map:
                      video_map[vk] = info["cover"]
              if info["title"] and info["cover"]:
                  tk = norm_title(info["title"])
                  if tk and tk not in title_map:
                      title_map[tk] = info["cover"]

              if (i + 1) % 50 == 0:
                  print(f"[{i+1}/{len(urls)}] video_map={len(video_map)} title_map={len(title_map)}")
                  CACHE_FILE.write_text(json.dumps(cache, ensure_ascii=False), encoding='utf-8')

              if not was_cached:
                  time.sleep(0.2)

          CACHE_FILE.write_text(json.dumps(cache, ensure_ascii=False), encoding='utf-8')
          print(f"\nVideo map: {len(video_map)} | Title map: {len(title_map)}")

          if not video_map and not title_map:
              print("ERRO: nenhuma capa coletada. O site pode precisar de JS.")
              raise SystemExit(1)

          # ---------- aplica nos HTMLs locais ----------
          total = alterados = via_video = via_title = sem_match = sem_cu = 0

          for arq in sorted(Path('.').rglob('*.html')):
              if '.git' in arq.parts: continue
              total += 1
              try:
                  texto = arq.read_text(encoding='utf-8', errors='ignore')
              except: continue
              if PLACEHOLDER not in texto: continue

              cu = re.search(r'"contentUrl"\s*:\s*"([^"]+)"', texto)
              if not cu:
                  sem_cu += 1
                  print(f"[sem contentUrl] {arq.name}")
                  continue

              cover = video_map.get(norm_video(cu.group(1)))
              source = "video"
              if not cover:
                  nm = re.search(r'"name"\s*:\s*"([^"]+)"', texto)
                  if nm:
                      cover = title_map.get(norm_title(nm.group(1)))
                      source = "title"
              if not cover:
                  sem_match += 1
                  continue

              novo = texto.replace(PLACEHOLDER, cover)
              if novo != texto:
                  arq.write_text(novo, encoding='utf-8')
                  alterados += 1
                  if source == "video": via_video += 1
                  else: via_title += 1
                  print(f"[ok/{source}] {arq.name}")

          print(f"\nTotal HTMLs: {total}")
          print(f"Alterados:   {alterados} (por video={via_video}, por titulo={via_title})")
          print(f"Sem match:   {sem_match}")
          print(f"Sem contentUrl: {sem_cu}")
          PYEOF

      - name: Commitar e enviar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sem mudancas."
            exit 0
          fi
          git commit -m "Auto: capas reais do site aplicadas [skip ci]"
          git push
