name: Aplicar Capas do Site (Playwright)

on:
  workflow_dispatch:
    inputs:
      apply_changes:
        description: 'Aplicar as capas aos HTMLs locais (desmarque p/ só raspar)'
        type: boolean
        default: true
      max_links:
        description: 'Máx. de links de detalhe p/ visitar (0 = só homepage)'
        type: string
        default: '300'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Playwright
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Raspar site e aplicar capas
        env:
          APPLY: ${{ inputs.apply_changes }}
          MAX_LINKS: ${{ inputs.max_links }}
        run: |
          python3 << 'PYEOF'
          import os, re, json, hashlib, urllib.parse
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          SITE         = "https://www.vini7xgrave.site/"
          PLACEHOLDER  = "https://via.placeholder.com/500x750?text=Sem+Capa"
          USER_AGENT   = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          MAX_LINKS    = int(os.environ.get("MAX_LINKS", "300"))
          APPLY        = os.environ.get("APPLY", "true").lower() == "true"

          video_map = {}   # nome_do_video -> capa
          title_map = {}   # titulo_normalizado -> capa
          seen_urls = set()
          log = []

          # ---------- helpers ----------
          def norm_video(url):
              if not url: return ""
              u = url.split('?')[0].split('#')[0].rstrip('/')
              base = u.split('/')[-1].lower()
              # extrai IMDB ID se existir (ex: tt36589671)
              m = re.search(r'(tt\d{6,10})', url.lower())
              if m: return m.group(1) + ".mp4"
              return base

          def norm_title(t):
              if not t: return ""
              t = t.lower().strip()
              t = re.sub(r'^(assistir|ver|onde assistir|onde ver)\s+', '', t)
              t = re.sub(r'\s*[-–|]\s*[\w\s]*clau[\w\s]*$', '', t, flags=re.I)
              t = re.sub(r'\s*[-–|]\s*[\w\s]*vini7xgrave[\w\s]*$', '', t, flags=re.I)
              t = re.sub(r'\s*[-–]\s*t\d+e\d+.*$', '', t, flags=re.I)
              t = re.sub(r'\(\d+\)', '', t)
              t = re.sub(r'\b(19|20)\d{2}\b', '', t)
              t = re.sub(r'\b(online|dublado|legendado|hdcam|completo|filme|serie|t\d+e\d+)\b', '', t, flags=re.I)
              t = re.sub(r'[^\w\s]', ' ', t)
              return re.sub(r'\s+', ' ', t).strip()

          def add_pair(video, cover, title=None):
              if video and cover:
                  vk = norm_video(video)
                  if vk and vk not in video_map:
                      video_map[vk] = cover
                      log.append(f"[VIDEO] {vk} <- {cover}")
              if title and cover:
                  tk = norm_title(title)
                  if tk and tk not in title_map:
                      title_map[tk] = cover
                      log.append(f"[TITLE] {tk} <- {cover}")

          def walk_json(obj, depth=0):
              """Busca recursiva por {video, cover, title} em qualquer JSON."""
              if depth > 8: return
              if isinstance(obj, dict):
                  video = cover = title = None
                  for k in ('contentUrl','content_url','video_url','videoUrl','video','file','src','stream_url','link','url'):
                      v = obj.get(k)
                      if isinstance(v, str) and any(x in v.lower() for x in ('.mp4','.m3u8','.ts','/hls/','/vod/','stream')):
                          video = v; break
                  for k in ('thumbnailUrl','thumbnail_url','poster','poster_path','cover','image','img','thumbnail','capa','imagem'):
                      v = obj.get(k)
                      if isinstance(v, list) and v and isinstance(v[0], str):
                          cover = v[0]; break
                      if isinstance(v, str) and v.startswith(('http://','https://','//')):
                          cover = v; break
                  for k in ('name','title','titulo','nome'):
                      v = obj.get(k)
                      if isinstance(v, str) and v:
                          title = v; break
                  if video and cover:
                      add_pair(video, cover, title)
                  for v in obj.values():
                      walk_json(v, depth+1)
              elif isinstance(obj, list):
                  for item in obj:
                      walk_json(item, depth+1)

          def walk_html(html, page_url=""):
              video = cover = title = None
              m = re.search(r'"contentUrl"\s*:\s*"([^"]+)"', html)
              if m: video = m.group(1)
              if not video:
                  m = re.search(r'<video[^>]+src=["\']([^"\']+)["\']', html, re.I)
                  if m: video = m.group(1)
              if not video:
                  m = re.search(r'<iframe[^>]+src=["\']([^"\']+)["\']', html, re.I)
                  if m: video = m.group(1)

              m = re.search(r'"thumbnailUrl"\s*:\s*(?:\[\s*)?"([^"]+)"', html)
              if m: cover = m.group(1)
              if not cover:
                  m = re.search(r'<meta[^>]*property=["\']og:image["\'][^>]*content=["\']([^"\']+)["\']', html, re.I)
                  if m: cover = m.group(1)
              if not cover:
                  m = re.search(r'<video[^>]+poster=["\']([^"\']+)["\']', html, re.I)
                  if m: cover = m.group(1)

              m = re.search(r'<title>([^<]+)</title>', html, re.I)
              if m: title = m.group(1)

              if video and cover:
                  add_pair(video, cover, title)

          # ---------- Playwright ----------
          with sync_playwright() as p:
              browser = p.chromium.launch(
                  headless=True,
                  args=['--no-sandbox','--disable-blink-features=AutomationControlled','--disable-dev-shm-usage']
              )
              ctx = browser.new_context(
                  user_agent=USER_AGENT,
                  viewport={'width': 1920, 'height': 1080},
                  locale='pt-BR',
              )
              page = ctx.new_page()

              def on_response(response):
                  try:
                      ct = (response.headers.get('content-type') or '').lower()
                      url = response.url
                      if 'json' in ct:
                          try: walk_json(response.json())
                          except: pass
                      elif 'html' in ct or '.html' in url:
                          try: walk_html(response.text())
                          except: pass
                  except Exception:
                      pass

              page.on('response', on_response)

              print(f"== Carregando {SITE} ==")
              try:
                  page.goto(SITE, wait_until='networkidle', timeout=90000)
              except Exception as e:
                  print(f"Aviso goto: {e}")
              page.wait_for_timeout(5000)

              # Screenshot da home p/ debug
              try:
                  page.screenshot(path='scrape_home.png', full_page=False)
                  Path('scrape_home.html').write_text(page.content(), encoding='utf-8')
              except: pass

              print(f"Após homepage: video={len(video_map)} title={len(title_map)}")

              # ---- extrai cards do DOM ----
              try:
                  cards = page.evaluate('''() => {
                      const out = [];
                      const seen = new WeakSet();
                      const sel = ['article','.card','.item','.post','.movie','.film','.serie',
                                   '[class*="card"]','[class*="movie"]','[class*="serie"]',
                                   '[class*="film"]','[class*="post"]','[class*="item"]'];
                      for (const s of sel) {
                          document.querySelectorAll(s).forEach(el => {
                              if (seen.has(el)) return;
                              seen.add(el);
                              const img = el.querySelector('img[src],img[data-src],img[data-lazy-src],img[data-original]');
                              const a = el.querySelector('a[href]');
                              const tEl = el.querySelector('h1,h2,h3,.title,[class*="title"],[class*="name"]');
                              let poster = img ? (img.src || img.dataset.src || img.dataset.lazySrc || img.dataset.original) : null;
                              if (!poster) {
                                  const bg = el.querySelector('[style*="background-image"]');
                                  if (bg) {
                                      const m = bg.style.backgroundImage.match(/url\\(["']?(.+?)["']?\\)/);
                                      if (m) poster = m[1];
                                  }
                              }
                              let title = tEl ? tEl.textContent.trim() : (img ? img.alt : null);
                              if (!title && a) title = a.title;
                              if (poster && title) {
                                  out.push({poster, title, href: a ? a.href : null});
                              }
                          });
                      }
                      return out;
                  }''')
                  print(f"Cards DOM encontrados: {len(cards)}")
                  for c in cards:
                      add_pair(None, c.get('poster'), c.get('title'))
              except Exception as e:
                  print(f"Erro cards DOM: {e}")

              print(f"Após DOM: video={len(video_map)} title={len(title_map)}")

              # ---- explora links de detalhe ----
              detail_links = []
              try:
                  all_links = page.eval_on_selector_all('a[href]', 'els => els.map(e => e.href)')
                  for l in all_links:
                      if SITE.rstrip('/') not in l: continue
                      if l.rstrip('/') == SITE.rstrip('/'): continue
                      if any(x in l.lower() for x in ['#','javascript:','mailto:','.css','.js','.png','.jpg','.jpeg','.ico','/dmca','/contato','/privacidade','/sobre','/termos','/login','/cadastro','?s=']):
                          continue
                      if l not in seen_urls:
                          seen_urls.add(l)
                          detail_links.append(l)
              except Exception as e:
                  print(f"Erro links: {e}")

              print(f"Links únicos encontrados: {len(detail_links)}")
              sample = detail_links[:MAX_LINKS] if MAX_LINKS > 0 else []

              for i, link in enumerate(sample):
                  try:
                      page.goto(link, wait_until='domcontentloaded', timeout=25000)
                      page.wait_for_timeout(800)
                      # tenta também extrair cards da página de listagem
                      try:
                          more = page.evaluate('''() => {
                              const out = [];
                              document.querySelectorAll('article,.card,.item,a[href*="/filme"],a[href*="/serie"]').forEach(el => {
                                  const img = el.querySelector('img[src],img[data-src]');
                                  const a = el.tagName === 'A' ? el : el.querySelector('a[href]');
                                  const t = el.querySelector('h1,h2,h3,.title,[class*="title"]');
                                  if (img && t) out.push({poster: img.src || img.dataset.src, title: t.textContent.trim(), href: a ? a.href : null});
                              });
                              return out;
                          }''')
                          for c in more:
                              add_pair(None, c.get('poster'), c.get('title'))
                      except: pass
                  except Exception:
                      pass

                  if (i+1) % 25 == 0:
                      print(f"[{i+1}/{len(sample)}] video={len(video_map)} title={len(title_map)}")
                      Path('scrape_debug.log').write_text('\n'.join(log), encoding='utf-8')

              browser.close()

          print(f"\nFinal: video_map={len(video_map)}, title_map={len(title_map)}")

          # ---- salva artefatos ----
          Path('scrape_debug.log').write_text('\n'.join(log), encoding='utf-8')
          Path('scrape_data.json').write_text(json.dumps({
              'video_map': video_map,
              'title_map': title_map,
          }, ensure_ascii=False, indent=2), encoding='utf-8')

          if not video_map and not title_map:
              print("ERRO: nada coletado. Veja scrape_home.png / scrape_debug.log nos artifacts.")
              raise SystemExit(1)

          if not APPLY:
              print("APPLY=false — não aplicando aos HTMLs. Rode de novo com apply_changes=true.")
              raise SystemExit(0)

          # ---- aplica nos HTMLs locais ----
          total = alterados = via_video = via_title = sem_match = sem_cu = 0
          for arq in sorted(Path('.').rglob('*.html')):
              if '.git' in arq.parts: continue
              total += 1
              try: texto = arq.read_text(encoding='utf-8', errors='ignore')
              except: continue
              if PLACEHOLDER not in texto: continue

              cu = re.search(r'"contentUrl"\s*:\s*"([^"]+)"', texto)
              if not cu:
                  sem_cu += 1; continue

              cover = video_map.get(norm_video(cu.group(1)))
              source = "video"
              if not cover:
                  nm = re.search(r'"name"\s*:\s*"([^"]+)"', texto)
                  if nm:
                      cover = title_map.get(norm_title(nm.group(1)))
                      source = "title"
              if not cover:
                  # último recurso: pelo nome do arquivo
                  cover = title_map.get(norm_title(arq.stem))
                  source = "filename"
              if not cover:
                  sem_match += 1
                  continue

              novo = texto.replace(PLACEHOLDER, cover)
              if novo != texto:
                  arq.write_text(novo, encoding='utf-8')
                  alterados += 1
                  if source == "video": via_video += 1
                  else: via_title += 1
                  print(f"[ok/{source}] {arq.name}")

          print(f"\nTotal HTMLs: {total}")
          print(f"Alterados:   {alterados} (via_video={via_video}, via_title/filename={via_title})")
          print(f"Sem match:   {sem_match}")
          print(f"Sem contentUrl: {sem_cu}")
          PYEOF

      - name: Upload artifacts (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-debug
          path: |
            scrape_data.json
            scrape_debug.log
            scrape_home.png
            scrape_home.html
          retention-days: 14

      - name: Commitar e enviar
        if: inputs.apply_changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sem mudanças."
            exit 0
          fi
          git commit -m "Auto: capas reais do site aplicadas [skip ci]"
          git push
