name: Consertar Capas via TMDB (V2 Final)

on:
  workflow_dispatch:
    inputs:
      lote:
        description: 'Quantos arquivos verificar por run'
        required: false
        default: '1000'
        type: string

permissions:
  contents: write

concurrency:
  group: consertar-tmdb
  cancel-in-progress: false

jobs:
  consertar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Instalar dependências
        run: pip install requests beautifulsoup4

      - name: Verificar e consertar capas
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          LOTE_SIZE: ${{ inputs.lote || '1000' }}
        run: |
          cat > /tmp/consertar_tmdb_v2.py << 'PYEOF'
          import requests, re, os, sys, json, time
          from pathlib import Path
          from bs4 import BeautifulSoup

          API_KEY = os.environ.get("TMDB_API_KEY")
          LOTE_SIZE = int(os.environ.get('LOTE_SIZE', 1000))
          TMDB_API = "https://api.themoviedb.org/3"
          IMG_BASE = "https://image.tmdb.org/t/p/w500"

          if not API_KEY:
              print("ERRO: TMDB_API_KEY não configurada!")
              sys.exit(1)

          def log(*a): print(*a, flush=True); sys.stdout.flush()

          def limpar_nome_arquivo(nome_arquivo):
              # Remove .html
              nome = nome_arquivo.replace('.html', '')
              
              # Remove T1E1 (episódios) -> Busca a série inteira
              nome = re.sub(r'_t\d+e\d+', '', nome, flags=re.I)
              
              # Remove TODOS os anos (ex: _2024, _2026) para buscar só o nome limpo
              nome = re.sub(r'_(?:19|20)\d{2}', '', nome)
              
              # Remove lixos comuns
              lixo = r'_(comedia|infantil|aventura|thriller|legendado|dublado|hdcam|hd|webdl|bluray|suspense|terror|acao|romance|drama|misterio|guerra|documentario|anime|animacao|fantasia|familia|crime|historia|musica|novela|reality|talk_show|podcast|_ep\d*|_\d+)'
              nome = re.sub(lixo, '', nome, flags=re.I)
              
              # Substitui underline por espaço
              nome = nome.replace('_', ' ').strip()
              
              return nome.title()

          def buscar_tmdb(titulo, tipo="movie"):
              params = {"api_key": API_KEY, "query": titulo, "language": "pt-BR"}
              
              try:
                  r = requests.get(f"{TMDB_API}/search/{tipo}", params=params, timeout=10)
                  dados = r.json().get("results", [])
                  if dados:
                      return dados[0].get("poster_path")
              except Exception:
                  pass
              return None

          def main():
              arquivos = list(Path(".").glob("*.html"))
              log(f"Analisando {len(arquivos)} arquivos HTML...")
              
              processados = 0
              consertados = 0
              deletados = 0

              for f in arquivos:
                  if processados >= LOTE_SIZE:
                      log(f"Lote de {LOTE_SIZE} atingido. Parando por hoje.")
                      break

                  try:
                      conteudo = f.read_text(encoding="utf-8")
                      
                      # Pula os que já têm capa
                      if "via.placeholder.com" not in conteudo and "Sem+Capa" not in conteudo:
                          continue
                          
                      # Pula arquivos lixo
                      if any(x in f.name for x in ["catalogo", "serie_desconhecida", "index", "blog_post", "contexthttp", "html_2025"]):
                          f.unlink() # Deleta o lixo
                          deletados += 1
                          continue
                          
                      processados += 1
                      titulo_busca = limpar_nome_arquivo(f.name)
                      
                      if len(titulo_busca) < 3:
                          continue
                          
                      log(f"[{processados}/{LOTE_SIZE}] Buscando no TMDB: '{titulo_busca}'")
                      
                      # Verifica se é série ou filme pela presença de T1E1 no nome original
                      tipo = "tv" if re.search(r'_t\d+e\d+', f.name, re.I) else "movie"
                      
                      poster_path = buscar_tmdb(titulo_busca, tipo)
                      
                      # Fallback: tenta como filme se falhar como série (e vice-versa)
                      if not poster_path and tipo == "tv":
                          poster_path = buscar_tmdb(titulo_busca, "movie")
                      elif not poster_path and tipo == "movie":
                          poster_path = buscar_tmdb(titulo_busca, "tv")
                      
                      if poster_path:
                          nova_capa = IMG_BASE + poster_path
                          
                          novo_html = re.sub(r'poster="[^"]*"', f'poster="{nova_capa}"', conteudo)
                          novo_html = re.sub(r'<img src="[^"]*"', f'<img src="{nova_capa}"', novo_html)
                          novo_html = re.sub(r'"thumbnailUrl":\s*\[[^\]]*\]', f'"thumbnailUrl": ["{nova_capa}"]', novo_html, flags=re.DOTALL)
                          
                          f.write_text(novo_html, encoding="utf-8")
                          log(f"  [+] Capa atualizada: {nova_capa}")
                          consertados += 1
                      else:
                          log(f"  [-] Não encontrado no TMDB.")
                          
                      time.sleep(0.1)
                      
                  except Exception as e:
                      log(f"  [x] Erro em {f.name}: {e}")

              log(f"Finalizado! Analisados: {processados} | Consertados: {consertados} | Deletados: {deletados}")

          if __name__ == "__main__":
              main()
          PYEOF
          python3 /tmp/consertar_tmdb_v2.py

      - name: Salvar arquivos e progresso
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add -A
          git reset .github/ 2>/dev/null || true
          
          if git diff --cached --quiet; then echo "Nenhuma capa precisou ser consertada."; exit 0; fi
          git commit -m "fix: consertar capas restantes via TMDB V2"
          
          for i in $(seq 1 5); do
            if git push origin HEAD:main; then break; fi
            echo "Conflito detectado. Sincronizando de forma segura..."
            git pull origin main --no-rebase -X ours --no-edit
            git add -A
            git reset .github/ 2>/dev/null || true
            git commit -m "fix: retry consertar tmdb v2 $i" || true
            sleep $((RANDOM % 10 + 5))
          done
