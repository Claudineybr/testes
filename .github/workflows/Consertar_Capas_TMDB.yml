name: Consertar Capas via TMDB (V3 Final)

on:
  workflow_dispatch:
    inputs:
      lote:
        description: 'Quantos arquivos verificar por run'
        required: false
        default: '1000'
        type: string

permissions:
  contents: write

concurrency:
  group: consertar-tmdb
  cancel-in-progress: false

jobs:
  consertar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Instalar dependências
        run: pip install requests beautifulsoup4

      - name: Verificar e consertar capas
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          LOTE_SIZE: ${{ inputs.lote || '1000' }}
        run: |
          cat > /tmp/consertar_tmdb_v3.py << 'PYEOF'
          import requests, re, os, sys, json, time, unicodedata
          from pathlib import Path
          from bs4 import BeautifulSoup

          API_KEY = os.environ.get("TMDB_API_KEY")
          LOTE_SIZE = int(os.environ.get('LOTE_SIZE', 1000))
          TMDB_API = "https://api.themoviedb.org/3"
          IMG_BASE = "https://image.tmdb.org/t/p/w500"

          if not API_KEY:
              print("ERRO: TMDB_API_KEY não configurada!")
              sys.exit(1)

          def log(*a): print(*a, flush=True); sys.stdout.flush()

          def strip_accents(s):
              return ''.join(c for c in unicodedata.normalize('NFD', s) if unicodedata.category(c) != 'Mn')

          def limpar_nome_arquivo(nome_arquivo):
              nome = nome_arquivo.replace('.html', '')
              nome = re.sub(r'_t\d+e\d+', '', nome, flags=re.I)
              
              # Remove lixos específicos (nomes de gêneros colados)
              lixo_regex = r'_(acaocomedia|comediaanimacao|infantilaventura|terrormisterio|legendado|dublado|hdcam|webdl|bluray|comedia|infantil|aventura|thriller|suspense|terror|acao|romance|drama|misterio|guerra|documentario|anime|animacao|fantasia|familia|crime|historia|musica|novela|reality|talk_show|podcast)\w*'
              nome = re.sub(lixo_regex, '', nome, flags=re.I)
              
              # Remove todos os anos
              nome = re.sub(r'_(?:19|20)\d{2}', '', nome)
              
              # Remove números soltos no final (ex: _20, _9, _23)
              nome = re.sub(r'_\d+$', '', nome)
              
              # Remove HTML e INIX
              nome = re.sub(r'_html|_inix|_entre_nos', '', nome, flags=re.I)
              
              nome = nome.replace('_', ' ').strip()
              nome = re.sub(r'\s+', ' ', nome)
              return nome.title()

          def buscar_tmdb(titulo):
              # Tenta buscar com acento
              params = {"api_key": API_KEY, "query": titulo, "language": "pt-BR"}
              try:
                  r = requests.get(f"{TMDB_API}/search/multi", params=params, timeout=10)
                  dados = r.json().get("results", [])
                  for d in dados:
                      if d.get('media_type') in ['movie', 'tv'] and d.get('poster_path'):
                          return d['poster_path']
              except: pass

              # Tenta buscar sem acento
              titulo_sem_acento = strip_accents(titulo)
              if titulo != titulo_sem_acento:
                  params["query"] = titulo_sem_acento
                  try:
                      r = requests.get(f"{TMDB_API}/search/multi", params=params, timeout=10)
                      dados = r.json().get("results", [])
                      for d in dados:
                          if d.get('media_type') in ['movie', 'tv'] and d.get('poster_path'):
                              return d['poster_path']
                  except: pass

              return None

          def buscar_por_imdb(imdb_id):
              try:
                  r = requests.get(f"{TMDB_API}/find/{imdb_id}?external_source=imdb_id&api_key={API_KEY}&language=pt-BR", timeout=10)
                  dados = r.json()
                  
                  # Se for filme
                  if dados.get("movie_results"):
                      return dados["movie_results"][0].get("poster_path")
                  
                  # Se for série
                  if dados.get("tv_results"):
                      return dados["tv_results"][0].get("poster_path")
                  
                  # Se for episódio (pega a capa da série principal)
                  if dados.get("tv_episode_results"):
                      show_id = dados["tv_episode_results"][0].get("show_id")
                      if show_id:
                          r_show = requests.get(f"{TMDB_API}/tv/{show_id}?api_key={API_KEY}&language=pt-BR", timeout=10)
                          return r_show.json().get("poster_path")
              except: pass
              return None

          def main():
              arquivos = list(Path(".").glob("*.html"))
              log(f"Analisando {len(arquivos)} arquivos HTML...")
              
              processados = 0
              consertados = 0
              deletados = 0

              for f in arquivos:
                  if processados >= LOTE_SIZE:
                      log(f"Lote de {LOTE_SIZE} atingido. Parando por hoje.")
                      break

                  try:
                      conteudo = f.read_text(encoding="utf-8")
                      
                      if "via.placeholder.com" not in conteudo and "Sem+Capa" not in conteudo:
                          continue
                          
                      if any(x in f.name for x in ["catalogo", "serie_desconhecida", "index", "blog_post", "contexthttp", "html_2025", "service_unavailable"]):
                          f.unlink()
                          deletados += 1
                          continue
                          
                      processados += 1
                      titulo_busca = limpar_nome_arquivo(f.name)
                      
                      if len(titulo_busca) < 3:
                          continue
                          
                      log(f"[{processados}/{LOTE_SIZE}] Buscando no TMDB: '{titulo_busca}'")
                      
                      poster_path = buscar_tmdb(titulo_busca)
                      
                      # Fallback 1: Tenta achar o IMDB ID dentro do arquivo
                      if not poster_path:
                          log(f"  [-] Nome não achado. Tentando via IMDB ID...")
                          match_imdb = re.search(r'(tt\d{7,9})', conteudo)
                          if match_imdb:
                              poster_path = buscar_por_imdb(match_imdb.group(1))
                              if poster_path:
                                  log(f"  [+] Resgatado via IMDB: {match_imdb.group(1)}")
                      
                      if poster_path:
                          nova_capa = IMG_BASE + poster_path
                          novo_html = re.sub(r'poster="[^"]*"', f'poster="{nova_capa}"', conteudo)
                          novo_html = re.sub(r'<img src="[^"]*"', f'<img src="{nova_capa}"', novo_html)
                          novo_html = re.sub(r'"thumbnailUrl":\s*\[[^\]]*\]', f'"thumbnailUrl": ["{nova_capa}"]', novo_html, flags=re.DOTALL)
                          
                          f.write_text(novo_html, encoding="utf-8")
                          log(f"  [+] Capa atualizada: {nova_capa}")
                          consertados += 1
                      else:
                          log(f"  [-] Não encontrado no TMDB.")
                          
                      time.sleep(0.1)
                      
                  except Exception as e:
                      log(f"  [x] Erro em {f.name}: {e}")

              log(f"Finalizado! Analisados: {processados} | Consertados: {consertados} | Deletados: {deletados}")

          if __name__ == "__main__":
              main()
          PYEOF
          python3 /tmp/consertar_tmdb_v3.py

      - name: Salvar arquivos e progresso
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add -A
          git reset .github/ 2>/dev/null || true
          
          if git diff --cached --quiet; then echo "Nenhuma capa precisou ser consertada."; exit 0; fi
          git commit -m "fix: consertar capas restantes via TMDB V3"
          
          for i in $(seq 1 5); do
            if git push origin HEAD:main; then break; fi
            echo "Conflito detectado. Sincronizando de forma segura..."
            git pull origin main --no-rebase -X ours --no-edit
            git add -A
            git reset .github/ 2>/dev/null || true
            git commit -m "fix: retry consertar tmdb v3 $i" || true
            sleep $((RANDOM % 10 + 5))
          done
