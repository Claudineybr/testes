name: Extrair URL do Vídeo e Capa (JSON)

on:
  workflow_dispatch:
    inputs:
      outro_repo:
        description: 'URL do repo com os JSONs'
        required: true
        default: 'https://github.com/Claudineybr/catalogocompleto2.git'
      branch:
        description: 'Branch'
        default: 'main'

permissions:
  contents: write

jobs:
  extrair:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Clonar e diagnosticar estrutura
        env:
          REPO_URL: ${{ inputs.outro_repo }}
          BRANCH: ${{ inputs.branch }}
        run: |
          set -e
          TMP=$(mktemp -d)
          echo "Clonando $REPO_URL..."
          if git clone --depth 1 --branch "$BRANCH" "$REPO_URL" "$TMP/outro" 2>/dev/null; then
            echo "OK branch $BRANCH"
          else
            git clone --depth 1 "$REPO_URL" "$TMP/outro"
            echo "OK branch default"
          fi
          echo "OUTRO_DIR=$TMP/outro" >> $GITHUB_ENV

          echo ""
          echo "=== Estrutura raiz ==="
          ls -la "$TMP/outro" | head -30

          echo ""
          echo "=== Contagem por extensão ==="
          find "$TMP/outro" -type f -not -path '*/.git/*' | \
            sed 's/.*\.//' | sort | uniq -c | sort -rn | head -15

          echo ""
          echo "=== Total de JSONs ==="
          echo "*.json: $(find "$TMP/outro" -name '*.json' -not -path '*/.git/*' | wc -l)"

          echo ""
          echo "=== Primeiros 10 JSONs ==="
          find "$TMP/outro" -name '*.json' -not -path '*/.git/*' | head -10

          echo ""
          echo "=== Amostra do 1º JSON (primeiras 40 linhas) ==="
          SAMPLE=$(find "$TMP/outro" -name '*.json' -not -path '*/.git/*' | head -1)
          if [ -n "$SAMPLE" ]; then
            echo "Arquivo: $SAMPLE"
            head -40 "$SAMPLE"
          fi

      - name: Extrair pares de TODOS os JSONs
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python3 -u - << 'PYEOF'
          import os
          import re
          import json
          from pathlib import Path

          TAB = chr(9)
          NL = chr(10)
          OUTRO_DIR = Path(os.environ["OUTRO_DIR"])

          def is_valid_cover(url):
              if not url or not isinstance(url, str):
                  return False
              url = url.strip()
              if len(url) < 15:
                  return False
              if not (url.startswith("http://") or url.startswith("https://")):
                  return False
              if "via.placeholder.com" in url:
                  return False
              if "placehold.co" in url:
                  return False
              return True

          def norm_video(url):
              if not url:
                  return ""
              m = re.search(r"(tt\d{6,10})", url.lower())
              if m:
                  return m.group(1) + ".mp4"
              m = re.search(
                  r"([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})",
                  url.lower(),
              )
              if m:
                  return m.group(1)
              u = url.split("?")[0].split("#")[0].rstrip("/")
              return u.split("/")[-1].lower()

          def extract_pairs(obj, path="", depth=0):
              """
              Varre recursivamente um objeto JSON procurando pares
              (video_url, capa_url). Retorna lista de tuplas (video, capa).
              """
              if depth > 15:
                  return []
              results = []

              if isinstance(obj, dict):
                  # 1) Objeto com contentUrl + thumbnailUrl (JSON-LD clássico)
                  video = None
                  capa = None

                  for k in (
                      "contentUrl",
                      "content_url",
                      "video_url",
                      "videoUrl",
                      "video",
                      "file",
                      "src",
                      "stream_url",
                      "stream",
                      "link_play",
                      "play_url",
                      "mp4",
                  ):
                      v = obj.get(k)
                      if isinstance(v, str) and v.strip():
                          video = v.strip()
                          break

                  for k in (
                      "thumbnailUrl",
                      "thumbnail_url",
                      "poster",
                      "poster_path",
                      "cover",
                      "image",
                      "img",
                      "thumbnail",
                      "capa",
                      "imagem",
                      "thumb",
                  ):
                      v = obj.get(k)
                      if isinstance(v, list) and v and isinstance(v[0], str):
                          if is_valid_cover(v[0]):
                              capa = v[0].strip()
                              break
                      if isinstance(v, str) and is_valid_cover(v):
                          capa = v.strip()
                          break

                  if video and capa:
                      results.append((video, capa, path))

                  # 2) Recursão em todos os valores
                  for k, v in obj.items():
                      results.extend(extract_pairs(v, path + "/" + str(k), depth + 1))

              elif isinstance(obj, list):
                  for i, item in enumerate(obj):
                      results.extend(
                          extract_pairs(item, path + "[" + str(i) + "]", depth + 1)
                      )

              return results

          print("Varrendo JSONs em: " + str(OUTRO_DIR))

          mapa_key = {}
          mapa_url = {}
          origem = {}
          total_arquivos = 0
          total_pares = 0
          arquivos_sem_par = 0
          arquivos_erro_json = 0
          conflitos = 0

          for arq in sorted(OUTRO_DIR.rglob("*.json")):
              if ".git" in arq.parts:
                  continue
              total_arquivos += 1
              try:
                  texto = arq.read_text(encoding="utf-8", errors="ignore")
              except Exception:
                  continue

              try:
                  dados = json.loads(texto)
              except Exception as e:
                  arquivos_erro_json += 1
                  print("[erro JSON] " + arq.name + ": " + str(e)[:80])
                  continue

              pares = extract_pairs(dados)
              if not pares:
                  arquivos_sem_par += 1
                  continue

              total_pares += len(pares)
              for video, capa, caminho in pares:
                  vk = norm_video(video)
                  if not vk:
                      continue
                  if vk in mapa_key and mapa_key[vk] != capa:
                      conflitos += 1
                      continue
                  mapa_key[vk] = capa
                  mapa_url[video] = capa
                  origem[vk] = arq.name + caminho

          # Salva
          linhas = ["video_key" + TAB + "capa_url" + TAB + "origem"]
          for k in sorted(mapa_key.keys()):
              linhas.append(k + TAB + mapa_key[k] + TAB + origem.get(k, ""))
          Path("capas_por_key.txt").write_text(NL.join(linhas), encoding="utf-8")

          linhas_url = ["video_url" + TAB + "capa_url"]
          for k in sorted(mapa_url.keys()):
              linhas_url.append(k + TAB + mapa_url[k])
          Path("capas_por_url.txt").write_text(NL.join(linhas_url), encoding="utf-8")

          resumo = NL.join(
              [
                  "Resumo da extracao (JSON)",
                  "=========================",
                  "Repo: " + str(OUTRO_DIR),
                  "JSONs varridos: " + str(total_arquivos),
                  "Pares (video, capa) encontrados: " + str(total_pares),
                  "Entradas unicas (por chave): " + str(len(mapa_key)),
                  "Arquivos sem par encontrado: " + str(arquivos_sem_par),
                  "Arquivos com JSON invalido: " + str(arquivos_erro_json),
                  "Conflitos: " + str(conflitos),
              ]
          ) + NL
          Path("capas_resumo.txt").write_text(resumo, encoding="utf-8")
          print(resumo)

          print("=== Amostra capas_por_key ===")
          for k in list(sorted(mapa_key.keys()))[:10]:
              print(k[:50] + "  ->  " + mapa_key[k][:70])
          PYEOF

      - name: Mostrar resumo
        run: |
          echo "=== capas_resumo.txt ==="
          cat capas_resumo.txt
          echo ""
          echo "=== capas_por_key.txt (head) ==="
          head -11 capas_por_key.txt 2>/dev/null || echo "(vazio)"

      - name: Commitar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add capas_por_key.txt capas_por_url.txt capas_resumo.txt
          if git diff --cached --quiet; then
            echo "Nada novo."
            exit 0
          fi
          git commit -m "chore: capas extraidas do JSON [skip ci]"
          git push

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capas-extraidas
          if-no-files-found: ignore
          path: |
            capas_por_key.txt
            capas_por_url.txt
            capas_resumo.txt
          retention-days: 30
