name: Extrair URL do Vídeo e Capa

on:
  workflow_dispatch:
    inputs:
      outro_repo:
        description: 'URL do repo com os HTMLs que têm capa'
        required: true
        default: 'https://github.com/Claudineybr/catalogocompleto2.git'
      branch:
        description: 'Branch do outro repo'
        default: 'main'

permissions:
  contents: write

jobs:
  extrair:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Clonar repo
        env:
          REPO_URL: ${{ inputs.outro_repo }}
          BRANCH: ${{ inputs.branch }}
        run: |
          set -e
          TMP=$(mktemp -d)
          echo "Clonando $REPO_URL..."
          if git clone --depth 1 --branch "$BRANCH" "$REPO_URL" "$TMP/outro" 2>/dev/null; then
            echo "OK branch $BRANCH"
          elif git clone --depth 1 "$REPO_URL" "$TMP/outro"; then
            echo "OK branch default"
          else
            echo "::error::Falha ao clonar"
            exit 1
          fi
          echo "OUTRO_DIR=$TMP/outro" >> $GITHUB_ENV
          echo "HTMLs: $(find "$TMP/outro" -name '*.html' | wc -l)"

      - name: Extrair pares video+capa
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python3 -u - << 'PYEOF'
          import os
          import re
          from pathlib import Path

          TAB = chr(9)
          NL = chr(10)
          OUTRO_DIR = Path(os.environ["OUTRO_DIR"])

          def is_valid_cover(url):
              if not url or not isinstance(url, str):
                  return False
              url = url.strip()
              if len(url) < 15:
                  return False
              if not (url.startswith("http://") or url.startswith("https://")):
                  return False
              if "via.placeholder.com" in url:
                  return False
              if "placehold.co" in url:
                  return False
              return True

          def norm_video(url):
              if not url:
                  return ""
              m = re.search(r"(tt\d{6,10})", url.lower())
              if m:
                  return m.group(1) + ".mp4"
              m = re.search(r"([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})", url.lower())
              if m:
                  return m.group(1)
              u = url.split("?")[0].split("#")[0].rstrip("/")
              return u.split("/")[-1].lower()

          def extract(html):
              video = None
              capa = None
              for pat in [r'"contentUrl"\s*:\s*"([^"]+)"', r'<video[^>]+src=["\']([^"\']+)["\']']:
                  m = re.search(pat, html, re.I)
                  if m:
                      video = m.group(1).strip()
                      break
              for pat in [r'"thumbnailUrl"\s*:\s*(?:\[\s*)?"(https?://[^"]+)"',
                          r'<video[^>]+poster=["\'](https?://[^"\']+)["\']',
                          r'<meta[^>]*property=["\']og:image["\'][^>]*content=["\'](https?://[^"\']+)["\']']:
                  m = re.search(pat, html, re.I)
                  if m and is_valid_cover(m.group(1)):
                      capa = m.group(1).strip()
                      break
              return video, capa

          print("Varrendo: " + str(OUTRO_DIR))

          mapa_key = {}
          mapa_url = {}
          origem = {}
          total = 0
          com_video = 0
          com_capa = 0
          sem_video = 0
          sem_capa = 0
          conflitos = 0

          for arq in sorted(OUTRO_DIR.rglob("*.html")):
              if ".git" in arq.parts:
                  continue
              total += 1
              try:
                  texto = arq.read_text(encoding="utf-8", errors="ignore")
              except Exception:
                  continue

              video, capa = extract(texto)
              if not video:
                  sem_video += 1
                  continue
              com_video += 1

              if not is_valid_cover(capa):
                  sem_capa += 1
                  continue
              com_capa += 1

              vk = norm_video(video)
              if not vk:
                  continue

              if vk in mapa_key and mapa_key[vk] != capa:
                  conflitos += 1
                  continue

              mapa_key[vk] = capa
              mapa_url[video] = capa
              origem[vk] = arq.name

          linhas_key = ["video_key" + TAB + "capa_url" + TAB + "arquivo_origem"]
          for k in sorted(mapa_key.keys()):
              linhas_key.append(k + TAB + mapa_key[k] + TAB + origem.get(k, ""))
          Path("capas_por_key.txt").write_text(NL.join(linhas_key), encoding="utf-8")

          linhas_url = ["video_url" + TAB + "capa_url"]
          for k in sorted(mapa_url.keys()):
              linhas_url.append(k + TAB + mapa_url[k])
          Path("capas_por_url.txt").write_text(NL.join(linhas_url), encoding="utf-8")

          resumo_linhas = [
              "Resumo da extracao",
              "==================",
              "Repo: " + str(OUTRO_DIR),
              "HTMLs varridos: " + str(total),
              "Com video URL:  " + str(com_video),
              "Com capa:       " + str(com_capa),
              "Sem capa:       " + str(sem_capa),
              "Sem video URL:  " + str(sem_video),
              "Conflitos:      " + str(conflitos),
              "",
              "capas_por_key.txt: " + str(len(mapa_key)) + " entradas",
              "capas_por_url.txt: " + str(len(mapa_url)) + " entradas",
          ]
          resumo = NL.join(resumo_linhas) + NL
          Path("capas_resumo.txt").write_text(resumo, encoding="utf-8")
          print(resumo)

          print("=== Amostra capas_por_key ===")
          for k in list(sorted(mapa_key.keys()))[:10]:
              print(k[:50] + "  ->  " + mapa_key[k][:70])
          PYEOF

      - name: Mostrar resultado
        run: |
          echo "=== capas_resumo.txt ==="
          cat capas_resumo.txt
          echo ""
          echo "=== capas_por_key.txt (head) ==="
          head -11 capas_por_key.txt

      - name: Commitar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add capas_por_key.txt capas_por_url.txt capas_resumo.txt
          if git diff --cached --quiet; then
            echo "Nada novo."
            exit 0
          fi
          git commit -m "chore: capas extraidas do catalogocompleto2 [skip ci]"
          git push

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capas-extraidas
          if-no-files-found: ignore
          path: |
            capas_por_key.txt
            capas_por_url.txt
            capas_resumo.txt
          retention-days: 30
