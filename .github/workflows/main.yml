name: Aplicar Capas via capas_por_url.txt

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Aplicar capas nos HTMLs com placeholder
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python3 -u << 'PYEOF'
          import re
          from pathlib import Path

          PLACEHOLDER = "https://via.placeholder.com/500x750?text=Sem+Capa"
          MAPA_FILE   = Path("capas_por_url.txt")
          SEM_FILE    = Path("nao_encontrados.txt")

          def clean_url(u):
              """Limpa URL: remove \n \r \t \\n \\r \\t , espaços, trailing slash, lowercase."""
              if not u: return ""
              # remove escaped sequences primeiro
              u = u.replace('\\n', '').replace('\\r', '').replace('\\t', '')
              # remove whitespace real, vírgulas soltas (lixo da extração)
              u = re.sub(r'[\s,]+', '', u)
              # lowercase + remove trailing slash
              return u.lower().rstrip('/')

          def norm_protocol(u):
              """Remove http:// ou https:// pra comparar independente de protocolo."""
              return re.sub(r'^https?://', '', u)

          # ---------- 1) carrega o mapa ----------
          if not MAPA_FILE.exists():
              print(f"::error::Arquivo {MAPA_FILE} nao encontrado. Rode o workflow de extração primeiro.")
              raise SystemExit(1)

          print(f"Carregando {MAPA_FILE}...")
          mapa = {}          # url_sem_protocolo -> cover
          conflitos = 0

          linhas = MAPA_FILE.read_text(encoding='utf-8').splitlines()
          if not linhas:
              print("::error::Mapa vazio.")
              raise SystemExit(1)

          # detecta header
          start = 1 if 'video_url' in linhas[0].lower() else 0

          for line in linhas[start:]:
              if '\t' not in line: continue
              parts = line.split('\t', 1)
              if len(parts) != 2: continue
              url   = clean_url(parts[0])
              cover = parts[1].strip()

              # valida cover
              if not url or not cover: continue
              if len(cover) < 20: continue
              if not (cover.startswith('http://') or cover.startswith('https://')): continue
              if 'via.placeholder.com' in cover: continue
              if 'placehold.co' in cover: continue

              key = norm_protocol(url)
              if not key: continue

              if key in mapa and mapa[key] != cover:
                  conflitos += 1

              mapa[key] = cover

          print(f"Mapa carregado: {len(mapa)} URLs únicas ({conflitos} conflitos)")
          print(f"Exemplo: {list(mapa.keys())[:2]}")
          print()

          # ---------- 2) aplica nos HTMLs ----------
          total = alterados = ja_tinha = sem_contenturl = sem_match = 0
          sem_match_list = []

          for arq in sorted(Path('.').rglob('*.html')):
              if '.git' in arq.parts: continue
              total += 1
              try:
                  texto = arq.read_text(encoding='utf-8', errors='ignore')
              except Exception:
                  continue

              if PLACEHOLDER not in texto:
                  ja_tinha += 1
                  continue

              # extrai contentUrl (ou <video src>)
              m = re.search(r'"contentUrl"\s*:\s*"([^"]+)"', texto)
              if not m:
                  m = re.search(r'<video[^>]+src=["\']([^"\']+)["\']', texto)
              if not m:
                  sem_contenturl += 1
                  sem_match_list.append(f"{arq.name}\t(SEM_CONTENTURL)")
                  continue

              cu = clean_url(m.group(1))
              cu_key = norm_protocol(cu)

              cover = mapa.get(cu_key)
              if not cover:
                  sem_match += 1
                  sem_match_list.append(f"{arq.name}\t{cu}")
                  continue

              novo = texto.replace(PLACEHOLDER, cover)
              if novo != texto:
                  arq.write_text(novo, encoding='utf-8')
                  alterados += 1
                  print(f"[ok] {arq.name}")

          # ---------- 3) relatório ----------
          print()
          print("=" * 60)
          print(f"Total HTMLs:              {total}")
          print(f"Já tinham capa:           {ja_tinha}")
          print(f"Com placeholder:          {total - ja_tinha}")
          print(f"Alterados (aplicados):    {alterados}")
          print(f"Sem contentUrl:           {sem_contenturl}")
          print(f"Sem match no mapa:        {sem_match}")
          print("=" * 60)

          if sem_match_list:
              SEM_FILE.write_text('\n'.join(sem_match_list), encoding='utf-8')
              print(f"Lista de não encontrados → {SEM_FILE}")

          # taxa de sucesso
          alvo = total - ja_tinha
          if alvo > 0:
              pct = 100.0 * alterados / alvo
              print(f"Taxa de sucesso: {pct:.1f}%")
          PYEOF

      - name: Mostrar resumo
        run: |
          echo "=== Amostra do mapa ==="
          head -3 capas_por_url.txt
          echo ""
          echo "=== Não encontrados (primeiros 20) ==="
          head -20 nao_encontrados.txt 2>/dev/null || echo "(vazio — todos os HTMLs foram cobertos)"

      - name: Upload artefato de não-encontrados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nao-encontrados
          if-no-files-found: ignore
          path: nao_encontrados.txt
          retention-days: 30

      - name: Commitar capas aplicadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "*.html" nao_encontrados.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nada novo pra commitar."
            exit 0
          fi
          git commit -m "Auto: capas aplicadas via match de URL completa [skip ci]"
          git push
