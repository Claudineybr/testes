name: Aplicar Capas (por URL de vídeo)

on:
  schedule:
    - cron: '0,30 * * * *'
  workflow_dispatch:
    inputs:
      lote:
        description: 'URLs para visitar por run (só as que o feed não resolveu)'
        default: '200'
      retry_all:
        description: 'Reprocessar tudo (limpa mapa)?'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: capas-sem-capa
  cancel-in-progress: false

jobs:
  extrair:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Aplicar capas por URL de vídeo
        env:
          LOTE: ${{ inputs.lote || '200' }}
          RETRY_ALL: ${{ inputs.retry_all || 'false' }}
          PYTHONUNBUFFERED: '1'
        run: |
          cat > /tmp/capas.py << 'PYEOF'
          import re, json, requests, sys, os, time
          from pathlib import Path
          from bs4 import BeautifulSoup

          BASE_URL    = "https://www.vini7xgrave.site"
          HEADERS     = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"}
          PLACEHOLDER = "https://via.placeholder.com/500x750?text=Sem+Capa"
          LOTE        = int(os.environ.get("LOTE") or "200")
          RETRY_ALL   = os.environ.get("RETRY_ALL", "false").lower() == "true"

          ARQ_MAPA    = Path("capas_mapa.json")
          ARQ_STATUS  = Path("capas_status.json")
          ARQ_FEED_CT = Path("capas_feed_cache.json")

          START_TS = time.time()
          def log(*a):
              e = int(time.time() - START_TS)
              print(f"[+{e:>4}s]", *a, flush=True); sys.stdout.flush()

          # ---------- validadores / normalizadores ----------
          def is_valid_cover(url):
              if not url or not isinstance(url, str): return False
              url = url.strip()
              if len(url) < 15: return False
              if not (url.startswith('http://') or url.startswith('https://')): return False
              if 'via.placeholder.com' in url: return False
              if 'placehold.co' in url: return False
              return True

          def norm_video(url):
              """Extrai chave única do vídeo: prefere IMDb ID, senão filename."""
              if not url: return ""
              m = re.search(r'(tt\d{6,10})', url.lower())
              if m: return m.group(1) + ".mp4"
              u = url.split('?')[0].split('#')[0].rstrip('/')
              return u.split('/')[-1].lower()

          def extrair_video_e_capa(html):
              """Extrai (videoUrl, capaUrl) de um HTML — prioriza JSON-LD."""
              video = capa = None
              for pat in [
                  r'"contentUrl"\s*:\s*"([^"]+)"',
                  r'<video[^>]+src=["\']([^"\']+)["\']',
                  r'<iframe[^>]+src=["\']([^"\']+\.(?:mp4|m3u8)[^"\']*)["\']',
              ]:
                  m = re.search(pat, html, re.I)
                  if m: video = m.group(1); break

              for pat in [
                  r'"thumbnailUrl"\s*:\s*(?:\[\s*)?"(https?://[^"]+)"',
                  r'<meta[^>]*property=["\']og:image["\'][^>]*content=["\'](https?://[^"\']+)["\']',
                  r'<video[^>]+poster=["\'](https?://[^"\']+)["\']',
              ]:
                  m = re.search(pat, html, re.I)
                  if m and is_valid_cover(m.group(1)):
                      capa = m.group(1); break
              return video, capa

          # ============================================================
          # 1) Arquivos locais SEM capa → {videoUrl_norm: {url, arquivos}}
          # ============================================================
          def listar_sem_capa():
              log("Listando arquivos locais SEM capa...")
              sem_capa = {}
              sem_url = []
              total = 0
              for arq in sorted(Path('.').rglob('*.html')):
                  if '.git' in arq.parts: continue
                  try: texto = arq.read_text(encoding='utf-8', errors='ignore')
                  except: continue
                  if PLACEHOLDER not in texto: continue
                  total += 1

                  m = re.search(r'"contentUrl"\s*:\s*"([^"]+)"', texto)
                  if not m:
                      m = re.search(r'<video[^>]+src=["\']([^"\']+)["\']', texto)

                  if m:
                      url_orig = m.group(1).strip()
                      vk = norm_video(url_orig)
                      if vk:
                          if vk not in sem_capa:
                              sem_capa[vk] = {'url': url_orig, 'arquivos': []}
                          sem_capa[vk]['arquivos'].append(arq)
                      else:
                          sem_url.append(arq.name)
                  else:
                      sem_url.append(arq.name)

              log(f"  Arquivos sem capa: {total} | URLs únicas: {len(sem_capa)} | sem contentUrl: {len(sem_url)}")
              return sem_capa, sem_url

          # ============================================================
          # 2) Feed do Blogger → {videoUrl_norm: capa} (só os que importam)
          # ============================================================
          def processar_feed(sem_capa_urls):
              log("Processando feed do Blogger (extraindo contentUrl de cada entry)...")
              feed_map = {}       # vk → capa (resolvido direto do feed)
              para_visitar = {}   # vk → link (feed não trouxe capa)
              page, entries_total, seen = 0, 0, 0

              # cache de 2h para não re-baixar em runs seguidas
              if ARQ_FEED_CT.exists():
                  try:
                      cached = json.loads(ARQ_FEED_CT.read_text(encoding='utf-8'))
                      if time.time() - cached.get('ts', 0) < 7200:
                          feed_map = {k: v for k, v in cached.get('feed_map', {}).items() if k in sem_capa_urls}
                          para_visitar = {k: v for k, v in cached.get('para_visitar', {}).items() if k in sem_capa_urls}
                          log(f"  cache do feed ({(time.time()-cached['ts'])/60:.0f}min): feed_map={len(feed_map)} para_visitar={len(para_visitar)}")
                          return feed_map, para_visitar
                  except: pass

              start = 1
              while True:
                  try:
                      u = f"{BASE_URL}/feeds/posts/default?alt=json&max-results=150&start-index={start}"
                      r = requests.get(u, headers=HEADERS, timeout=30)
                      if r.status_code != 200: break
                      entries = r.json().get("feed", {}).get("entry", [])
                      if not entries: break
                      entries_total += len(entries)

                      for e in entries:
                          seen += 1
                          link = next((l["href"] for l in e.get("link", []) if l.get("rel") == "alternate"), None)
                          if not link: continue
                          link = link.split("?")[0]

                          content_html = (e.get("content") or {}).get("$t", "")
                          if not content_html: continue

                          video, capa = extrair_video_e_capa(content_html)
                          if not video: continue

                          vk = norm_video(video)
                          if vk not in sem_capa_urls: continue  # não interessa

                          if is_valid_cover(capa):
                              feed_map[vk] = capa
                          elif vk not in feed_map and vk not in para_visitar:
                              para_visitar[vk] = link

                      page += 1
                      log(f"  page {page}: {len(entries)} entries | feed_map={len(feed_map)} para_visitar={len(para_visitar)}")
                      if len(entries) < 150: break
                      start += 150
                  except Exception as e:
                      log(f"  erro feed: {e}"); break

              log(f"  Feed: {entries_total} entries | feed_map={len(feed_map)} | para_visitar={len(para_visitar)}")

              ARQ_FEED_CT.write_text(json.dumps({
                  'ts': time.time(),
                  'feed_map': feed_map,
                  'para_visitar': para_visitar,
              }, ensure_ascii=False), encoding='utf-8')

              return feed_map, para_visitar

          # ============================================================
          # 3) Visita páginas que o feed não resolveu (checando por videoUrl)
          # ============================================================
          def visitar_pendentes(para_visitar, sem_capa_urls, mapa):
              fila = {k: v for k, v in para_visitar.items() if k not in mapa}
              if not fila:
                  log("\nNada para visitar (feed resolveu tudo).")
                  return 0

              log(f"\nVisitando até {min(len(fila), LOTE)} de {len(fila)} páginas pendentes...")
              sucesso = 0
              for i, (vk, link) in enumerate(list(fila.items())[:LOTE], 1):
                  log(f"  [{i}/{min(len(fila), LOTE)}] {vk[:40]} <- {link}")
                  try:
                      r = requests.get(link, headers=HEADERS, timeout=20)
                      if r.status_code != 200:
                          log(f"    HTTP {r.status_code}"); continue

                      video, capa = extrair_video_e_capa(r.text)

                      # CONFERE: videoUrl da página deve bater com o esperado
                      if video and norm_video(video) != vk:
                          log(f"    videoUrl da página não bate ({norm_video(video)[:30]}), pulando")
                          continue

                      if not is_valid_cover(capa):
                          soup = BeautifulSoup(r.text, 'html.parser')
                          og = soup.find('meta', property='og:image')
                          if og and is_valid_cover(og.get('content')):
                              capa = og.get('content')

                      if is_valid_cover(capa):
                          mapa[vk] = capa
                          sucesso += 1
                          log(f"    +capa {capa[:70]}")
                      else:
                          log(f"    sem capa encontrada")
                  except Exception as e:
                      log(f"    erro: {e}")

              log(f"  Visitadas: {sucesso} sucesso de {min(len(fila), LOTE)}")
              return sucesso

          # ============================================================
          # 4) Aplica mapa por videoUrl (só em arquivos com placeholder)
          # ============================================================
          def aplicar_mapa(sem_capa_urls, mapa):
              log(f"\nAplicando {len(mapa)} capas por URL de vídeo...")
              alterados = 0
              sem_match = 0

              for vk, info in sem_capa_urls.items():
                  if vk not in mapa:
                      sem_match += 1
                      continue
                  capa = mapa[vk]
                  if not is_valid_cover(capa):
                      sem_match += 1; continue

                  for arq in info['arquivos']:
                      try: texto = arq.read_text(encoding='utf-8', errors='ignore')
                      except: continue
                      if PLACEHOLDER not in texto: continue

                      novo = texto.replace(PLACEHOLDER, capa)
                      if novo != texto:
                          arq.write_text(novo, encoding='utf-8')
                          alterados += 1
                          log(f"  [ok] {arq.name}")

              log(f"  Aplicados: {alterados} arquivos | Sem match: {sem_match} URLs")
              return alterados, sem_match

          # ============================================================
          # MAIN
          # ============================================================
          def main():
              # 1) lista sem capa
              sem_capa_urls, sem_url = listar_sem_capa()
              if not sem_capa_urls:
                  log("✅ Nenhum arquivo com URL de vídeo sem capa. Nada a fazer.")
                  ARQ_STATUS.write_text(json.dumps({
                      'total_sem_capa_urls': 0, 'sem_url_video': len(sem_url),
                      'mapa_size': 0, 'done': True
                  }, ensure_ascii=False, indent=2), encoding='utf-8')
                  return

              # 2) carrega mapa existente (filtrado)
              mapa = {}
              if ARQ_MAPA.exists() and not RETRY_ALL:
                  try:
                      raw = json.loads(ARQ_MAPA.read_text(encoding='utf-8'))
                      mapa = {k: v for k, v in raw.items()
                              if k in sem_capa_urls and is_valid_cover(v)}
                      log(f"Mapa existente (filtrado): {len(mapa)}")
                  except: mapa = {}
              elif RETRY_ALL:
                  log("RETRY_ALL=true: limpando mapa e cache do feed")

              # 3) feed → resolve os que têm contentUrl no feed
              feed_map, para_visitar = processar_feed(sem_capa_urls)
              novos_feed = 0
              for k, v in feed_map.items():
                  if k not in mapa:
                      mapa[k] = v
                      novos_feed += 1
              log(f"Feed adicionou {novos_feed} capas novas ao mapa")

              # 4) visita pendentes (lote limitado)
              visitados_ok = visitar_pendentes(para_visitar, sem_capa_urls, mapa)

              # 5) salva mapa
              ARQ_MAPA.write_text(json.dumps(mapa, ensure_ascii=False, indent=2), encoding='utf-8')

              # 6) aplica
              alterados, sem_match = aplicar_mapa(sem_capa_urls, mapa)

              # 7) status
              faltam_visitar = max(0, len(para_visitar) - visitados_ok)
              done = (faltam_visitar == 0 and novos_feed == 0 and visitados_ok == 0
                      and alterados == 0 and sem_match == 0)

              ARQ_STATUS.write_text(json.dumps({
                  'total_sem_capa_urls': len(sem_capa_urls),
                  'sem_url_video': len(sem_url),
                  'mapa_size': len(mapa),
                  'novos_feed': novos_feed,
                  'novos_visitados': visitados_ok,
                  'faltam_visitar': faltam_visitar,
                  'alterados': alterados,
                  'sem_match': sem_match,
                  'done': done,
              }, ensure_ascii=False, indent=2), encoding='utf-8')

              log(f"\n📊 FINAL: sem_capa={len(sem_capa_urls)} | mapa={len(mapa)} | "
                  f"novos_feed={novos_feed} | visitados={visitados_ok} | "
                  f"alterados={alterados} | sem_match={sem_match} | done={done}")

          if __name__ == "__main__":
              main()
          PYEOF
          python3 /tmp/capas.py

      - name: Salvar progresso
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f capas_mapa.json capas_status.json capas_feed_cache.json 2>/dev/null || true
          git add -f *.html 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nada novo."; exit 0; fi
          git commit -m "chore: capas por URL de vídeo [skip ci]"

          for i in $(seq 1 5); do
            if git push origin HEAD:main; then break; fi
            git fetch origin main
            git reset --mixed origin/main
            git add -f capas_mapa.json capas_status.json capas_feed_cache.json 2>/dev/null || true
            git add -f *.html 2>/dev/null || true
            git commit -m "chore: retry $i" || true
            sleep $((RANDOM % 10 + 5))
          done

      - name: Disparar próxima run (se necessário)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.PAT_CHAIN }}
          REPO: ${{ github.repository }}
        run: |
          DONE=$(python3 -c "import json; print(json.load(open('capas_status.json')).get('done', False))" 2>/dev/null || echo False)
          FALTAM=$(python3 -c "import json; print(json.load(open('capas_status.json')).get('faltam_visitar', 0))" 2>/dev/null || echo 0)
          MAPA=$(python3 -c "import json; print(json.load(open('capas_status.json')).get('mapa_size', 0))" 2>/dev/null || echo 0)
          SEM=$(python3 -c "import json; print(json.load(open('capas_status.json')).get('total_sem_capa_urls', 0))" 2>/dev/null || echo 0)

          echo "📊 Sem capa: $SEM | Mapa: $MAPA | Faltam visitar: $FALTAM | Done: $DONE"

          if [ "$DONE" = "True" ]; then
            echo "✅ Concluído. Chain encerrada."; exit 0
          fi

          LIMITE_ISO=$(date -u -d '60 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          RECENTES=$(gh run list --workflow="scrape.yml" --limit 100 --json event,createdAt --jq "[.[] | select(.event == \"workflow_dispatch\") | select(.createdAt > \"$LIMITE_ISO\")] | length" --repo "$REPO" 2>/dev/null || echo 0)

          if [ "$RECENTES" -ge 30 ]; then
            echo "⚠️ Limite de 30 runs/hora atingido. Aguardando cron."; exit 0
          fi

          echo "⏳ Aguardando 30s antes de disparar próxima run..."
          sleep 30
          gh workflow run "scrape.yml" --repo "$REPO" --ref main
