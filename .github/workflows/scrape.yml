      - name: Raspar site (BFS) e aplicar capas
        env:
          APPLY: ${{ inputs.apply_changes }}
          MAX_PAGES: ${{ inputs.max_pages }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 -u << 'PYEOF'
          import os, re, json, time, urllib.parse, sys
          from pathlib import Path
          from collections import deque
          from playwright.sync_api import sync_playwright

          # ============ LOG UNIFICADO ============
          START_TS = time.time()
          def log(msg, level="info"):
              elapsed = int(time.time() - START_TS)
              ts = time.strftime("%H:%M:%S", time.gmtime())
              prefix = f"[{ts} +{elapsed:>4}s]"
              line = f"{prefix} {msg}"
              print(line, flush=True)
              sys.stdout.flush()

          def gh_notice(msg): print(f"::notice::{msg}", flush=True)
          def gh_warning(msg): print(f"::warning::{msg}", flush=True)
          def gh_error(msg): print(f"::error::{msg}", flush=True)
          def gh_group(name): print(f"::group::{name}", flush=True)
          def gh_endgroup(): print("::endgroup::", flush=True)

          SITE         = "https://www.vini7xgrave.site"
          PLACEHOLDER  = "https://via.placeholder.com/500x750?text=Sem+Capa"
          USER_AGENT   = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          MAX_PAGES    = int(os.environ.get("MAX_PAGES") or "200")
          APPLY        = os.environ.get("APPLY", "true").lower() == "true"

          DATA_FILE   = Path('.scrape_data.json')
          SEEN_FILE   = Path('.scrape_seen.json')
          SKIP_FILE   = Path('.scrape_skip.json')
          STATUS_FILE = Path('.scrape_status.json')

          gh_group("📦 Carregando estado anterior")
          video_map, title_map = {}, {}
          seen_urls, skip_urls = set(), set()
          if DATA_FILE.exists():
              try:
                  d = json.loads(DATA_FILE.read_text(encoding='utf-8'))
                  video_map = d.get('video_map', {})
                  title_map = d.get('title_map', {})
                  log(f"Estado carregado: video={len(video_map)} title={len(title_map)}")
              except Exception as e: log(f"Erro ao ler data: {e}", "warn")
          if SEEN_FILE.exists():
              try: seen_urls = set(json.loads(SEEN_FILE.read_text(encoding='utf-8')))
              except: pass
          if SKIP_FILE.exists():
              try: skip_urls = set(json.loads(SKIP_FILE.read_text(encoding='utf-8')))
              except: pass
          log(f"Vistos={len(seen_urls)} | Skip={len(skip_urls)}")
          gh_endgroup()

          def save_all():
              DATA_FILE.write_text(json.dumps({'video_map': video_map, 'title_map': title_map}, ensure_ascii=False, indent=2), encoding='utf-8')
              SEEN_FILE.write_text(json.dumps(list(seen_urls), ensure_ascii=False), encoding='utf-8')
              SKIP_FILE.write_text(json.dumps(list(skip_urls), ensure_ascii=False), encoding='utf-8')

          def save_status(queue_remaining, visited):
              STATUS_FILE.write_text(json.dumps({
                  'queue_remaining': queue_remaining,
                  'visited': visited,
                  'max_pages': MAX_PAGES,
                  'video_map': len(video_map),
                  'title_map': len(title_map),
                  'timestamp': int(time.time()),
              }, ensure_ascii=False, indent=2), encoding='utf-8')

          def norm_video(url):
              if not url: return ""
              m = re.search(r'(tt\d{6,10})', url.lower())
              if m: return m.group(1) + ".mp4"
              u = url.split('?')[0].split('#')[0].rstrip('/')
              return u.split('/')[-1].lower()

          def norm_title(t):
              if not t: return ""
              t = t.lower().strip()
              t = re.sub(r'^(assistir|ver|onde assistir|onde ver)\s+', '', t)
              t = re.sub(r'\s*[-–|]\s*[\w\s]*clau[\w\s]*$', '', t, flags=re.I)
              t = re.sub(r'\s*[-–|]\s*[\w\s]*vini7xgrave[\w\s]*$', '', t, flags=re.I)
              t = re.sub(r'\s*[-–]\s*t\d+e\d+.*$', '', t, flags=re.I)
              t = re.sub(r'\(\d+\)', '', t)
              t = re.sub(r'\b(19|20)\d{2}\b', '', t)
              t = re.sub(r'\b(online|dublado|legendado|hdcam|completo|filme|serie|t\d+e\d+)\b', '', t, flags=re.I)
              t = re.sub(r'[^\w\s]', ' ', t)
              return re.sub(r'\s+', ' ', t).strip()

          def add_pair(video, cover, title=None):
              if cover:
                  cover = cover.strip()
                  if cover.startswith('//'): cover = 'https:' + cover
                  if video:
                      vk = norm_video(video)
                      if vk and vk not in video_map:
                          video_map[vk] = cover
                          log(f"  +video({len(video_map)}) {vk[:60]} ← {cover[:80]}")
                  if title:
                      tk = norm_title(title)
                      if tk and tk not in title_map:
                          title_map[tk] = cover
                          log(f"  +title({len(title_map)}) {tk[:50]} ← {cover[:80]}")

          def is_internal(u):
              return 'vini7xgrave.site' in u.lower()

          def should_skip(u):
              u_l = u.lower()
              return any(x in u_l for x in (
                  '#','mailto:','javascript:','.css','.js','.png','.jpg','.jpeg','.webp','.svg','.ico',
                  'wp-login','wp-admin','/dmca','/contato','/privacidade','/sobre','/termos',
                  'facebook.com','instagram.com','twitter.com','youtube.com','t.me','whatsapp',
                  '/feed','/rss','/sitemap','/amp/'
              ))

          def walk_json(obj, depth=0):
              if depth > 8: return
              if isinstance(obj, dict):
                  video = cover = title = None
                  for k in ('contentUrl','content_url','video_url','videoUrl','video','file','src','stream_url','stream','link_play','play_url'):
                      v = obj.get(k)
                      if isinstance(v, str) and any(x in v.lower() for x in ('.mp4','.m3u8','.ts','/hls/','/vod/','stream','embed')):
                          video = v; break
                  for k in ('thumbnailUrl','thumbnail_url','poster','poster_path','cover','image','img','thumbnail','capa','imagem','thumb'):
                      v = obj.get(k)
                      if isinstance(v, list) and v and isinstance(v[0], str): cover = v[0]; break
                      if isinstance(v, str) and (v.startswith('http') or v.startswith('//')): cover = v; break
                  for k in ('name','title','titulo','nome'):
                      v = obj.get(k)
                      if isinstance(v, str) and v: title = v; break
                  if cover: add_pair(video, cover, title)
                  for v in obj.values(): walk_json(v, depth+1)
              elif isinstance(obj, list):
                  for x in obj: walk_json(x, depth+1)

          def walk_html(html):
              video = cover = title = None
              for pat in [r'"contentUrl"\s*:\s*"([^"]+)"',
                          r'<video[^>]+src=["\']([^"\']+)["\']',
                          r'<iframe[^>]+src=["\']([^"\']+\.(?:mp4|m3u8)[^"\']*)["\']']:
                  m = re.search(pat, html, re.I)
                  if m: video = m.group(1); break
              for pat in [r'"thumbnailUrl"\s*:\s*(?:\[\s*)?"([^"]+)"',
                          r'<meta[^>]*property=["\']og:image["\'][^>]*content=["\']([^"\']+)["\']',
                          r'<video[^>]+poster=["\']([^"\']+)["\']']:
                  m = re.search(pat, html, re.I)
                  if m: cover = m.group(1); break
              m = re.search(r'<title>([^<]+)</title>', html, re.I)
              if m: title = m.group(1)
              if cover: add_pair(video, cover, title)

          start_urls = [SITE + '/']
          skip_urls -= set(start_urls)

          visited = 0
          added_urls = 0
          queue = deque(start_urls)
          seen_urls.update(start_urls)

          gh_group("🌐 Iniciando Playwright")
          with sync_playwright() as p:
              browser = p.chromium.launch(
                  headless=True,
                  args=['--no-sandbox','--disable-blink-features=AutomationControlled','--disable-dev-shm-usage']
              )
              ctx = browser.new_context(
                  user_agent=USER_AGENT,
                  viewport={'width': 1920, 'height': 1080},
                  locale='pt-BR',
              )
              page = ctx.new_page()
              log("Browser iniciado")

              def on_response(resp):
                  try:
                      ct = (resp.headers.get('content-type') or '').lower()
                      if 'json' in ct:
                          try: walk_json(resp.json())
                          except: pass
                      elif 'html' in ct:
                          try: walk_html(resp.text())
                          except: pass
                  except: pass
              page.on('response', on_response)
          gh_endgroup()

          gh_group(f"🕷️ BFS — alvo: {MAX_PAGES} páginas")
          while queue and visited < MAX_PAGES:
              url = queue.popleft()
              if url in skip_urls:
                  continue

              is_first = (visited == 0)
              t0 = time.time()
              log(f"[{visited+1}/{MAX_PAGES}] GET {url}")
              try:
                  if is_first:
                      log(f"  → networkidle + 5s (SPA hydrate)")
                      resp = page.goto(url, wait_until='networkidle', timeout=90000)
                      page.wait_for_timeout(5000)
                  else:
                      try:
                          resp = page.goto(url, wait_until='load', timeout=30000)
                      except:
                          resp = page.goto(url, wait_until='domcontentloaded', timeout=20000)
                      page.wait_for_timeout(2000)

                  if resp and resp.status in (404, 410):
                      skip_urls.add(url)
                      log(f"  → HTTP {resp.status}, skip permanente")
                      continue
                  if resp and resp.status >= 400:
                      log(f"  → HTTP {resp.status}, soft-fail (retry próximo run)")
                      continue

                  try:
                      page.wait_for_selector('a[href]', timeout=8000)
                  except:
                      log(f"  → timeout em a[href], seguindo mesmo assim")

                  try:
                      for _ in range(3):
                          btn = page.query_selector('button:has-text("Carregar mais"), button:has-text("Ver mais"), button:has-text("Load more"), .load-more, [class*="load-more"]')
                          if btn:
                              btn.click(timeout=2000)
                              page.wait_for_timeout(1200)
                              log(f"  → clicou 'load more'")
                          else: break
                  except: pass

                  try:
                      for _ in range(3):
                          page.evaluate('window.scrollTo(0, document.body.scrollHeight)')
                          page.wait_for_timeout(800)
                  except: pass

                  links = page.evaluate('''() => {
                      const cards = [];
                      const seen = new WeakSet();
                      const sel = ['article','.card','.item','.post','.movie','.film','.serie',
                                   '[class*="card"]','[class*="movie"]','[class*="serie"]',
                                   '[class*="film"]','[class*="post"]','[class*="item"]','[class*="entry"]'];
                      for (const s of sel) {
                          document.querySelectorAll(s).forEach(el => {
                              if (seen.has(el)) return; seen.add(el);
                              const img = el.querySelector('img[src],img[data-src],img[data-lazy-src],img[data-original]');
                              const a = el.querySelector('a[href]');
                              const tEl = el.querySelector('h1,h2,h3,.title,[class*="title"],[class*="name"]');
                              let poster = img ? (img.src || img.dataset.src || img.dataset.lazySrc || img.dataset.original) : null;
                              if (!poster) {
                                  const bg = el.querySelector('[style*="background-image"]');
                                  if (bg) { const m = bg.style.backgroundImage.match(/url\\(["']?(.+?)["']?\\)/); if (m) poster = m[1]; }
                              }
                              let title = tEl ? tEl.textContent.trim() : (img ? img.alt : null);
                              if (poster && title) cards.push({poster, title, href: a ? a.href : null});
                          });
                      }
                      const links = [...document.querySelectorAll('a[href]')].map(a => a.href);
                      return {cards, links};
                  }''')
                  for c in links.get('cards', []):
                      add_pair(None, c.get('poster'), c.get('title'))
                  all_links = links.get('links', [])

                  internal_new = [l for l in all_links if is_internal(l) and not should_skip(l) and l not in seen_urls and l not in skip_urls]
                  visited += 1
                  dt = time.time() - t0
                  log(f"  ✓ links={len(all_links)} novos={len(internal_new)} tempo={dt:.1f}s | video={len(video_map)} title={len(title_map)}")

                  if is_first:
                      Path('homepage_debug.html').write_text(page.content(), encoding='utf-8')
                      try: page.screenshot(path='homepage_debug.png', full_page=False)
                      except: pass
                      log(f"  → amostra: {internal_new[:5]}")

                  for link in internal_new:
                      seen_urls.add(link)
                      queue.append(link)
                      added_urls += 1

                  if visited % 5 == 0:
                      save_all(); save_status(len(queue), visited)
                      log(f"  💾 checkpoint salvo (visited={visited}, queue={len(queue)})")

              except Exception as e:
                  log(f"  ✗ ERRO: {str(e)[:150]}")
                  continue

              browser_close_ready = False

          gh_endgroup()
          browser.close()
          queue_remaining = len(queue)

          abort_reason = None
          if visited <= 1 and added_urls == 0:
              abort_reason = "homepage_loaded_but_zero_links"
              gh_error(f"ABORTANDO: {abort_reason}. Home não gerou links. Veja homepage_debug.png/html.")
              queue_remaining = 0
          elif visited <= 2:
              gh_warning(f"visited={visited} muito baixo, limpando skip p/ próxima")
              skip_urls.clear()
              queue_remaining = max(queue_remaining, 1)

          save_all()
          save_status(queue_remaining, visited)

          gh_group("📊 Resumo da raspagem")
          log(f"Visited: {visited} | Novos links: {added_urls} | Queue restante: {queue_remaining}")
          log(f"video_map={len(video_map)} | title_map={len(title_map)} | skip={len(skip_urls)}")
          gh_endgroup()

          if not APPLY:
              log("APPLY=false — pulando aplicação.")
              raise SystemExit(0)

          gh_group("🎨 Aplicando capas nos HTMLs")
          total = alterados = via_video = via_title = via_filename = sem_match = 0
          sem_match_list = []
          last_log = time.time()

          for arq in sorted(Path('.').rglob('*.html')):
              if '.git' in arq.parts: continue
              total += 1
              try: texto = arq.read_text(encoding='utf-8', errors='ignore')
              except: continue
              if PLACEHOLDER not in texto: continue

              cu = re.search(r'"contentUrl"\s*:\s*"([^"]+)"', texto)
              cover = None; source = None

              if cu:
                  cover = video_map.get(norm_video(cu.group(1)))
                  if cover: source = "video"

              if not cover:
                  nm = re.search(r'"name"\s*:\s*"([^"]+)"', texto)
                  if nm:
                      cover = title_map.get(norm_title(nm.group(1)))
                      if cover: source = "title"

              if not cover:
                  cover = title_map.get(norm_title(arq.stem))
                  if cover: source = "filename"

              if not cover:
                  sem_match += 1
                  sem_match_list.append(arq.name)
                  continue

              novo = texto.replace(PLACEHOLDER, cover)
              if novo != texto:
                  arq.write_text(novo, encoding='utf-8')
                  alterados += 1
                  if source == "video": via_video += 1
                  elif source == "title": via_title += 1
                  else: via_filename += 1

              if time.time() - last_log > 5:
                  log(f"  progresso: {alterados} aplicadas ({via_video}v/{via_title}t/{via_filename}f) | {sem_match} sem match | {total} arquivos")
                  last_log = time.time()

          Path('.scrape_sem_match.txt').write_text('\n'.join(sem_match_list), encoding='utf-8')

          log(f"Total HTMLs: {total}")
          log(f"Alterados: {alterados} (video={via_video}, title={via_title}, filename={via_filename})")
          log(f"Sem match: {sem_match}")
          gh_endgroup()

          if abort_reason:
              gh_error(f"Run terminou mas abortou por: {abort_reason}")
              raise SystemExit(1)
          PYEOF
