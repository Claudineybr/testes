name: Aplicar Capas do Site (Feed Blogger)

on:
  workflow_dispatch:
    inputs:
      apply_changes:
        description: 'Aplicar capas aos HTMLs?'
        type: boolean
        default: true
      max_pages:
        description: 'Máx. de páginas a visitar por run'
        type: string
        default: '200'
      refresh_feed:
        description: 'Rebaixar feed do Blogger? (deixe false após o 1º run)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scrape-chain
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      WORKFLOW_FILE: scrape.yml

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          pip install playwright requests
          playwright install chromium
          playwright install-deps chromium

      # ============================================================
      # STEP 0: sanitiza HTMLs já corrompidos + limpa cache inválido
      # (roda sempre; custa segundos; idempotente)
      # ============================================================
      - name: Sanitizar HTMLs corrompidos e cache
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python3 -u << 'PYEOF'
          import re, json, sys
          from pathlib import Path

          PLACEHOLDER = "https://via.placeholder.com/500x750?text=Sem+Capa"
          DATA_FILE   = Path('.scrape_data.json')

          def is_valid_cover(url):
              if not url or not isinstance(url, str): return False
              url = url.strip()
              if len(url) < 15: return False
              if not (url.startswith('http://') or url.startswith('https://')): return False
              if 'via.placeholder.com' in url: return False
              if 'placehold.co' in url: return False
              return True

          # 1) filtra cache
          if DATA_FILE.exists():
              try:
                  d = json.loads(DATA_FILE.read_text(encoding='utf-8'))
                  v_old = d.get('video_map', {})
                  t_old = d.get('title_map', {})
                  v = {k: u for k, u in v_old.items() if is_valid_cover(u)}
                  t = {k: u for k, u in t_old.items() if is_valid_cover(u)}
                  d['video_map'] = v; d['title_map'] = t
                  DATA_FILE.write_text(json.dumps(d, ensure_ascii=False, indent=2), encoding='utf-8')
                  print(f"::notice::Cache: removidos {len(v_old)-len(v)} videos e {len(t_old)-len(t)} titulos invalidos (restam {len(v)}/{len(t)})", flush=True)
              except Exception as e:
                  print(f"::warning::Erro cache: {e}", flush=True)

          # 2) sanitiza HTMLs
          fixed = 0
          for arq in Path('.').rglob('*.html'):
              if '.git' in arq.parts: continue
              try: texto = arq.read_text(encoding='utf-8', errors='ignore')
              except: continue
              original = texto

              # poster="X" onde X não é URL -> placeholder
              texto = re.sub(
                  r'(<video[^>]+poster=["\'])(?!https?://|//)([^"\']*)(["\'])',
                  lambda m: m.group(1) + PLACEHOLDER + m.group(3),
                  texto
              )
              # "thumbnailUrl": ["X"] -> placeholder
              texto = re.sub(
                  r'("thumbnailUrl"\s*:\s*\[\s*")(?!https?://|//)([^"]*)(")',
                  lambda m: m.group(1) + PLACEHOLDER + m.group(3),
                  texto
              )
              # "thumbnailUrl": "X" -> placeholder
              texto = re.sub(
                  r'("thumbnailUrl"\s*:\s*")(?!https?://|//)([^"]*)(")',
                  lambda m: m.group(1) + PLACEHOLDER + m.group(3),
                  texto
              )

              if texto != original:
                  arq.write_text(texto, encoding='utf-8')
                  fixed += 1

          print(f"::notice::HTMLs sanitizados: {fixed}", flush=True)
          PYEOF

      # ============================================================
      # STEP 1: feed do Blogger -> TODAS as URLs do site
      # ============================================================
      - name: Descobrir URLs (feed do Blogger)
        env:
          REFRESH: ${{ inputs.refresh_feed }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 -u << 'PYEOF'
          import os, sys, time
          from pathlib import Path
          import requests

          BASE_URL  = "https://www.vini7xgrave.site"
          HEADERS   = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"}
          FEED_FILE = Path(".scrape_feed_urls.txt")
          REFRESH   = os.environ.get("REFRESH", "false").lower() == "true"

          if FEED_FILE.exists() and not REFRESH:
              urls = [l for l in FEED_FILE.read_text(encoding='utf-8').splitlines() if l.strip()]
              print(f"::notice::Feed existente: {len(urls)} URLs (refresh_feed=true para atualizar)", flush=True)
              sys.exit(0)

          print("Baixando feed do Blogger...", flush=True)
          urls, seen = [], set()
          start, page, t0 = 1, 0, time.time()
          while True:
              try:
                  u = f"{BASE_URL}/feeds/posts/default?alt=json&max-results=150&start-index={start}"
                  r = requests.get(u, headers=HEADERS, timeout=30)
                  if r.status_code != 200:
                      print(f"  page {page+1}: HTTP {r.status_code}, parando", flush=True); break
                  entries = r.json().get("feed", {}).get("entry", [])
                  if not entries:
                      print(f"  page {page+1}: vazio, parando", flush=True); break
                  for e in entries:
                      link = next((l["href"] for l in e.get("link", []) if l.get("rel") == "alternate"), None)
                      if link:
                          uu = link.split("?")[0].strip()
                          if uu and uu not in seen:
                              seen.add(uu); urls.append(uu)
                  page += 1
                  elapsed = int(time.time() - t0)
                  print(f"  page {page}: {len(entries)} entries (total {len(urls)}, +{elapsed}s)", flush=True)
                  if len(entries) < 150: break
                  start += 150
              except Exception as e:
                  print(f"  erro: {e}, parando", flush=True); break

          FEED_FILE.write_text("\n".join(urls), encoding='utf-8')
          print(f"::notice::Feed salvo: {len(urls)} URLs em {page} paginas", flush=True)
          PYEOF

      # ============================================================
      # STEP 2: visita lote + extrai pares (video -> capa)
      # STEP 3: aplica capas nos HTMLs locais
      # ============================================================
      - name: Raspar páginas e aplicar capas
        env:
          APPLY: ${{ inputs.apply_changes }}
          MAX_PAGES: ${{ inputs.max_pages }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 -u << 'PYEOF'
          import os, re, json, time, sys
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          START_TS = time.time()
          def log(m):
              e = int(time.time() - START_TS)
              t = time.strftime("%H:%M:%S", time.gmtime())
              print(f"[{t} +{e:>4}s] {m}", flush=True); sys.stdout.flush()
          def gh_error(m): print(f"::error::{m}", flush=True)
          def gh_group(m): print(f"::group::{m}", flush=True)
          def gh_endgroup(): print("::endgroup::", flush=True)

          BASE_URL    = "https://www.vini7xgrave.site"
          PLACEHOLDER = "https://via.placeholder.com/500x750?text=Sem+Capa"
          USER_AGENT  = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          MAX_PAGES   = int(os.environ.get("MAX_PAGES") or "200")
          APPLY       = os.environ.get("APPLY", "true").lower() == "true"

          FEED_FILE   = Path(".scrape_feed_urls.txt")
          DATA_FILE   = Path(".scrape_data.json")
          SEEN_FILE   = Path(".scrape_seen.json")
          SKIP_FILE   = Path(".scrape_skip.json")
          STATUS_FILE = Path(".scrape_status.json")

          # ---- validação de capa ----
          def is_valid_cover(url):
              if not url or not isinstance(url, str): return False
              url = url.strip()
              if len(url) < 15: return False
              if not (url.startswith('http://') or url.startswith('https://')): return False
              if 'via.placeholder.com' in url: return False
              if 'placehold.co' in url: return False
              return True

          gh_group("📦 Carregando estado")
          video_map, title_map = {}, {}
          seen_urls, skip_urls = set(), set()
          if DATA_FILE.exists():
              try:
                  d = json.loads(DATA_FILE.read_text(encoding='utf-8'))
                  video_map = {k: u for k, u in d.get('video_map', {}).items() if is_valid_cover(u)}
                  title_map = {k: u for k, u in d.get('title_map', {}).items() if is_valid_cover(u)}
                  log(f"video={len(video_map)} title={len(title_map)} (após filtro)")
              except: pass
          if SEEN_FILE.exists():
              try: seen_urls = set(json.loads(SEEN_FILE.read_text(encoding='utf-8')))
              except: pass
          if SKIP_FILE.exists():
              try: skip_urls = set(json.loads(SKIP_FILE.read_text(encoding='utf-8')))
              except: pass
          gh_endgroup()

          def norm_video(url):
              if not url: return ""
              m = re.search(r'(tt\d{6,10})', url.lower())
              if m: return m.group(1) + ".mp4"
              u = url.split('?')[0].split('#')[0].rstrip('/')
              return u.split('/')[-1].lower()

          def norm_title(t):
              if not t: return ""
              t = t.lower().strip()
              t = re.sub(r'^(assistir|ver|onde assistir|onde ver)\s+', '', t)
              t = re.sub(r'\s*[-–|]\s*[\w\s]*clau[\w\s]*$', '', t, flags=re.I)
              t = re.sub(r'\s*[-–|]\s*[\w\s]*vini7xgrave[\w\s]*$', '', t, flags=re.I)
              t = re.sub(r'\s*[-–]\s*t\d+e\d+.*$', '', t, flags=re.I)
              t = re.sub(r'\(\d+\)', '', t)
              t = re.sub(r'\b(19|20)\d{2}\b', '', t)
              t = re.sub(r'\b(online|dublado|legendado|hdcam|completo|filme|serie|t\d+e\d+)\b', '', t, flags=re.I)
              t = re.sub(r'[^\w\s]', ' ', t)
              return re.sub(r'\s+', ' ', t).strip()

          def add_pair(video, cover, title=None):
              if not is_valid_cover(cover):
                  return
              cover = cover.strip()
              if cover.startswith('//'): cover = 'https:' + cover
              if video:
                  vk = norm_video(video)
                  if vk and vk not in video_map:
                      video_map[vk] = cover
                      log(f"  +video({len(video_map)}) {vk[:50]} <- {cover[:70]}")
              if title:
                  tk = norm_title(title)
                  if tk and tk not in title_map:
                      title_map[tk] = cover
                      log(f"  +title({len(title_map)}) {tk[:40]} <- {cover[:70]}")

          def walk_html(html):
              video = cover = title = None
              for pat in [r'"contentUrl"\s*:\s*"([^"]+)"',
                          r'<video[^>]+src=["\']([^"\']+)["\']',
                          r'<iframe[^>]+src=["\']([^"\']+\.(?:mp4|m3u8)[^"\']*)["\']']:
                  m = re.search(pat, html, re.I)
                  if m: video = m.group(1); break

              # SOMENTE aceita URLs http/https — nunca "h" ou strings vazias
              for pat in [r'"thumbnailUrl"\s*:\s*(?:\[\s*)?"(https?://[^"]+)"',
                          r'<meta[^>]*property=["\']og:image["\'][^>]*content=["\'](https?://[^"\']+)["\']',
                          r'<video[^>]+poster=["\'](https?://[^"\']+)["\']']:
                  m = re.search(pat, html, re.I)
                  if m: cover = m.group(1); break

              m = re.search(r'<title>([^<]+)</title>', html, re.I)
              if m: title = m.group(1)
              if cover: add_pair(video, cover, title)

          def walk_json(obj, depth=0):
              if depth > 8: return
              if isinstance(obj, dict):
                  video = cover = title = None
                  for k in ('contentUrl','content_url','video_url','videoUrl','video','file','src','stream_url','stream'):
                      v = obj.get(k)
                      if isinstance(v, str) and any(x in v.lower() for x in ('.mp4','.m3u8','.ts','/hls/','/vod/','stream')):
                          video = v; break
                  for k in ('thumbnailUrl','thumbnail_url','poster','poster_path','cover','image','img','thumbnail','capa'):
                      v = obj.get(k)
                      if isinstance(v, list) and v and isinstance(v[0], str):
                          if is_valid_cover(v[0]): cover = v[0]; break
                      if isinstance(v, str) and is_valid_cover(v):
                          cover = v; break
                  for k in ('name','title','titulo'):
                      v = obj.get(k)
                      if isinstance(v, str) and v: title = v; break
                  if cover: add_pair(video, cover, title)
                  for v in obj.values(): walk_json(v, depth+1)
              elif isinstance(obj, list):
                  for x in obj: walk_json(x, depth+1)

          # --- fila ---
          gh_group("📋 Preparando fila do feed")
          if not FEED_FILE.exists():
              gh_error("Sem .scrape_feed_urls.txt — fase 1 falhou.")
              gh_endgroup()
              raise SystemExit(1)

          todas = [l.strip() for l in FEED_FILE.read_text(encoding='utf-8').splitlines() if l.strip()]
          fila = [u for u in todas if u not in seen_urls and u not in skip_urls]
          log(f"Feed total: {len(todas)} | Vistas: {len(seen_urls)} | Skip: {len(skip_urls)} | Fila: {len(fila)}")
          gh_endgroup()

          lote = fila[:MAX_PAGES]
          log(f"Lote deste run: {len(lote)} URLs")

          visited = 0
          queue_remaining = len(fila) - len(lote)

          if lote:
              with sync_playwright() as p:
                  browser = p.chromium.launch(
                      headless=True,
                      args=['--no-sandbox','--disable-blink-features=AutomationControlled','--disable-dev-shm-usage']
                  )
                  ctx = browser.new_context(user_agent=USER_AGENT, viewport={'width': 1920, 'height': 1080}, locale='pt-BR')
                  page = ctx.new_page()

                  def on_response(resp):
                      try:
                          ct = (resp.headers.get('content-type') or '').lower()
                          if 'json' in ct:
                              try: walk_json(resp.json())
                              except: pass
                          elif 'html' in ct:
                              try: walk_html(resp.text())
                              except: pass
                      except: pass
                  page.on('response', on_response)
                  log("Browser iniciado")

                  gh_group(f"🕷️ Visitando {len(lote)} páginas")
                  for i, url in enumerate(lote, 1):
                      t0 = time.time()
                      log(f"[{i}/{len(lote)}] GET {url}")
                      try:
                          try:
                              resp = page.goto(url, wait_until='domcontentloaded', timeout=25000)
                          except:
                              log(f"  → timeout, skip")
                              skip_urls.add(url); continue

                          if resp and resp.status in (404, 410):
                              skip_urls.add(url); log(f"  → HTTP {resp.status}"); continue
                          if resp and resp.status >= 400:
                              log(f"  → HTTP {resp.status}, soft-fail"); continue

                          walk_html(page.content())
                          visited += 1
                          seen_urls.add(url)
                          log(f"  ok {time.time()-t0:.1f}s | video={len(video_map)} title={len(title_map)}")

                          if visited % 10 == 0:
                              DATA_FILE.write_text(json.dumps({'video_map': video_map, 'title_map': title_map}, ensure_ascii=False, indent=2), encoding='utf-8')
                              SEEN_FILE.write_text(json.dumps(list(seen_urls), ensure_ascii=False), encoding='utf-8')
                              SKIP_FILE.write_text(json.dumps(list(skip_urls), ensure_ascii=False), encoding='utf-8')
                              log(f"  💾 checkpoint (visited={visited})")

                      except Exception as e:
                          log(f"  ERRO: {str(e)[:150]}")
                          skip_urls.add(url); continue
                  gh_endgroup()
                  browser.close()

          # --- estado final ---
          DATA_FILE.write_text(json.dumps({'video_map': video_map, 'title_map': title_map}, ensure_ascii=False, indent=2), encoding='utf-8')
          SEEN_FILE.write_text(json.dumps(list(seen_urls), ensure_ascii=False), encoding='utf-8')
          SKIP_FILE.write_text(json.dumps(list(skip_urls), ensure_ascii=False), encoding='utf-8')

          faltam = len([u for u in todas if u not in seen_urls and u not in skip_urls])
          STATUS_FILE.write_text(json.dumps({
              'queue_remaining': faltam,
              'visited': visited,
              'feed_total': len(todas),
              'seen': len(seen_urls),
              'video_map': len(video_map),
              'title_map': len(title_map),
              'timestamp': int(time.time()),
          }, ensure_ascii=False, indent=2), encoding='utf-8')

          gh_group("📊 Resumo")
          log(f"Feed total: {len(todas)} | Visitadas agora: {visited} | Faltam: {faltam}")
          log(f"video_map={len(video_map)} | title_map={len(title_map)}")
          gh_endgroup()

          if not APPLY:
              log("APPLY=false — pulando aplicação")
              raise SystemExit(0)

          # --- aplicação ---
          gh_group("🎨 Aplicando capas")
          total = alterados = via_video = via_title = via_filename = sem_match = 0
          sem_match_list = []
          last_log = time.time()

          for arq in sorted(Path('.').rglob('*.html')):
              if '.git' in arq.parts: continue
              total += 1
              try: texto = arq.read_text(encoding='utf-8', errors='ignore')
              except: continue
              if PLACEHOLDER not in texto: continue

              cu = re.search(r'"contentUrl"\s*:\s*"([^"]+)"', texto)
              cover = None; source = None
              if cu:
                  cover = video_map.get(norm_video(cu.group(1)))
                  if cover: source = "video"
              if not cover:
                  nm = re.search(r'"name"\s*:\s*"([^"]+)"', texto)
                  if nm:
                      cover = title_map.get(norm_title(nm.group(1)))
                      if cover: source = "title"
              if not cover:
                  cover = title_map.get(norm_title(arq.stem))
                  if cover: source = "filename"
              if not cover:
                  sem_match += 1; sem_match_list.append(arq.name); continue

              # double-check: nunca aplica placeholder
              if not is_valid_cover(cover):
                  sem_match += 1; sem_match_list.append(arq.name); continue

              novo = texto.replace(PLACEHOLDER, cover)
              if novo != texto:
                  arq.write_text(novo, encoding='utf-8')
                  alterados += 1
                  if source == "video": via_video += 1
                  elif source == "title": via_title += 1
                  else: via_filename += 1

              if time.time() - last_log > 5:
                  log(f"  progresso: {alterados} aplicadas | {sem_match} sem match | {total} arquivos")
                  last_log = time.time()

          Path('.scrape_sem_match.txt').write_text('\n'.join(sem_match_list), encoding='utf-8')
          log(f"Total: {total} | Alterados: {alterados} (video={via_video}, title={via_title}, filename={via_filename}) | Sem match: {sem_match}")
          gh_endgroup()
          PYEOF

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-state
          if-no-files-found: ignore
          path: |
            .scrape_feed_urls.txt
            .scrape_data.json
            .scrape_seen.json
            .scrape_skip.json
            .scrape_status.json
            .scrape_sem_match.txt
          retention-days: 30

      - name: Commitar estado do scraper
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .scrape_feed_urls.txt .scrape_data.json .scrape_seen.json .scrape_skip.json .scrape_status.json .scrape_sem_match.txt 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: estado do scraper [skip ci]"
          git push

      - name: Commitar capas aplicadas
        if: inputs.apply_changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "*.html"
          if git diff --cached --quiet; then
            echo "Nenhum HTML modificado."; exit 0
          fi
          git commit -m "Auto: capas reais do site aplicadas [skip ci]"
          git push

      - name: Disparar próxima run (se fila não vazia)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.PAT_CHAIN }}
          REPO: ${{ github.repository }}
          WORKFLOW_FILE: ${{ env.WORKFLOW_FILE }}
        run: |
          if [ ! -f .scrape_status.json ]; then echo "Sem status"; exit 0; fi
          QUEUE=$(python3 -c "import json; print(json.load(open('.scrape_status.json')).get('queue_remaining', -1))")
          SEEN=$(python3 -c "import json; print(json.load(open('.scrape_status.json')).get('seen', 0))")
          TOTAL=$(python3 -c "import json; print(json.load(open('.scrape_status.json')).get('feed_total', 0))")

          echo "📊 Feed: $TOTAL | Vistas: $SEEN | Faltam: $QUEUE"

          if [ "$QUEUE" -le 0 ]; then echo "✅ Fila vazia. Chain encerrada."; exit 0; fi
          if [ -f .scrape_stop ]; then echo "🛑 .scrape_stop. Parando."; exit 0; fi

          LIMITE_ISO=$(date -u -d '60 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          RECENTES=$(gh run list --workflow="$WORKFLOW_FILE" --limit 100 --json event,createdAt --jq "[.[] | select(.event == \"workflow_dispatch\") | select(.createdAt > \"$LIMITE_ISO\")] | length" --repo "$REPO" 2>/dev/null || echo 0)
          if [ "$RECENTES" -ge 30 ]; then echo "⚠️ Limite de 30 runs/hora. Parando."; exit 0; fi

          APPLY="${{ inputs.apply_changes }}"
          MAX_PAGES_NEXT="${{ inputs.max_pages }}"
          echo "🔁 Disparando próxima run em 30s..."
          sleep 30

          for i in {1..5}; do
            if gh workflow run "$WORKFLOW_FILE" --repo "$REPO" --ref main \
                -f apply_changes="$APPLY" \
                -f max_pages="$MAX_PAGES_NEXT" \
                -f refresh_feed=false; then
              echo "✅ Próxima run disparada!"; break
            else
              echo "⚠️ Falhou ($i/5). Retry em 15s..."; sleep 15
            fi
          done
