name: Gerar sitemap

on:
  push:
    branches: [main]
    paths-ignore:
      - "sitemap*.xml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sitemap
  cancel-in-progress: true

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar sitemap
        run: python3 .github/scripts/gerar_sitemap.py
      - name: Commitar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap*.xml
          git diff --cached --quiet && exit 0
          git commit -m "chore: sitemap atualizado"
          git push
