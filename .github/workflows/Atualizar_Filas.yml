name: Atualizar Filas com Novos Posts

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      apagar_filas:
        description: '⚠️ PERIGO: apagar filmes_fila.txt e series_fila.txt e reconstruir do zero (classifica TODAS as URLs pelo feed, ~1-2 min)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: atualizar-filas
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Instalar dependências
        run: pip install requests

      - name: Atualizar filas
        env:
          APAGAR_FILAS: ${{ inputs.apagar_filas || 'false' }}
        run: |
          cat > /tmp/atualizar_filas.py << 'PYEOF'
          import requests, sys, os, json
          from pathlib import Path

          BASE_URL = "https://www.vini7xgrave.site"
          HEADERS = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"}

          ARQ_FILA_FILMES = Path("filmes_fila.txt")
          ARQ_FILA_SERIES = Path("series_fila.txt")

          APAGAR_FILAS = os.environ.get("APAGAR_FILAS", "false").lower() == "true"

          # Labels que indicam SÉRIE no feed do Blogger
          SERIES_LABELS = {
              "séries", "série", "series", "seriados",
              "animes", "anime", "doramas", "episódios",
          }

          def log(*a): print(*a, flush=True); sys.stdout.flush()

          def get_all_entries():
              """Retorna dict {url: set(labels)} de TODOS os posts do feed."""
              entries = {}
              start = 1
              while True:
                  url_feed = (f"{BASE_URL}/feeds/posts/default?alt=json"
                              f"&max-results=150&start-index={start}")
                  try:
                      r = requests.get(url_feed, headers=HEADERS, timeout=20)
                      if r.status_code != 200:
                          log(f"  ⚠️ Feed retornou {r.status_code} em start={start}")
                          break
                      data = r.json()
                      feed_entries = data.get("feed", {}).get("entry", [])
                      if not feed_entries:
                          break
                      for e in feed_entries:
                          link = next(
                              (l["href"] for l in e.get("link", [])
                               if l.get("rel") == "alternate"),
                              None
                          )
                          if not link:
                              continue
                          url = link.split("?")[0].strip()
                          labels = {
                              c.get("term", "").strip().lower()
                              for c in e.get("category", [])
                              if c.get("term")
                          }
                          entries[url] = labels
                      start += 150
                      if len(feed_entries) < 150:
                          break
                  except Exception as e:
                      log(f"  ❌ Erro no feed start={start}: {e}")
                      break
              return entries

          def classificar_por_labels(labels):
              """Retorna 'serie', 'filme' ou 'ambos'."""
              if not labels:
                  return 'ambos'
              if labels & SERIES_LABELS:
                  return 'serie'
              return 'filme'

          def carregar_lista(arquivo):
              if arquivo.exists():
                  return [l.strip() for l in
                          arquivo.read_text(encoding="utf-8").splitlines()
                          if l.strip()]
              return []

          def ordenar_lista(original, adicoes_set):
              vistos = set()
              resultado = []
              for u in original:
                  if u not in vistos:
                      resultado.append(u)
                      vistos.add(u)
              for u in sorted(adicoes_set):
                  if u not in vistos:
                      resultado.append(u)
                      vistos.add(u)
              return resultado

          def main():
              log("Buscando feed completo (com labels)...")
              feed = get_all_entries()
              log(f"📥 {len(feed)} posts encontrados no feed.")

              if not feed:
                  log("❌ Feed vazio. NÃO vou sobrescrever as filas (segurança).")
                  return

              # Classificação
              classificados = {}
              for url, labels in feed.items():
                  classificados[url] = classificar_por_labels(labels)

              contagem = {'filme': 0, 'serie': 0, 'ambos': 0}
              for c in classificados.values():
                  contagem[c] += 1

              log("📊 Classificação pelo feed:")
              log(f"   🎬 Filmes:  {contagem['filme']}")
              log(f"   📺 Séries:  {contagem['serie']}")
              log(f"   ❓ Ambíguos: {contagem['ambos']}")

              # Exemplos
              ex_filmes = [u for u, c in classificados.items() if c == 'filme'][:3]
              ex_series = [u for u, c in classificados.items() if c == 'serie'][:3]
              if ex_filmes:
                  log(f"   Exemplos filmes: {ex_filmes}")
              if ex_series:
                  log(f"   Exemplos séries: {ex_series}")

              # Carregar filas atuais
              if APAGAR_FILAS:
                  log("⚠️ MODO APAGAR: filas serão reconstruídas do zero.")
                  fila_filmes_old = []
                  fila_series_old = []
              else:
                  fila_filmes_old = carregar_lista(ARQ_FILA_FILMES)
                  fila_series_old = carregar_lista(ARQ_FILA_SERIES)
                  log(f"Filmes fila atual: {len(fila_filmes_old)} | "
                      f"Séries fila atual: {len(fila_series_old)}")

              set_filmes_old = set(fila_filmes_old)
              set_series_old = set(fila_series_old)

              # Aplicar
              if APAGAR_FILAS:
                  novas_filmes = set()
                  novas_series = set()
              else:
                  novas_filmes = set(fila_filmes_old)
                  novas_series = set(fila_series_old)

              for url, classe in classificados.items():
                  if classe == 'filme':
                      novas_filmes.add(url)
                  elif classe == 'serie':
                      novas_series.add(url)
                  else:  # ambos
                      novas_filmes.add(url)
                      novas_series.add(url)

              filme_final = ordenar_lista(fila_filmes_old, novas_filmes - set(fila_filmes_old))
              series_final = ordenar_lista(fila_series_old, novas_series - set(fila_series_old))

              ARQ_FILA_FILMES.write_text("\n".join(filme_final), encoding="utf-8")
              ARQ_FILA_SERIES.write_text("\n".join(series_final), encoding="utf-8")

              log(f"✅ Filmes fila agora tem: {len(filme_final)} URLs")
              log(f"✅ Séries fila agora tem: {len(series_final)} URLs")

          if __name__ == "__main__":
              main()
          PYEOF
          python3 /tmp/atualizar_filas.py

      - name: Salvar arquivos e progresso
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git reset .github/ 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "Nada novo nas filas."
            exit 0
          fi
          git commit -m "chore: atualizar filas (classificação via labels do feed)"

          for i in $(seq 1 5); do
            if git push origin HEAD:main; then break; fi
            echo "Conflito detectado. Sincronizando..."
            git pull origin main --no-rebase -X ours --no-edit
            git add -A
            git reset .github/ 2>/dev/null || true
            git commit -m "chore: retry atualizar filas $i" || true
            sleep $((RANDOM % 10 + 5))
          done
