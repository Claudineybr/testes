name: Atualizar Filas com Novos Posts

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      apagar_filas:
        description: '⚠️ APAGAR e reconstruir filas do zero (classifica TODAS as URLs)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: atualizar-filas
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Instalar dependências
        run: pip install requests

      - name: Atualizar filas
        env:
          APAGAR_FILAS: ${{ inputs.apagar_filas || 'false' }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          cat > /tmp/atualizar_filas.py << 'PYEOF'
          import requests, sys, os, re, json, time
          from pathlib import Path
          from difflib import SequenceMatcher
          import unicodedata

          BASE_URL = "https://www.vini7xgrave.site"
          HEADERS = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"}
          TMDB_BASE = "https://api.themoviedb.org/3"
          TMDB_KEY = os.environ.get("TMDB_API_KEY", "").strip()
          TMDB_RATE = 4.0  # req/s (free tier)

          ARQ_FILA_FILMES = Path("filmes_fila.txt")
          ARQ_FILA_SERIES = Path("series_fila.txt")
          ARQ_TMDB_CACHE  = Path("tmdb_cache.json")

          APAGAR_FILAS = os.environ.get("APAGAR_FILAS", "false").lower() == "true"

          SERIES_LABELS = {
              "séries", "série", "series", "seriados",
              "animes", "anime", "doramas", "episódios",
              "temporada", "season",
          }

          _ANO_RE = r"(?<!\d)(?:19|20)\d{2}(?!\d)"

          def log(*a): print(*a, flush=True); sys.stdout.flush()

          # ---------- Normalização / similaridade ----------
          def normalizar(s):
              s = unicodedata.normalize("NFKD", str(s or "").lower())
              s = "".join(c for c in s if not unicodedata.combining(c))
              s = re.sub(r"[^a-z0-9 ]", " ", s)
              s = re.sub(r"\s+", " ", s).strip()
              return s

          def similaridade(a, b):
              a, b = normalizar(a), normalizar(b)
              if not a or not b:
                  return 0.0
              return SequenceMatcher(None, a, b).ratio() * 100

          # ---------- TMDB cache ----------
          cache = {}
          if ARQ_TMDB_CACHE.exists():
              try:
                  cache = json.loads(ARQ_TMDB_CACHE.read_text(encoding="utf-8"))
              except Exception:
                  pass

          def salvar_cache():
              try:
                  ARQ_TMDB_CACHE.write_text(
                      json.dumps(cache, ensure_ascii=False, indent=2),
                      encoding="utf-8",
                  )
              except Exception:
                  pass

          # ---------- Rate limit TMDB ----------
          _ultima_tmdb = [0.0]

          def _tmdb_get(endpoint, params):
              falta = _ultima_tmdb[0] + (1.0 / TMDB_RATE) - time.time()
              if falta > 0:
                  time.sleep(falta)
              _ultima_tmdb[0] = time.time()
              try:
                  r = requests.get(f"{TMDB_BASE}{endpoint}", params=params, timeout=15)
                  if r.status_code == 429:
                      time.sleep(5)
                      r = requests.get(f"{TMDB_BASE}{endpoint}", params=params, timeout=15)
                  return r
              except Exception:
                  return None

          # ---------- Extração de título e ano da URL ----------
          def extrair_titulo_da_url(url):
              m = re.search(r'/([^/]+)\.html', url)
              if not m:
                  return None
              slug = m.group(1)
              for _ in range(10):
                  novo = re.sub(
                      r'^(?:inix|arc|entre[_-]?nos|vini7x|marcos)[-_]',
                      '', slug, flags=re.I,
                  )
                  if novo == slug:
                      break
                  slug = novo
              slug = re.sub(r'[-_]\d{4}$', '', slug)
              slug = re.sub(r'_\d{5,}$', '', slug)
              if len(slug) < 3:
                  return None
              return slug.replace('-', ' ').replace('_', ' ').strip()

          def extrair_ano_da_url(url):
              m = re.search(r"/([^/?#]+?)(?:\.html)?(?:[?#].*)?$", url or "")
              if not m:
                  return None
              anos = re.findall(_ANO_RE, m.group(1))
              return anos[-1] if anos else None

          # ---------- Busca TMDB por tipo ----------
          def _tmdb_buscar(titulo, ano, media_type):
              """Busca movie OU tv. Retorna dict com o melhor resultado ou None."""
              endpoint = f"/search/{media_type}"
              params = {
                  "api_key": TMDB_KEY,
                  "query": titulo,
                  "language": "pt-BR",
                  "include_adult": "false",
              }
              if ano:
                  if media_type == "movie":
                      params["year"] = ano
                  else:
                      params["first_air_date_year"] = ano

              r = _tmdb_get(endpoint, params)
              if r is None or r.status_code != 200:
                  return None

              results = r.json().get("results", [])
              if not results:
                  # Tenta sem ano (fallback)
                  if ano:
                      params.pop("year", None)
                      params.pop("first_air_date_year", None)
                      r = _tmdb_get(endpoint, params)
                      if r is None or r.status_code != 200:
                          return None
                      results = r.json().get("results", [])
                  if not results:
                      return None

              # Pega o melhor match
              melhor = None
              melhor_score = -1
              for res in results[:5]:
                  titulo_tmdb = res.get("title") or res.get("name") or ""
                  match = similaridade(titulo, titulo_tmdb)
                  data = res.get("release_date") or res.get("first_air_date") or ""
                  ano_tmdb = data.split("-")[0] if data else ""
                  ano_match = bool(ano and ano_tmdb == ano)

                  score = match
                  if ano_match:
                      score += 50
                  elif ano and ano_tmdb:
                      try:
                          diff = abs(int(ano) - int(ano_tmdb))
                          if diff > 3:
                              score -= 20
                      except Exception:
                          pass

                  if score > melhor_score:
                      melhor_score = score
                      melhor = {
                          "titulo": titulo_tmdb,
                          "ano": ano_tmdb,
                          "ano_match": ano_match,
                          "match": match,
                          "score": score,
                          "popularity": res.get("popularity", 0),
                          "vote_count": res.get("vote_count", 0),
                      }

              return melhor

          # ---------- Decisão TMDB ----------
          def _decidir_tmdb(titulo, ano, movie, tv):
              """
              Retorna (tipo, peso, motivo).
              tipo: 'movie' | 'tv' | None
              peso: 0-60 (peso do sinal no score final)
              """
              if not movie and not tv:
                  return None, 0, "TMDB: nada"

              if movie and not tv:
                  if movie["match"] < 60:
                      return None, 0, f"TMDB: só movie (match baixo {movie['match']:.0f}%)"
                  peso = 40 + (20 if movie["ano_match"] else 0)
                  return "movie", peso, f"TMDB: só movie (match {movie['match']:.0f}%, ano {'✓' if movie['ano_match'] else '✗'})"

              if tv and not movie:
                  if tv["match"] < 60:
                      return None, 0, f"TMDB: só tv (match baixo {tv['match']:.0f}%)"
                  peso = 40 + (20 if tv["ano_match"] else 0)
                  return "tv", peso, f"TMDB: só tv (match {tv['match']:.0f}%, ano {'✓' if tv['ano_match'] else '✗'})"

              # Ambos existem
              if movie["ano_match"] and not tv["ano_match"]:
                  return "movie", 50, f"TMDB: movie bate ano {ano}, tv não"
              if tv["ano_match"] and not movie["ano_match"]:
                  return "tv", 50, f"TMDB: tv bate ano {ano}, movie não"

              diff = movie["match"] - tv["match"]
              if diff > 15:
                  return "movie", 35, f"TMDB: movie match melhor ({movie['match']:.0f}% vs {tv['match']:.0f}%)"
              if diff < -15:
                  return "tv", 35, f"TMDB: tv match melhor ({tv['match']:.0f}% vs {movie['match']:.0f}%)"

              if movie["popularity"] > tv["popularity"] * 2:
                  return "movie", 25, f"TMDB: movie mais popular ({movie['popularity']:.0f} vs {tv['popularity']:.0f})"
              if tv["popularity"] > movie["popularity"] * 2:
                  return "tv", 25, f"TMDB: tv mais popular ({tv['popularity']:.0f} vs {movie['popularity']:.0f})"

              return None, 0, f"TMDB: empate (movie {movie['match']:.0f}%, tv {tv['match']:.0f}%)"

          def tmdb_classificar(titulo, ano):
              """
              Retorna (tipo, peso, motivo).
              """
              if not TMDB_KEY or not titulo:
                  return None, 0, "TMDB: desligado"

              chave = f"{titulo.lower().strip()}|{ano or ''}"
              if chave in cache:
                  c = cache[chave]
                  return c.get("tipo"), c.get("peso", 0), c.get("motivo", "cache")

              movie = _tmdb_buscar(titulo, ano, "movie")
              tv = _tmdb_buscar(titulo, ano, "tv")
              tipo, peso, motivo = _decidir_tmdb(titulo, ano, movie, tv)

              cache[chave] = {"tipo": tipo, "peso": peso, "motivo": motivo}
              return tipo, peso, motivo

          # ---------- Feed ----------
          def get_all_entries():
              entries = {}
              start = 1
              while True:
                  url_feed = (
                      f"{BASE_URL}/feeds/posts/default?alt=json"
                      f"&max-results=150&start-index={start}"
                  )
                  try:
                      r = requests.get(url_feed, headers=HEADERS, timeout=20)
                      if r.status_code != 200:
                          log(f"  ⚠️ Feed {r.status_code} em start={start}")
                          break
                      feed_entries = r.json().get("feed", {}).get("entry", [])
                      if not feed_entries:
                          break
                      for e in feed_entries:
                          link = next(
                              (l["href"] for l in e.get("link", [])
                               if l.get("rel") == "alternate"),
                              None,
                          )
                          if not link:
                              continue
                          url = link.split("?")[0].strip()
                          labels = {
                              c.get("term", "").strip().lower()
                              for c in e.get("category", [])
                              if c.get("term")
                          }
                          conteudo = ""
                          for campo in ("content", "summary"):
                              v = e.get(campo)
                              if isinstance(v, dict) and v.get("$t"):
                                  conteudo = v["$t"]
                                  break
                          entries[url] = {"labels": labels, "conteudo": conteudo}
                      start += 150
                      if len(feed_entries) < 150:
                          break
                  except Exception as e:
                      log(f"  ❌ Erro feed start={start}: {e}")
                      break
              return entries

          # ---------- Classificação em camadas ----------
          def classificar_url(url, labels, conteudo):
              """
              Retorna {'classe': 'filme'|'serie'|'ambos', 'score': int, 'motivos': list}.
              """
              score = 0
              motivos = []

              # === Camada 1: label de série é decisivo ===
              if labels & SERIES_LABELS:
                  return {
                      "classe": "serie",
                      "score": 100,
                      "motivos": [f"label: {sorted(labels & SERIES_LABELS)}"],
                  }

              # === Camada 2: conteúdo do feed ===
              c = conteudo.lower() if conteudo else ""

              if re.search(r"\bepis[oó]dio\s+\d+", c):
                  score -= 40
                  motivos.append("conteudo: 'Episódio N'")
              if re.search(r"\btemporada\s+\d+", c):
                  score -= 30
                  motivos.append("conteudo: 'Temporada N'")
              if re.search(r"\bT\d+\s*E\d+", conteudo):
                  score -= 40
                  motivos.append("conteudo: 'TNE N'")

              if re.search(r"\b(saga|cole[çc][ãa]o|colet[âa]nea|duologia|trilogia|quadrilogia|box)\b", c):
                  score += 20
                  motivos.append("conteudo: 'Saga/Coleção'")
              if re.search(r"\bdura[çc][ãa]o\s*:?\s*\d+", c):
                  score += 15
                  motivos.append("conteudo: 'Duração: X'")

              n_links_filme = len(re.findall(r">\s*filme\s*</a>", conteudo, re.I))
              if n_links_filme >= 2:
                  score += 30
                  motivos.append(f"conteudo: {n_links_filme} links 'Filme'")

              # === Camada 3: título/slug da URL ===
              m = re.search(r"/([^/]+?)\.html", url)
              slug = m.group(1).lower() if m else ""
              if any(x in slug for x in ("temporada", "season", "serie-")):
                  score -= 20
                  motivos.append("URL: 'temporada/season'")
              if re.search(r"[-_](saga|colecao|coletanea|duologia|trilogia|quadrilogia)", slug):
                  score += 15
                  motivos.append("URL: 'saga/coleção'")

              # === Camada 4: TMDB ===
              titulo = extrair_titulo_da_url(url)
              ano = extrair_ano_da_url(url)
              tipo, peso, motivo = tmdb_classificar(titulo, ano)

              if tipo == "movie":
                  score += peso
                  motivos.append(motivo)
              elif tipo == "tv":
                  score -= peso
                  motivos.append(motivo)
              else:
                  motivos.append(motivo)  # mantém para debug

              # === Decisão ===
              if score >= 40:
                  classe = "filme"
              elif score <= -40:
                  classe = "serie"
              else:
                  classe = "ambos"

              return {"classe": classe, "score": score, "motivos": motivos}

          def carregar_lista(arquivo):
              if arquivo.exists():
                  return [
                      l.strip() for l in
                      arquivo.read_text(encoding="utf-8").splitlines()
                      if l.strip()
                  ]
              return []

          def ordenar_lista(original, adicoes_set):
              vistos = set()
              resultado = []
              for u in original:
                  if u not in vistos:
                      resultado.append(u)
                      vistos.add(u)
              for u in sorted(adicoes_set):
                  if u not in vistos:
                      resultado.append(u)
                      vistos.add(u)
              return resultado

          # ---------- Main ----------
          def main():
              log("Buscando feed completo...")
              feed = get_all_entries()
              log(f"📥 {len(feed)} posts no feed.")

              if not feed:
                  log("❌ Feed vazio. NÃO vou sobrescrever as filas (segurança).")
                  return

              if not TMDB_KEY:
                  log("⚠️ TMDB_API_KEY não configurada. Ambíguos ficarão em ambas as filas.")

              if APAGAR_FILAS:
                  log("⚠️ MODO APAGAR: filas serão reconstruídas do zero.")
                  fila_filmes_old = []
                  fila_series_old = []
              else:
                  fila_filmes_old = carregar_lista(ARQ_FILA_FILMES)
                  fila_series_old = carregar_lista(ARQ_FILA_SERIES)
                  log(
                      f"Filmes fila atual: {len(fila_filmes_old)} | "
                      f"Séries fila atual: {len(fila_series_old)}"
                  )

              set_filmes_old = set(fila_filmes_old)
              set_series_old = set(fila_series_old)

              if APAGAR_FILAS:
                  a_classificar = set(feed.keys())
              else:
                  a_classificar = {
                      u for u in feed
                      if u not in set_filmes_old and u not in set_series_old
                  }

              if not a_classificar and not APAGAR_FILAS:
                  log("✅ Nenhuma URL nova. Filas já atualizadas.")
                  return

              log(f"🔍 Classificando {len(a_classificar)} URLs...")

              contagem = {"filme": 0, "serie": 0, "ambos": 0}
              resultado = {}
              total = len(a_classificar)

              for i, url in enumerate(sorted(a_classificar), 1):
                  item = feed.get(url, {})
                  labels = item.get("labels", set()) if isinstance(item, dict) else set()
                  conteudo = item.get("conteudo", "") if isinstance(item, dict) else ""

                  info = classificar_url(url, labels, conteudo)
                  resultado[url] = info
                  contagem[info["classe"]] += 1

                  if i % 100 == 0 or i == total:
                      log(
                          f"  [{i}/{total}] "
                          f"(🎬 {contagem['filme']} | "
                          f"📺 {contagem['serie']} | "
                          f"❓ {contagem['ambos']})"
                      )
                      salvar_cache()

              log("📊 Resultado final:")
              log(f"   🎬 Filmes:  {contagem['filme']}")
              log(f"   📺 Séries:  {contagem['serie']}")
              log(f"   ❓ Ambíguos: {contagem['ambos']}")

              # Amostras por motivo
              amostras = {k: [] for k in ("filme", "serie", "ambos")}
              for url, info in resultado.items():
                  if len(amostras[info["classe"]]) < 3:
                      amostras[info["classe"]].append((url, info["score"], info["motivos"]))

              for classe in ("filme", "serie", "ambos"):
                  if amostras[classe]:
                      log(f"\n   Amostras {classe.upper()}:")
                      for url, score, motivos in amostras[classe]:
                          log(f"     • score={score:+3d} | {url.split('/')[-1]}")
                          log(f"       {'; '.join(motivos)}")

              # Aplicar nas filas
              if APAGAR_FILAS:
                  novas_filmes = set()
                  novas_series = set()
              else:
                  novas_filmes = set(fila_filmes_old)
                  novas_series = set(fila_series_old)

              for url, info in resultado.items():
                  if info["classe"] == "filme":
                      novas_filmes.add(url)
                  elif info["classe"] == "serie":
                      novas_series.add(url)
                  else:
                      novas_filmes.add(url)
                      novas_series.add(url)

              filme_final = ordenar_lista(
                  fila_filmes_old,
                  novas_filmes - set(fila_filmes_old),
              )
              series_final = ordenar_lista(
                  fila_series_old,
                  novas_series - set(fila_series_old),
              )

              ARQ_FILA_FILMES.write_text(
                  "\n".join(filme_final), encoding="utf-8",
              )
              ARQ_FILA_SERIES.write_text(
                  "\n".join(series_final), encoding="utf-8",
              )

              log(f"\n✅ Filmes fila: {len(filme_final)} URLs")
              log(f"✅ Séries fila: {len(series_final)} URLs")

              salvar_cache()

          if __name__ == "__main__":
              main()
          PYEOF
          python3 /tmp/atualizar_filas.py

      - name: Salvar arquivos e progresso
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git reset .github/ 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "Nada novo nas filas."
            exit 0
          fi
          git commit -m "chore: atualizar filas (labels + conteúdo + TMDB com ano)"

          for i in $(seq 1 5); do
            if git push origin HEAD:main; then break; fi
            echo "Conflito detectado. Sincronizando..."
            git pull origin main --no-rebase -X ours --no-edit
            git add -A
            git reset .github/ 2>/dev/null || true
            git commit -m "chore: retry atualizar filas $i" || true
            sleep $((RANDOM % 10 + 5))
          done
