<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070d0b">
  <title>🎄 Episódios - Clau Flix</title>
  <style>
    /* =====================================================================
       1. VARIÁVEIS E RESET
       ===================================================================== */
    :root {
      --bg: #070d0b;
      --vidro: rgba(16, 28, 24, 0.66);
      --vidro-forte: rgba(10, 18, 15, 0.88);
      --vidro-borda: rgba(255, 255, 255, 0.1);
      --vermelho: #e5384a;
      --vermelho-esc: #b3202f;
      --verde: #2fb59f;
      --ouro: #ffc233;
      --texto: #f5f7f6;
      --suave: rgba(245, 247, 246, 0.82);
      --mudo: rgba(245, 247, 246, 0.66);
      --gradiente: linear-gradient(135deg, var(--vermelho), var(--verde));
      --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif; }
    [hidden] { display: none !important; }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--texto); min-height: 100vh; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
    body.modal-aberto { overflow: hidden; }
    a, button { -webkit-tap-highlight-color: transparent; }
    :focus-visible { outline: 3px solid var(--ouro); outline-offset: 3px; }
    ::selection { background: var(--vermelho); color: #fff; }

    /* =====================================================================
       2. FUNDO, NEVE E LUZES
       ===================================================================== */
    .bg-container { position: fixed; inset: 0; z-index: -2; background: var(--bg); }
    .bg-layer { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transition: opacity 1.8s ease-in-out; }
    .bg-layer.visivel { opacity: 1; }
    .bg-overlay { position: fixed; inset: 0; z-index: -1; background: radial-gradient(ellipse at top, rgba(7, 13, 11, 0.4), rgba(7, 13, 11, 0.92) 70%), linear-gradient(rgba(7, 13, 11, 0.55), rgba(7, 13, 11, 0.88)); }

    #snow-container { position: fixed; inset: 0; pointer-events: none; z-index: 9999; overflow: hidden; }
    .snowflake { position: absolute; top: -10px; color: #fff; font-family: Arial, sans-serif; user-select: none; pointer-events: none; animation: fall linear forwards; text-shadow: 0 0 6px rgba(255, 255, 255, 0.85); }
    @keyframes fall { to { transform: translateY(105vh) rotate(360deg); } }

    .luzes { position: absolute; left: 0; right: 0; bottom: -10px; height: 16px; display: flex; justify-content: space-around; pointer-events: none; }
    .luzes::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: rgba(255, 255, 255, 0.12); }
    .luzes i { width: 8px; height: 12px; margin-top: 2px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; background: var(--c); box-shadow: 0 0 10px 2px var(--c); animation: piscar 2.4s ease-in-out infinite; }
    @keyframes piscar { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

    /* =====================================================================
       3. CABEÇALHO
       ===================================================================== */
    header { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 16px 40px; background: linear-gradient(rgba(7, 13, 11, 0.85), rgba(7, 13, 11, 0.55)); backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%); border-bottom: 1px solid var(--vidro-borda); transition: background 0.3s, box-shadow 0.3s; }
    header.rolou { background: var(--vidro-forte); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
    .logo { font-size: 1.9rem; font-weight: 900; letter-spacing: 0.5px; text-decoration: none; background: var(--gradiente); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; white-space: nowrap; }
    .logo span { -webkit-text-fill-color: #fff; }
    .btn-voltar { display: inline-flex; align-items: center; gap: 8px; padding: 9px 20px; border-radius: 999px; color: var(--ouro); text-decoration: none; font-weight: 700; font-size: 0.92rem; background: rgba(255, 255, 255, 0.07); border: 1px solid var(--vidro-borda); transition: all 0.3s var(--ease); white-space: nowrap; }
    .btn-voltar:hover { color: #1a1200; background: var(--ouro); transform: translateX(-4px); }

    /* =====================================================================
       4. BOTÕES E CHIPS
       ===================================================================== */
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 14px 30px; border: none; border-radius: 999px; font-size: 1rem; font-weight: 700; cursor: pointer; text-decoration: none; color: #fff; transition: transform 0.3s var(--ease), box-shadow 0.3s var(--ease), filter 0.3s; }
    .btn-primary { background: linear-gradient(135deg, var(--vermelho), var(--vermelho-esc)); box-shadow: 0 8px 24px rgba(229, 56, 74, 0.45); }
    .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 14px 32px rgba(229, 56, 74, 0.6); filter: brightness(1.08); }
    .btn-vidro { background: rgba(255, 255, 255, 0.12); border: 1px solid var(--vidro-borda); backdrop-filter: blur(8px); }
    .btn-vidro:hover { background: rgba(255, 255, 255, 0.2); transform: translateY(-3px); }
    .btn-vidro.ativo { color: var(--ouro); border-color: var(--ouro); box-shadow: 0 0 18px rgba(255, 194, 51, 0.35); }
    .eyebrow { display: inline-block; padding: 6px 14px; border-radius: 999px; font-size: 0.75rem; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; color: #fff; background: var(--verde); box-shadow: 0 0 18px rgba(47, 181, 159, 0.5); }

    /* =====================================================================
       5. HERO DA SÉRIE
       ===================================================================== */
    .container { max-width: 940px; margin: 36px auto 0; padding: 0 20px; }
    .serie-hero { position: relative; min-height: 340px; border-radius: 28px; overflow: hidden; display: flex; align-items: center; border: 1px solid var(--vidro-borda); box-shadow: 0 30px 70px rgba(0, 0, 0, 0.55); background: #0c1613; }
    .serie-bg { position: absolute; inset: -30px; background: var(--capa, linear-gradient(135deg, #14302a, #0c1613)) center 25% / cover; filter: blur(26px) saturate(1.3) brightness(0.55); transform: scale(1.1); }
    .serie-hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(7, 13, 11, 0.85), rgba(7, 13, 11, 0.3)); }
    .serie-inner { position: relative; z-index: 1; display: flex; align-items: center; gap: 38px; width: 100%; padding: 38px 44px; }
    .serie-poster { flex-shrink: 0; width: 190px; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7); background: #14302a; }
    .serie-texto h1 { margin: 14px 0 8px; font-size: clamp(1.8rem, 4vw, 3rem); line-height: 1.08; font-weight: 900; text-shadow: 0 4px 24px rgba(0, 0, 0, 0.8); }
    .serie-meta { color: var(--suave); font-size: 1rem; margin-bottom: 14px; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8); }
    .serie-meta.solo { margin-bottom: 24px; }
    .serie-generos { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
    .serie-generos span { padding: 5px 13px; border-radius: 999px; font-size: 0.8rem; font-weight: 700; background: rgba(255, 255, 255, 0.14); border: 1px solid rgba(255, 255, 255, 0.2); backdrop-filter: blur(6px); }
    .acoes { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .serie-sk { position: absolute; inset: 0; }

    /* =====================================================================
       6. ABAS DE TEMPORADA E EPISÓDIOS
       ===================================================================== */
    .painel { margin: 28px 0 60px; padding: 28px; background: var(--vidro); border: 1px solid var(--vidro-borda); border-radius: 24px; backdrop-filter: blur(12px); box-shadow: 0 14px 40px rgba(0, 0, 0, 0.45); }
    .abas { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }
    .aba { padding: 9px 20px; border-radius: 999px; border: 1px solid var(--vidro-borda); background: rgba(255, 255, 255, 0.07); color: var(--suave); font-size: 0.92rem; font-weight: 700; cursor: pointer; transition: all 0.25s var(--ease); }
    .aba:hover { background: rgba(255, 255, 255, 0.14); color: #fff; }
    .aba[aria-selected="true"] { background: var(--ouro); color: #1a1200; border-color: transparent; box-shadow: 0 6px 18px rgba(255, 194, 51, 0.35); }
    .painel-titulo { font-size: 1.3rem; font-weight: 800; margin-bottom: 16px; display: flex; align-items: center; gap: 12px; }
    .painel-titulo::before { content: ''; width: 5px; height: 24px; border-radius: 3px; background: var(--gradiente); }

    .lista-eps { display: flex; flex-direction: column; gap: 10px; }
    .ep-item { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 18px; border-radius: 14px; text-decoration: none; color: #fff; background: rgba(255, 255, 255, 0.06); border: 1px solid transparent; transition: all 0.3s var(--ease); animation: entrar 0.4s var(--ease) backwards; }
    .ep-item:hover, .ep-item:focus-visible { background: rgba(229, 56, 74, 0.2); border-color: rgba(229, 56, 74, 0.55); transform: translateX(6px); }
    @keyframes entrar { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .ep-info { display: flex; align-items: center; gap: 16px; min-width: 0; }
    .ep-numero { flex-shrink: 0; min-width: 52px; padding: 7px 0; text-align: center; border-radius: 10px; font-size: 0.95rem; font-weight: 800; color: var(--ouro); background: rgba(255, 194, 51, 0.12); border: 1px solid rgba(255, 194, 51, 0.3); }
    .ep-titulo { font-size: 1.05rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
    .ep-play { flex-shrink: 0; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; padding-left: 3px; color: #fff; background: rgba(255, 255, 255, 0.14); transition: all 0.3s var(--ease); }
    .ep-item:hover .ep-play, .ep-item:focus-visible .ep-play { background: var(--vermelho); box-shadow: 0 0 18px rgba(229, 56, 74, 0.7); transform: scale(1.1); }

    /* =====================================================================
       7. SKELETON, ERRO E ESTADOS VAZIOS
       ===================================================================== */
    .sk { background: linear-gradient(90deg, rgba(255, 255, 255, 0.06) 25%, rgba(255, 255, 255, 0.17) 50%, rgba(255, 255, 255, 0.06) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite linear; }
    @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
    .sk-aba { display: inline-block; width: 110px; height: 38px; border-radius: 999px; margin: 0 8px 22px 0; }
    .sk-ep { height: 64px; border-radius: 14px; margin-bottom: 10px; }

    .estado-erro { margin: 28px 0 60px; text-align: center; padding: 60px 24px; color: var(--suave); background: var(--vidro); border-radius: 24px; border: 1px dashed var(--vidro-borda); }
    .estado-erro .estado-icone { font-size: 3.6rem; margin-bottom: 14px; }
    .estado-erro h3 { font-size: 1.5rem; margin-bottom: 10px; color: #fff; }
    .estado-erro p { max-width: 460px; margin: 0 auto 26px; line-height: 1.55; }
    .estado-erro .btn + .btn { margin-left: 10px; }

    /* =====================================================================
       8. MODAL DO PLAYER (FUNDO DESFOCADO)
       ===================================================================== */
    .modal-player { position: fixed; inset: 0; z-index: 1000; display: none; justify-content: center; align-items: center; padding: 20px; background: rgba(4, 8, 6, 0.72); backdrop-filter: blur(20px) saturate(125%); -webkit-backdrop-filter: blur(20px) saturate(125%); }
    .modal-player.aberto { display: flex; animation: modal-fade 0.25s var(--ease); }
    .modal-content { width: 100%; max-width: 1100px; background: #000; border-radius: 22px; overflow: hidden; position: relative; display: flex; flex-direction: column; border: 1px solid rgba(255, 194, 51, 0.3); box-shadow: 0 40px 90px rgba(0, 0, 0, 0.85), 0 0 60px rgba(229, 56, 74, 0.15); animation: modal-pop 0.35s var(--ease); }
    @keyframes modal-fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes modal-pop { from { opacity: 0; transform: translateY(20px) scale(0.96); } to { opacity: 1; transform: none; } }
    .close-btn { position: absolute; top: 14px; right: 14px; z-index: 10; width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--vermelho); background: rgba(7, 13, 11, 0.75); color: #ff7d88; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s var(--ease); }
    .close-btn:hover { background: var(--vermelho); color: #fff; transform: rotate(90deg) scale(1.1); }
    #playerContainer { width: 100%; aspect-ratio: 16 / 9; background: #000; display: flex; align-items: center; justify-content: center; color: #bbb; }
    #playerContainer video, #playerContainer iframe { width: 100%; height: 100%; border: none; display: block; }
    .modal-footer { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px; padding: 18px 28px; background: linear-gradient(to top, #000, #0a1512); border-top: 1px solid rgba(255, 194, 51, 0.2); }
    .modal-title { font-size: 1.3rem; font-weight: 700; margin: 0; }
    .btn-original { color: var(--suave); text-decoration: none; padding: 10px 20px; border-radius: 999px; font-size: 0.9rem; font-weight: 600; border: 1px solid rgba(255, 255, 255, 0.3); transition: 0.3s; }
    .btn-original:hover { background: rgba(255, 255, 255, 0.12); color: #fff; border-color: #fff; }
    .erro-player { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 40px; color: #fff; }
    .erro-player h3 { color: #ff7d88; font-size: 1.5rem; margin-bottom: 10px; }
    .erro-player p { color: var(--suave); margin-bottom: 20px; max-width: 500px; line-height: 1.5; }
    .btn-erro { background: var(--vermelho-esc); color: #fff; text-decoration: none; padding: 10px 22px; border-radius: 999px; font-weight: 700; }
    .btn-erro:hover { background: #8f1824; }

    /* =====================================================================
       9. RESPONSIVO E MOVIMENTO REDUZIDO
       ===================================================================== */
    @media (max-width: 700px) {
      header { padding: 14px 20px; }
      .logo { font-size: 1.6rem; }
      .container { margin-top: 24px; padding: 0 14px; }
      .serie-hero { border-radius: 22px; }
      .serie-inner { flex-direction: column; text-align: center; gap: 22px; padding: 30px 20px; }
      .serie-poster { width: 150px; }
      .acoes, .serie-generos { justify-content: center; }
      .painel { padding: 20px 14px; border-radius: 20px; }
      .ep-info { gap: 12px; }
      .ep-titulo { font-size: 0.98rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
      #snow-container { display: none; }
    }
  </style>
</head>
<body>

  <div class="bg-container" id="bg-slideshow" aria-hidden="true"></div>
  <div class="bg-overlay" aria-hidden="true"></div>
  <div id="snow-container" aria-hidden="true"></div>

  <header id="topo">
    <a href="index.html" class="logo" aria-label="Clau Flix - ir para o início">Clau <span>Flix</span></a>
    <a href="index.html" class="btn-voltar" aria-label="Voltar ao início">← Voltar ao Início</a>
    <div class="luzes" id="luzes" aria-hidden="true"></div>
  </header>

  <main class="container">
    <section class="serie-hero" id="serieHero" aria-label="Sobre a série">
      <div class="sk serie-sk" aria-hidden="true"></div>
    </section>

    <div id="conteudoEpisodios" aria-live="polite" aria-busy="true"></div>
  </main>

  <div class="modal-player" id="videoModal" role="dialog" aria-modal="true" aria-labelledby="modalTitulo">
    <div class="modal-content">
      <button type="button" class="close-btn" id="btnFechar" aria-label="Fechar player">✕</button>
      <div id="playerContainer"></div>
      <div class="modal-footer">
        <h3 class="modal-title" id="modalTitulo"></h3>
        <a href="#" id="linkOriginal" target="_blank" rel="noopener" class="btn-original" aria-label="Abrir no site original (nova aba)">🔗 Abrir no site original</a>
      </div>
    </div>
  </div>

  <script>
  (() => {
    'use strict';

    // ===================================================================
    // 1. CONFIGURAÇÃO
    // ===================================================================
    const CONFIG = {
      WORKER_URL: 'https://proxy-videos.claudineibu12.workers.dev/', // proxy p/ vídeos HTTP no PC
      CATALOGO_URL: 'catalogo.json',
      FETCH_TIMEOUT_MS: 12000,
      TROCA_FUNDO_MS: 10000,
      NEVE_INTERVALO_MS: 200,
      NEVE_MAX_FLOCOS: 60,
      QTD_LUZES: 36,
      CLASSIFICACAO_URL: 'classificacao.json',  // gêneros por arquivo (opcional: a página funciona sem ele)
      CLASSIFICACAO_TIMEOUT_MS: 25000,
      CLASSIFICACAO_GRACA_MS: 1500,             // espera curta antes de desenhar, p/ evitar "pulo" visual
      GENERO_INDEFINIDO: 'indefinido',
      MAX_GENEROS: 3,
    };

    const FUNDOS = [
      'https://images.unsplash.com/photo-1543589077-47d81606c1bf?w=1920&q=80&auto=format&fit=crop',
      'https://images.unsplash.com/photo-1482517967863-00e15c9b44be?w=1920&q=80&auto=format&fit=crop',
      'https://images.unsplash.com/photo-1512389142860-9c449e58a543?w=1920&q=80&auto=format&fit=crop',
      'https://images.unsplash.com/photo-1512909006721-3d6018887383?w=1920&q=80&auto=format&fit=crop',
      'https://images.unsplash.com/photo-1483664852095-d6cc6870702d?w=1920&q=80&auto=format&fit=crop'
    ];

    // Mesma chave usada pelo index.html: favoritos são compartilhados entre as páginas
    const LS_FAVORITOS = 'clauFlix_favoritos_v1';

    // Placeholder local (o antigo via.placeholder.com saiu do ar)
    const SEM_CAPA = 'data:image/svg+xml;utf8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600"><rect width="100%" height="100%" fill="#14302a"/><text x="50%" y="50%" fill="#ff7d88" font-family="Arial" font-size="34" font-weight="bold" text-anchor="middle" dominant-baseline="middle">SÉRIE</text></svg>'
    );

    // ===================================================================
    // 2. UTILITÁRIOS
    // ===================================================================
    const $ = (id) => document.getElementById(id);
    const reduzirMovimento = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const isMobile = () => /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;

    function lerFavoritos() {
      try { const v = JSON.parse(localStorage.getItem(LS_FAVORITOS)); return Array.isArray(v) ? v : []; } catch { return []; }
    }
    function gravarFavoritos(lista) {
      try { localStorage.setItem(LS_FAVORITOS, JSON.stringify(lista)); } catch { /* ignora */ }
    }

    /** Nome limpo da série (mesma regra do index.html). */
    function nomeDaSerie(item) {
      const nome = (item.serie || '').trim();
      return nome || item.titulo.replace(/\s*-\s*(T\d+E\d+|\d+x\d+|\sE\d+$).*/i, '').trim();
    }

    // ===================================================================
    // 3. FUNDO, NEVE E LUZES
    // ===================================================================
    function iniciarSlideshow() {
      const container = $('bg-slideshow');
      const camadas = [document.createElement('div'), document.createElement('div')];
      camadas.forEach((c) => { c.className = 'bg-layer'; container.appendChild(c); });
      let indice = 0;
      let camadaAtual = 0;

      const trocar = () => {
        const url = FUNDOS[indice];
        const img = new Image();
        img.onload = () => {
          const proxima = camadas[camadaAtual];
          proxima.style.backgroundImage = `url('${url}')`;
          proxima.classList.add('visivel');
          camadas[1 - camadaAtual].classList.remove('visivel');
          camadaAtual = 1 - camadaAtual;
          indice = (indice + 1) % FUNDOS.length;
        };
        img.src = url;
      };
      trocar();
      setInterval(() => { if (!document.hidden) trocar(); }, CONFIG.TROCA_FUNDO_MS);
    }

    function iniciarNeve() {
      if (reduzirMovimento) return;
      const container = $('snow-container');
      const simbolos = ['❅', '❆', '❄', '✧'];

      setInterval(() => {
        if (document.hidden || container.childElementCount >= CONFIG.NEVE_MAX_FLOCOS) return;
        const floco = document.createElement('div');
        floco.className = 'snowflake';
        floco.textContent = simbolos[Math.floor(Math.random() * simbolos.length)];
        floco.style.left = Math.random() * 100 + 'vw';
        floco.style.fontSize = Math.random() * 15 + 10 + 'px';
        floco.style.opacity = Math.random() * 0.5 + 0.3;
        floco.style.animationDuration = Math.random() * 5 + 3 + 's';
        floco.addEventListener('animationend', () => floco.remove(), { once: true });
        container.appendChild(floco);
      }, CONFIG.NEVE_INTERVALO_MS);
    }

    function iniciarLuzes() {
      const cores = ['#e5384a', '#ffc233', '#2fb59f', '#5aa9ff'];
      const frag = document.createDocumentFragment();
      for (let i = 0; i < CONFIG.QTD_LUZES; i++) {
        const luz = document.createElement('i');
        luz.style.setProperty('--c', cores[i % cores.length]);
        luz.style.animationDelay = ((i * 0.37) % 2.4) + 's';
        frag.appendChild(luz);
      }
      $('luzes').appendChild(frag);
    }

    // ===================================================================
    // 4. REFERÊNCIAS E ESTADO
    // ===================================================================
    const nomeSerieParam = new URLSearchParams(window.location.search).get('nome');
    const conteudo = $('conteudoEpisodios');
    const heroEl = $('serieHero');
    const videoModal = $('videoModal');
    const playerContainer = $('playerContainer');
    const modalTitulo = $('modalTitulo');
    const linkOriginal = $('linkOriginal');

    let serieAtual = null;   // { nome, capa, link }
    let episodios = [];      // todos os episódios, ordenados
    let temporadaAtiva = 1;

    // ===================================================================
    // 5. SKELETON, ERRO E MENSAGENS
    // ===================================================================
    function mostrarSkeleton() {
      heroEl.hidden = false;
      heroEl.innerHTML = '<div class="sk serie-sk" aria-hidden="true"></div>';
      conteudo.setAttribute('aria-busy', 'true');
      conteudo.innerHTML = `
        <div class="painel" aria-hidden="true">
          <div class="sk sk-aba"></div><div class="sk sk-aba"></div>
          ${'<div class="sk sk-ep"></div>'.repeat(5)}
        </div>`;
    }

    function mostrarErro(erro) {
      const demorou = erro && erro.name === 'AbortError';
      let titulo = 'Não foi possível carregar os episódios';
      let msg = 'Algo deu errado ao buscar a lista. Tente novamente em instantes.';
      if (!navigator.onLine) { titulo = 'Você está sem internet'; msg = 'Verifique sua conexão e tente novamente.'; }
      else if (demorou) { titulo = 'O catálogo está demorando demais'; msg = 'A conexão está lenta ou o servidor não respondeu a tempo.'; }

      heroEl.hidden = true;
      conteudo.setAttribute('aria-busy', 'false');
      conteudo.innerHTML = `
        <div class="estado-erro" role="alert">
          <div class="estado-icone" aria-hidden="true">🎅</div>
          <h3>${titulo}</h3>
          <p>${msg}</p>
          <button type="button" class="btn btn-primary" data-acao="tentar" aria-label="Tentar carregar novamente">↻ Tentar novamente</button>
          <a href="index.html" class="btn btn-vidro">Voltar ao início</a>
        </div>`;
    }

    function mostrarMensagem(titulo, msg) {
      heroEl.hidden = true;
      conteudo.setAttribute('aria-busy', 'false');
      conteudo.innerHTML = `
        <div class="estado-erro">
          <div class="estado-icone" aria-hidden="true">🎬</div>
          <h3>${esc(titulo)}</h3>
          <p>${esc(msg)}</p>
          <a href="index.html" class="btn btn-primary">Voltar ao início</a>
        </div>`;
    }

    /** Baixa um JSON com limite de tempo; lança erro com `name === 'AbortError'` se demorar. */
    async function buscarJson(url, limiteMs) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), limiteMs);
      try {
        const resposta = await fetch(url, { signal: controller.signal });
        if (!resposta.ok) throw new Error(`HTTP ${resposta.status} em ${url}`);
        return await resposta.json();
      } finally {
        clearTimeout(timer);
      }
    }

    const SEM_RESPOSTA = Symbol('sem-resposta');
    const atraso = (ms) => new Promise((resolve) => setTimeout(() => resolve(SEM_RESPOSTA), ms));

    /** Carrega a classificação (opcional): se falhar, só ficam de fora os gêneros. */
    function carregarClassificacao() {
      return buscarJson(CONFIG.CLASSIFICACAO_URL, CONFIG.CLASSIFICACAO_TIMEOUT_MS)
        .then((cls) => (cls && typeof cls === 'object' && !Array.isArray(cls) ? cls : null))
        .catch((erro) => { console.warn('[Clau Flix] classificacao.json indisponível; seguindo sem gêneros.', erro); return null; });
    }

    const normalizar = (s) => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
    const arquivoDoLink = (link) => {
      try { return decodeURIComponent(String(link || '').split(/[?#]/)[0].split('/').pop()).toLowerCase(); } catch { return ''; }
    };

    /** Gêneros da série = os mais frequentes entre os episódios (a IA classificou episódio a episódio). */
    function generosDaClassificacao(cls, eps) {
      const tem = (k) => Object.prototype.hasOwnProperty.call(cls, k);
      let porTitulo = null; // índice por título só é montado se algum episódio não casar pelo arquivo
      const cont = new Map();

      eps.forEach((ep) => {
        let entrada = tem(arquivoDoLink(ep.link)) ? cls[arquivoDoLink(ep.link)] : null;
        if (!entrada) {
          if (!porTitulo) {
            porTitulo = new Map();
            Object.values(cls).forEach((e) => { const t = normalizar(e && e.titulo); if (t && !porTitulo.has(t)) porTitulo.set(t, e); });
          }
          entrada = porTitulo.get(normalizar(ep.titulo)) || null;
        }
        if (!entrada || !Array.isArray(entrada.generos)) return;
        entrada.generos.filter((g) => g && g !== CONFIG.GENERO_INDEFINIDO).forEach((g) => cont.set(g, (cont.get(g) || 0) + 1));
      });

      const collator = new Intl.Collator('pt-BR', { sensitivity: 'base' });
      return [...cont].sort((a, b) => b[1] - a[1] || collator.compare(a[0], b[0])).slice(0, CONFIG.MAX_GENEROS).map(([g]) => g);
    }

    // ===================================================================
    // 6. HERO, TEMPORADAS E EPISÓDIOS
    // ===================================================================
    /** Garante temporada/episódio numéricos (usa o título TxxExx como plano B). */
    function normalizarEpisodio(ep) {
      const m = ep.titulo.match(/T(\d+)E(\d+)/i);
      return {
        ...ep,
        _temp: Number(ep.temporada) || (m ? parseInt(m[1], 10) : 1),
        _ep: Number(ep.episodio) || (m ? parseInt(m[2], 10) : 0),
      };
    }

    /** Remove nome da série e marcação TxxExx do título exibido. */
    function tituloLimpo(ep, nome) {
      let t = ep.titulo.replace(nome, '').replace(/-\s*T\d+E\d+/i, '').replace(/T\d+E\d+/i, '').trim();
      if (t.startsWith('-')) t = t.substring(1).trim();
      return t || `Episódio ${ep._ep}`;
    }

    const pad2 = (n) => String(n).padStart(2, '0');
    const listaTemporadas = () => [...new Set(episodios.map((e) => e._temp))];

    function renderizarHero() {
      const { nome, capa } = serieAtual;
      const nTemp = listaTemporadas().length;
      const capaCss = capa ? capa.replace(/"/g, '%22') : '';
      if (capaCss) heroEl.style.setProperty('--capa', `url("${capaCss}")`); else heroEl.style.removeProperty('--capa');

      const primeiro = episodios[0];
      heroEl.hidden = false;
      heroEl.innerHTML = `
        <div class="serie-bg"></div>
        <div class="serie-inner">
          <img class="serie-poster" id="capaSerie" src="${esc(capa || SEM_CAPA)}" alt="Capa de ${esc(nome)}" decoding="async">
          <div class="serie-texto">
            <span class="eyebrow">🎄 Série</span>
            <h1 id="tituloSerie">${esc(nome)}</h1>
            <p class="serie-meta" id="serieMeta">${nTemp} temporada${nTemp > 1 ? 's' : ''} · ${episodios.length} episódio${episodios.length > 1 ? 's' : ''}</p>
            <div class="serie-generos" id="serieGeneros" hidden></div>
            <div class="acoes">
              <a href="${esc(primeiro.link)}" class="btn btn-primary" data-i="0" aria-label="Assistir ${esc(nome)} desde o primeiro episódio">▶ Assistir T${primeiro._temp} · E${pad2(primeiro._ep)}</a>
              <button type="button" class="btn btn-vidro" id="btnFavSerie" aria-pressed="false"></button>
            </div>
          </div>
        </div>`;
      atualizarBotaoFavorito();
      pintarGeneros();
    }

    /** Mostra os gêneros da série no hero (se já foram calculados). */
    function pintarGeneros() {
      const box = $('serieGeneros');
      if (!box || !serieAtual) return;
      const generos = serieAtual.generos || [];
      box.innerHTML = generos.map((g) => `<span>${esc(g)}</span>`).join('');
      box.hidden = !generos.length;
      $('serieMeta').classList.toggle('solo', !generos.length);
    }

    /** Abas de temporada + lista de episódios da temporada ativa. */
    function renderizarPainel() {
      const temporadas = listaTemporadas();
      if (!temporadas.includes(temporadaAtiva)) temporadaAtiva = temporadas[0];

      const abas = temporadas.length > 1
        ? `<div class="abas" role="tablist" aria-label="Temporadas">${temporadas.map((t) =>
            `<button type="button" class="aba" role="tab" data-temp="${t}" aria-selected="${t === temporadaAtiva}">${t}ª Temporada</button>`).join('')}</div>`
        : '';

      conteudo.setAttribute('aria-busy', 'false');
      conteudo.innerHTML = `<section class="painel">${abas}<h2 class="painel-titulo">${temporadaAtiva}ª Temporada</h2><div class="lista-eps" id="listaEps" role="tabpanel"></div></section>`;
      renderizarLista();
    }

    function renderizarLista() {
      const nome = serieAtual.nome;
      let html = '';
      let atraso = 0;
      episodios.forEach((ep, i) => {
        if (ep._temp !== temporadaAtiva) return;
        const limpo = esc(tituloLimpo(ep, nome));
        html += `
          <a href="${esc(ep.link)}" class="ep-item" data-i="${i}" style="animation-delay:${Math.min(atraso++, 12) * 30}ms"
             aria-label="Assistir episódio ${ep._ep}: ${limpo}">
            <div class="ep-info">
              <span class="ep-numero">E${pad2(ep._ep)}</span>
              <span class="ep-titulo">${limpo}</span>
            </div>
            <div class="ep-play" aria-hidden="true">▶</div>
          </a>`;
      });
      $('listaEps').innerHTML = html;
    }

    function trocarTemporada(t) {
      temporadaAtiva = t;
      conteudo.querySelectorAll('.aba').forEach((a) => a.setAttribute('aria-selected', String(Number(a.dataset.temp) === t)));
      conteudo.querySelector('.painel-titulo').textContent = `${t}ª Temporada`;
      renderizarLista();
    }

    async function carregarEpisodios() {
      mostrarSkeleton();
      try {
        const promessaCls = carregarClassificacao(); // baixa em paralelo com o catálogo
        const catalogo = await buscarJson(CONFIG.CATALOGO_URL, CONFIG.FETCH_TIMEOUT_MS);
        if (!Array.isArray(catalogo)) throw new Error('Formato inválido do catálogo');
        const alvo = nomeSerieParam.trim().toLowerCase();
        episodios = catalogo
          .filter((item) => nomeDaSerie(item).toLowerCase() === alvo)
          .map(normalizarEpisodio)
          .sort((a, b) => a._temp - b._temp || a._ep - b._ep);

        if (!episodios.length) { mostrarMensagem('Nenhum episódio encontrado', 'Não encontramos episódios para esta série.'); return; }

        const nome = nomeDaSerie(episodios[0]); // nome canônico (mesma chave usada no index)
        const capa = (episodios[0].thumbnailUrl || '').trim();
        serieAtual = { nome, capa, link: `serie.html?nome=${encodeURIComponent(nome)}` };
        temporadaAtiva = episodios[0]._temp;
        document.title = `🎄 ${nome} - Clau Flix`;

        // Espera só um instante pela classificação (evita "pulo" visual); se atrasar, pinta os gêneros depois.
        const cedo = await Promise.race([promessaCls, atraso(CONFIG.CLASSIFICACAO_GRACA_MS)]);
        if (cedo !== SEM_RESPOSTA && cedo) serieAtual.generos = generosDaClassificacao(cedo, episodios);

        renderizarHero();
        renderizarPainel();

        if (cedo === SEM_RESPOSTA) {
          promessaCls.then((cls) => {
            if (!cls) return;
            serieAtual.generos = generosDaClassificacao(cls, episodios);
            pintarGeneros();
          });
        }
      } catch (erro) {
        console.error('Falha ao carregar episódios:', erro);
        mostrarErro(erro);
      }
    }

    // ===================================================================
    // 7. FAVORITO DA SÉRIE
    // ===================================================================
    const chaveFav = () => 'serie:' + serieAtual.nome;

    function atualizarBotaoFavorito() {
      const btn = $('btnFavSerie');
      if (!btn || !serieAtual) return;
      const ativo = lerFavoritos().some((f) => f.k === chaveFav());
      btn.classList.toggle('ativo', ativo);
      btn.setAttribute('aria-pressed', String(ativo));
      btn.textContent = ativo ? '★ Na Minha Lista' : '☆ Minha Lista';
      btn.setAttribute('aria-label', ativo ? `Remover ${serieAtual.nome} da Minha Lista` : `Adicionar ${serieAtual.nome} à Minha Lista`);
    }

    function alternarFavorito() {
      let lista = lerFavoritos();
      const k = chaveFav();
      if (lista.some((f) => f.k === k)) {
        lista = lista.filter((f) => f.k !== k);
      } else {
        lista.push({ k, titulo: serieAtual.nome, thumbnailUrl: serieAtual.capa, link: serieAtual.link, videoUrl: '', isAgrupado: true });
      }
      gravarFavoritos(lista);
      atualizarBotaoFavorito();
    }

    // ===================================================================
    // 8. PLAYER MODAL
    // ===================================================================
    let focoAnterior = null;

    /** Abre o episódio no modal (apenas PC; no celular o link original é seguido). */
    function abrirPlayer(videoUrl, titulo, linkHtml) {
      if (!videoUrl || !videoUrl.trim()) {
        alert('Link do vídeo não encontrado no catálogo. Abrindo página original.');
        window.location.href = linkHtml;
        return;
      }

      focoAnterior = document.activeElement;
      modalTitulo.textContent = titulo;
      linkOriginal.href = linkHtml;
      playerContainer.innerHTML = '<p>Carregando vídeo...</p>';
      videoModal.classList.add('aberto');
      document.body.classList.add('modal-aberto');
      $('btnFechar').focus();

      const ehEmbed = /youtube\.com|youtu\.be|embed|player/.test(videoUrl);
      if (ehEmbed) {
        playerContainer.innerHTML = `<iframe src="${esc(videoUrl)}" title="${esc(titulo)}" allowfullscreen allow="autoplay; encrypted-media"></iframe>`;
        return;
      }

      // Vídeos HTTP puro são bloqueados em páginas HTTPS: passam pelo Worker.
      const urlParaTocar = videoUrl.startsWith('http://') ? `${CONFIG.WORKER_URL}?url=${encodeURIComponent(videoUrl)}` : videoUrl;
      playerContainer.innerHTML = `<video id="meuPlayer" controls playsinline autoplay preload="metadata" src="${esc(urlParaTocar)}">Seu navegador não suporta vídeo HTML5.</video>`;
      $('meuPlayer').addEventListener('error', () => {
        playerContainer.innerHTML = `
          <div class="erro-player">
            <h3>Vídeo indisponível 😕</h3>
            <p>O navegador bloqueou a conexão com o vídeo.</p>
            <a href="${esc(linkHtml)}" class="btn-erro">Abrir Página Original</a>
          </div>`;
      });
    }

    function fecharModal() {
      videoModal.classList.remove('aberto');
      document.body.classList.remove('modal-aberto');
      playerContainer.innerHTML = '';
      if (focoAnterior && focoAnterior.focus) focoAnterior.focus();
    }

    // ===================================================================
    // 9. EVENTOS (DELEGAÇÃO)
    // ===================================================================
    document.addEventListener('click', (e) => {
      if (e.target.closest('[data-acao="tentar"]')) { carregarEpisodios(); return; }
      if (e.target.closest('#btnFavSerie')) { alternarFavorito(); return; }

      const aba = e.target.closest('.aba');
      if (aba) { trocarTemporada(Number(aba.dataset.temp)); return; }

      // Episódios da lista e botão "Assistir" do hero usam data-i (índice em `episodios`)
      const alvo = e.target.closest('[data-i]');
      const teclaModificadora = e.ctrlKey || e.metaKey || e.shiftKey || e.button !== 0;
      if (alvo && !isMobile() && !teclaModificadora) {
        const ep = episodios[Number(alvo.dataset.i)];
        if (!ep) return;
        e.preventDefault();
        abrirPlayer(ep.videoUrl, ep.titulo, ep.link);
      }
    });

    // Capa quebrada -> placeholder local
    heroEl.addEventListener('error', (e) => {
      if (e.target.id === 'capaSerie' && e.target.src !== SEM_CAPA) e.target.src = SEM_CAPA;
    }, true);

    window.addEventListener('scroll', () => $('topo').classList.toggle('rolou', window.scrollY > 20), { passive: true });
    $('btnFechar').addEventListener('click', fecharModal);
    videoModal.addEventListener('click', (e) => { if (e.target === videoModal) fecharModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && videoModal.classList.contains('aberto')) fecharModal(); });

    // ===================================================================
    // 10. INICIALIZAÇÃO
    // ===================================================================
    iniciarSlideshow();
    iniciarNeve();
    iniciarLuzes();

    if (!nomeSerieParam) {
      mostrarMensagem('Série não encontrada', 'Volte e escolha uma série.');
    } else {
      carregarEpisodios();
    }
  })();
  </script>
</body>
